  scale = clamp(Math.min(Math.floor(vw / W), Math.floor(vh / 190)), 2, 6);
  AH = Math.ceil(vh / scale);
  stage.width = W; stage.height = AH;
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (AH * scale) + 'px';
  sctx.imageSmoothingEnabled = false;
  for (const k in cache) delete cache[k];
}

function sceneOf(i) {
  const f = FRAMES[i];
  return f ? (SCENES[f.id] || null) : null;
}
function stateOf(i) {
  const f = FRAMES[i];
  if (!f) return {};
  if (f.station) return st[f.station.id];
  if (f.id === 'prologue') return pro;
  if (f.id === 'finale') return fin;
  return {};
}
function cached(i) {
  const f = FRAMES[i], sc = sceneOf(i);
  if (!sc || sc.live) return null;
  const key = f.id + '@' + AH;
  if (cache[key]) return cache[key];
  const c = document.createElement('canvas');
  c.width = W; c.height = AH;
  const cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;
  sc.paint(cc, AH);
  cache[key] = c;
  return c;
}

function drawFrame(i, y, t) {
  const sc = sceneOf(i);
  if (!sc) { sctx.fillStyle = '#04070d'; sctx.fillRect(0, y, W, AH); return; }
  sctx.save();
  sctx.beginPath(); sctx.rect(0, y, W, AH); sctx.clip();
  sctx.translate(0, y);
  const state = stateOf(i);
  if (sc.live) sc.draw(sctx, AH, t, state);
  else {
    sctx.drawImage(cached(i), 0, 0);
    if (sc.anim) sc.anim(sctx, AH, reduced ? 0 : t, state);
  }
  sctx.restore();
}

/** Межкадровая полоса с перфорацией — то, что делает переход плёночным. */
function drawGap(y) {
  sctx.fillStyle = '#0b0f16';
  sctx.fillRect(0, y, W, GAP);
  sctx.fillStyle = '#161d28';                      // основа ленты чуть светлее кадров
  sctx.fillRect(0, y + 2, W, GAP - 4);
  sctx.fillStyle = '#05080e';                      // кромки кадров
  sctx.fillRect(0, y, W, 2); sctx.fillRect(0, y + GAP - 2, W, 2);
  for (let x = 3; x < W; x += 15) {                // перфорация
    sctx.fillStyle = '#05080e';
    sctx.fillRect(x, y + 6, 9, 8);
    sctx.fillStyle = '#2c3849';
    sctx.fillRect(x, y + 6, 9, 1); sctx.fillRect(x, y + 6, 1, 8);
    sctx.fillStyle = '#3d4c60';
    sctx.fillRect(x + 8, y + 7, 1, 7); sctx.fillRect(x + 1, y + 13, 8, 1);
  }
}

function frame(now) {
  const t = now / 1000;
  const dt = Math.min(.05, t - lastT);
  lastT = t;
  FX.update(dt);
  if (phase === 'play' && FRAMES[idx].station && !dragging) idle += dt;

  sctx.fillStyle = '#04070d';
  sctx.fillRect(0, 0, W, AH);

  const span = AH + GAP;
  const off = Math.round(-cut * span);
  const sh = FX.shake > .05 && !reduced
    ? { x: Math.round((Math.random() - .5) * FX.shake), y: Math.round((Math.random() - .5) * FX.shake) }
    : { x: 0, y: 0 };
  if (cutting && !reduced) sh.x += (Math.floor(t * 24) % 3) - 1;   // лента гуляет в окне

  sctx.save();
  sctx.translate(sh.x, sh.y);
  drawFrame(idx, off, t);
  if (cut > 0.001 && idx + 1 < FRAMES.length) {
    drawGap(off + AH);
    drawFrame(idx + 1, off + span, t);
  }

  // подсказка жеста поверх сцены
  const f = FRAMES[idx];
  if (phase === 'play' && f.station && cut < .02) {
    const s = f.station, state = st[s.id];
    const show = !state.done && s.act !== 'still' && idle > 1.4;
    if (show) {
      sctx.save(); sctx.translate(0, off);
      drawDemo(sctx, AH, s, t);
      sctx.restore();
    }
    if (show !== demoOn) { demoOn = show; show ? showHint(s.hint) : hideHint(); }
  }
  sctx.save(); sctx.translate(0, off);              // искры принадлежат кадру и едут вместе с ним
  FX.draw(sctx);
  sctx.restore();
  sctx.restore();

  filmGrain(t, cutting ? 1 : Math.min(1, cut * 2.2));
  requestAnimationFrame(frame);
}

/* ── Смена кадра ─────────────────────────────────────────────── */
function goNext() {
  if (cutting || idx + 1 >= FRAMES.length) return;
  if (performance.now() < advanceLock) return;      // не проскочить цитату случайным касанием
  cutting = true;
  sealUp = false; sealEl.classList.remove('on');
  hideLine(); hideHint();
  SND.clack();
  SND.stopAmb();
  // лента идёт рывками, как в проекторе: 24 шага вместо плавного скольжения
  const from = cut, t0 = performance.now();
  const STEPS = 24;                                 // ровно двадцать четыре кадра в секунду
  let lastStep = -1;
  const step = now => {
    const k = clamp((now - t0) / REEL_MS, 0, 1);
    const eased = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const q = Math.round(lerp(from, 1, eased) * STEPS) / STEPS;
    cut = q;
    const si = Math.round(q * STEPS);
    if (si !== lastStep) { lastStep = si; if (si % 2 === 0) SND.tick(); }
    if (k < 1) return requestAnimationFrame(step);
    idx++; cut = 0; cutting = false;
    FX.clear();
    enterFrame();
  };
  requestAnimationFrame(step);
}
function snapBack() {
  const from = cut, t0 = performance.now();
  const step = now => {
    const k = clamp((now - t0) / 220, 0, 1);
    cut = lerp(from, 0, smooth(k));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function enterFrame() {
  const f = FRAMES[idx];
  idle = 0; demoOn = false; sealUp = false; wheelAcc = 0; advanceLock = 0;
  sealEl.classList.remove('on');
  if (f.id === 'prologue') { pro.beat = 0; pro.t0 = performance.now() / 1000; phase = 'play'; showLine(TEXT.prologue[0]); showHint(TEXT.tapOn); SND.ambient(AMB.prologue); return; }
  if (f.id === 'finale') { phase = 'done'; hideLine(); hideHint(); startFinale(); return; }
  const s = f.station;
  SND.ambient(AMB[s.id]);
  if (st[s.id].done) { phase = 'sealed'; hideLine(); showHint(TEXT.next); return; }
  phase = 'play';
  showLine(s.say);
  hideHint();
  if (s.act === 'still') beginStill();
}

/* ── Надписи ─────────────────────────────────────────────────── */
function showLine(txt) { sayEl.textContent = txt; sayEl.classList.add('on'); }
function hideLine() { sayEl.classList.remove('on'); }
function showHint(txt) { hintEl.textContent = txt; hintEl.classList.add('on'); }
function hideHint() { hintEl.classList.remove('on'); }

/* ── Завершение станции ──────────────────────────────────────── */
function complete() {
  const s = FRAMES[idx].station, state = st[s.id];
  if (state.done) return;
  state.done = true;
  const fire = (s.options && state.pick != null) ? s.options[state.pick].fire : s.fire;
  state.fire = fire;
  phase = 'sealed';
  demoOn = false;
  advanceLock = performance.now() + 1100;

  const A = actionPoint(s, AH);
  FX.burst(A.x, A.y, [fire, '#ffffff', mix(fire, '#ffffff', .5)], 42, { speed: 58, g: 26, life: 1.1 });
  FX.flash(fire, .5);
  FX.hit(reduced ? 0 : 5);
  SND.got(KEY[s.id] || 392);
  SND.thud();

  hideLine(); hideHint();

  // предмет летит в свою ячейку инвентаря
  const it = itemOf(s);
  const slot = bagEl.children[STATIONS.indexOf(s)];
  const r = slot ? slot.getBoundingClientRect() : null;
  const cr = stage.getBoundingClientRect();
  const tx = r ? (r.left + r.width / 2 - cr.left) / scale : W / 2;
  const ty = r ? (r.top + r.height / 2 - cr.top) / scale : AH - 8;
  FX.fly(A.x, A.y, tx, ty, fire, it.icon, () => {
    fillSlot(STATIONS.indexOf(s), it.icon, fire);
    SND.spark(4);
    if (!done.includes(s.id)) done.push(s.id);
    save();
  });

  setTimeout(() => {
    document.getElementById('sealText').textContent = s.quote;
    document.getElementById('sealSrc').textContent = s.src;
    document.getElementById('sealGot').textContent = it.item;
    sealEl.classList.add('on');
    sealUp = true;
  }, 760);
  setTimeout(dropSeal, 4600);
}
/** Первое касание убирает цитату, следующее — перематывает кадр. */
function dropSeal() {
  if (!sealUp) return false;
  sealUp = false;
  sealEl.classList.remove('on');
  showHint(TEXT.next);
  return true;
}

function actionPoint(s, h) {
  switch (s.act) {
    case 'hold':   { const a = SCENES.moscow.act(h); return { x: a.x, y: a.y - 30 }; }
    case 'choice': { const p = SCENES.niichavo.spots(h)[st.niichavo.pick || 0]; return { x: p.x, y: p.y + 8 }; }
    case 'taps':   { const c = SCENES.desert.crystal(h); return { x: c.x, y: c.y - 10 }; }
    case 'pull':   { const a = SCENES.arrakis.thumper(h); return { x: a.x, y: a.y - 6 }; }
    case 'draw':   { const a = SCENES.westeros.brazier(h); return { x: a.x, y: a.y - 12 }; }
    case 'fan':    { const a = SCENES.camp.fire(h); return { x: a.x, y: a.y - 10 }; }
    default:       { const v = SCENES.lorien.vial(h); return { x: v.x, y: v.y - 8 }; }
  }
}

/* ── Ввод ────────────────────────────────────────────────────── */
let ptr = null;
const artPt = e => {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
};

stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  SND.boot(); SND.resume();
  if (cutting) return;                              // пока идёт плёнка, ввод не принимаем
  if (!SND.ambCfg) SND.ambient(AMB[FRAMES[idx].id] || AMB.prologue);
  stage.setPointerCapture(e.pointerId);
  const p = artPt(e);
  ptr = { x0: p.x, y0: p.y, x: p.x, y: p.y, moved: 0 };
  idle = 0;

  const f = FRAMES[idx];
  if (phase === 'sealed') { dragging = true; return; }   // кадр готов — тянем плёнку
  if (f.id === 'prologue') return;
  if (!f.station) return;

  const s = f.station, state = st[s.id];
  if (state.done) return;

  if (s.act === 'hold') { state.holding = true; SND.noise(.2, { f0: 300, f1: 900, gain: .05 }); }
  if (s.act === 'still') rippleNow();
  if (s.act === 'choice') {
    SCENES.niichavo.spots(AH).forEach((sp, i) => {
      if (state.pick != null) return;
      if (Math.abs(p.x - sp.x) < 12 && p.y > sp.y - 10 && p.y < sp.y + 26) {
        state.pick = i;
        FX.burst(sp.x, sp.y + 8, s.options[i].fire, 16, { speed: 30, life: .6 });
        SND.tap(); SND.spark(i);
        complete();
      }
    });
  }
  if (s.act === 'taps') {
    const D = SCENES.desert;
    if ((state.zoom || 0) < 1) {                      // общий план: приблизиться к подносу
      const T = D.tray(AH);
      if (Math.abs(p.x - T.x) < 26 && Math.abs(p.y - T.y) < 20) zoomToTray(state);
      else SND.tap();
    } else {                                          // приближение: бить молотком
      const b = D.slab(AH);
      if (p.x > b.x - 14 && p.x < b.x + b.w + 14 && p.y > b.y - 22 && p.y < b.y + b.h + 16) {
        D.split(state);
        state.hammer = 1;
        FX.burst(b.x + b.w / 2, b.y + b.h / 2, ['#4fd6e8', '#bff4fb', '#e8fdff'], 16,
          { speed: 52, g: 120, life: .6, dir: -1.57, spread: 2.6 });
        FX.hit(reduced ? 0 : 5);
        SND.crack();
        SND.noise(.18, { f0: 5200, f1: 1800, gain: .10, q: .5 });
        if (state.hits >= D.HITS) complete();
      } else SND.tap();
    }
  }
  if (s.act === 'draw') {
    state.marks = state.marks || [false, false, false, false, false];
    markRune(p.x, p.y, state);
  }
}, { passive: false });

stage.addEventListener('pointermove', e => {
  if (!ptr) return;
  e.preventDefault();
  const p = artPt(e);
  ptr.moved += Math.abs(p.y - ptr.y) + Math.abs(p.x - ptr.x);
  ptr.x = p.x; ptr.y = p.y;

  if (dragging) {
    cut = clamp((ptr.y0 - p.y) / (AH * .30), 0, 1);
    if (cut > .04) { hideLine(); hideHint(); dropSeal(); }   // на склейке экран чист
    return;
  }
  const f = FRAMES[idx];
  if (!f.station) return;
  const s = f.station, state = st[s.id];
  if (state.done) return;

  if (s.act === 'pull') {
    const d = clamp((p.y - ptr.y0) / 34, 0, 1);
    if (d > (state.pull || 0)) {
      const A = SCENES.arrakis.thumper(AH);
      if (Math.random() > .6) FX.burst(A.x, A.y, ['#e8c08a', '#c09a68'], 2, { speed: 18, life: .5 });
      state.pull = d;
    }
    if (state.pull >= 1 && !state.armed) {
      state.armed = true;
      SND.thud(); FX.hit(reduced ? 0 : 4);
      setTimeout(() => { if (!state.done) complete(); }, 950);
    }
  }
  if (s.act === 'draw') markRune(p.x, p.y, state);
  if (s.act === 'fan') {
    if (ptr.y0 - p.y > 15) {
      state.fan = clamp((state.fan || 0) + 1, 0, 3);
      ptr.y0 = p.y;
      const F = SCENES.camp.fire(AH);
      FX.burst(F.x, F.y - 6, ['#ffd88a', '#e8a24e', '#c93a1e'], 18,
        { speed: 46, g: -18, life: .9, dir: -1.57, spread: 1.5 });
      SND.whoosh(true);
      SND.noise(.5, { f0: 240, f1: 90, gain: .08, type: 'lowpass' });
      if (state.fan >= 3) complete();
    }
  }
}, { passive: false });

function endPtr() {
  const f = FRAMES[idx];
  if (dragging) {
    dragging = false;
    const tap = ptr && ptr.moved < 14 && cut < .05;
    if (cut > .26) goNext();
    else if (tap) { if (!dropSeal()) goNext(); }      // короткое касание тоже листает
    else snapBack();
    ptr = null; return;
  }
  if (f.id === 'prologue' && ptr && ptr.moved < 12) advancePrologue();
  if (f.station) {
    const state = st[f.station.id];
    if (f.station.act === 'hold') state.holding = false;
  }
  ptr = null;
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);

/** Листать можно и колесом — на ноутбуке это первое, что пробуют. */
addEventListener('wheel', e => {
  SND.boot(); SND.resume();
  idle = 0;
  if (FRAMES[idx].id === 'prologue' && phase === 'play') {
    wheelAcc += e.deltaY;
    if (wheelAcc > 60) { wheelAcc = 0; advancePrologue(); }
    return;
  }
  if (phase !== 'sealed' || cutting) return;
  wheelAcc += e.deltaY;
  if (wheelAcc > 60) { wheelAcc = 0; if (!dropSeal()) goNext(); }
  if (wheelAcc < -200) wheelAcc = 0;
}, { passive: true });

/** И с клавиатуры — пробел, ввод, стрелки. */
addEventListener('keydown', e => {
  if (!['Space', 'Enter', 'ArrowDown', 'ArrowRight', 'PageDown'].includes(e.code)) return;
  e.preventDefault();
  SND.boot(); SND.resume();
  idle = 0;
  if (FRAMES[idx].id === 'prologue' && phase === 'play') return advancePrologue();
  if (phase === 'sealed' && !cutting) { if (!dropSeal()) goNext(); }
});

function advancePrologue() {
  if (pro.beat < 2) {
    pro.beat++; pro.t0 = performance.now() / 1000;
    showLine(TEXT.prologue[pro.beat]);
    SND.noise(.4, { f0: 900, f1: 200, gain: .07 });
    if (pro.beat === 2) { phase = 'sealed'; showHint(TEXT.next); }
    else showHint(TEXT.tapOn);
  }
}

function markRune(x, y, state) {
  const pts = SCENES.westeros.runePts(AH);
  pts.forEach((pt, i) => {
    if (state.marks[i]) return;
    if (Math.abs(x - pt.x) < 9 && Math.abs(y - pt.y) < 10) {
      state.marks[i] = true;
      FX.burst(pt.x, pt.y, ['#ffcf7a', '#ff7a2e'], 12, { speed: 30, life: .6 });
      SND.spark(i);
      SND.noise(.12, { f0: 1200, f1: 400, gain: .06 });
    }
  });
  if (state.marks.every(Boolean) && !state.done) {
    const A = SCENES.westeros.brazier(AH);
    FX.burst(A.x, A.y - 8, ['#ffe9a8', '#e8452c'], 30, { speed: 50, g: -20, life: 1, dir: -1.57, spread: 1.4 });
    complete();
  }
}
/** Наезд камеры на поднос: общий план сменяется приближением. */
function zoomToTray(state) {
  if (state.zooming) return;
  state.zooming = true;
  SND.whoosh(false);
  SND.tone(180, .5, { to: 90, gain: .07, type: 'sine' });
  const t0 = performance.now();
  const step = now => {
    const k = clamp((now - t0) / 820, 0, 1);
    state.zoom = smooth(k);
    if (k < 1) requestAnimationFrame(step);
    else {
      state.zoom = 1; state.zooming = false; idle = 0;
      const s = FRAMES[idx].station;
      if (s && s.say2) showLine(s.say2);
    }
  };
  requestAnimationFrame(step);
}

function rippleNow() {
  const state = st.lorien;
  state.ripple = 1; state.still = 0;
  SND.noise(.3, { f0: 700, f1: 240, gain: .06 });
  clearTimeout(rippleNow._t);
  rippleNow._t = setTimeout(() => { state.ripple = 0; }, 900);
}
function beginStill() {
  const state = st.lorien;
  state.still = 0;
  clearInterval(beginStill._i);
  beginStill._i = setInterval(() => {
    const f = FRAMES[idx];
    if (!f.station || f.station.id !== 'lorien' || state.done) { clearInterval(beginStill._i); return; }
    if (state.ripple > 0) return;
    const before = state.still;
    state.still = clamp(state.still + .022, 0, 1);
    if (Math.floor(before * 8) !== Math.floor(state.still * 8)) {
      SND.fillTone(state.still);
      const P = SCENES.lorien.pool(AH), V = SCENES.lorien.vial(AH);
      FX.parts.push({ x: P.x, y: P.y, vx: (V.x - P.x) * .55, vy: (V.y - 8 - P.y) * .55,
        g: 0, life: 1.8, age: 0, col: '#dfe9f5', size: 1 });
    }
    if (state.still >= 1) { clearInterval(beginStill._i); complete(); }
  }, 100);
}

/* удержание свечи */
/* молоток отскакивает после удара */
setInterval(() => {
  const d = st.desert;
  if (d && d.hammer > 0) d.hammer = Math.max(0, d.hammer - .18);
}, 40);

setInterval(() => {
  const f = FRAMES[idx];
  if (!f.station || f.station.act !== 'hold') return;
  const state = st.moscow;
  if (state.done) return;
  const before = state.progress || 0;
  state.progress = clamp(before + (state.holding ? .035 : -.05), 0, 1);
  if (state.holding && Math.random() > .55) {
    const A = SCENES.moscow.act(AH);
    FX.burst(A.x, A.y - 34, ['#ffb648', '#ffd98a'], 2, { speed: 14, g: -14, life: .8 });
  }
  if (state.holding && Math.floor(before * 6) !== Math.floor(state.progress * 6)) SND.fillTone(state.progress);
  if (state.progress >= 1) complete();
}, 60);

/* ── Сумка ───────────────────────────────────────────────────── */
function buildBag() {
  bagEl.innerHTML = '';
  for (let i = 0; i < STATIONS.length; i++) {
    const c = document.createElement('canvas');
    c.className = 'slot';
    c.width = 11; c.height = 11;
    bagEl.appendChild(c);
  }
}
/** Кладёт предмет в ячейку: миниатюра плюс свечение его цветом. */
function fillSlot(i, icon, col) {
  const c = bagEl.children[i];
  if (!c) return;
  const cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;
  cc.clearRect(0, 0, 11, 11);
  drawIcon(cc, icon, 0, 0, 1);
  c.classList.add('full');
  c.style.boxShadow = '0 0 9px 1px ' + col + '66';
  c.style.borderColor = col + '99';
}
function itemOf(s) {
  const d = st[s.id];
  return (s.options && d.pick != null) ? s.options[d.pick] : s;
}

/* ── Сохранение ──────────────────────────────────────────────── */
const KEYS = 'lighthouse.film.v1';
function save() {
  try {
    localStorage.setItem(KEYS, JSON.stringify({
      done, pick: st.niichavo.pick == null ? null : st.niichavo.pick
    }));
  } catch (e) {}
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEYS) || 'null');
    if (!r || !Array.isArray(r.done)) return;
    done = r.done.filter(id => STATIONS.some(s => s.id === id));
    if (r.pick != null) st.niichavo.pick = r.pick;
    done.forEach(id => {
      const s = STATIONS.find(x => x.id === id), d = st[id];
      d.done = true; d.progress = 1; d.zoom = 1; d.pull = 1; d.armed = true;
      d.fan = 3; d.still = 1; d.marks = [true, true, true, true, true];
      d.fire = (s.options && d.pick != null) ? s.options[d.pick].fire : s.fire;
    });
  } catch (e) {}
}

document.getElementById('reset').addEventListener('click', () => {
  try { localStorage.removeItem(KEYS); } catch (e) {}
  location.reload();
});
soundBtn.addEventListener('click', () => {
  SND.boot(); SND.resume();
  SND.mute(!SND.muted);
  soundBtn.textContent = SND.muted ? TEXT.soundOff : TEXT.soundOn;
  if (!SND.muted && !SND.ambCfg) SND.ambient(AMB[FRAMES[idx].id] || AMB.prologue);
});

/* ═══════════════════════════════════════════════════════════════
   ФИНАЛ: подъём, семь огней, луч, общий план
   ═══════════════════════════════════════════════════════════════ */
SCENES.finale = {
  live: true,
  draw(ctx, h, t, s) {
    const bt = t - s.t0;

    if (s.beat <= 0) {                                   // подъём по лестнице
      const key = 'stairsPan@' + h;
      if (!cache[key]) {
        const c = document.createElement('canvas');
        c.width = W; c.height = h * 2;
        const cc = c.getContext('2d');
        cc.imageSmoothingEnabled = false;
        SCENES.stairs.paint(cc, h * 2);
        cache[key] = c;
      }
      const pan = Math.round(clamp(bt / 4.2, 0, 1) * h);
      ctx.drawImage(cache[key], 0, h - pan, W, h, 0, 0, W, h);
      SCENES.stairs.anim(ctx, h, t, s);
      return;
    }

    if (s.beat === 1) {                                  // фонарная комната
      const key = 'lampRoom@' + h;
      if (!cache[key]) {
        const c = document.createElement('canvas');
        c.width = W; c.height = h;
        const cc = c.getContext('2d');
        cc.imageSmoothingEnabled = false;
        SCENES.lamp.paint(cc, h);
        cache[key] = c;
      }
      ctx.drawImage(cache[key], 0, 0);
      SCENES.lamp.anim(ctx, h, t, s);
      return;
    }

    // общий план: маяк снова горит
    const k = clamp(bt / 2.2, 0, 1);
    const hz = Math.round(h * .66);
    vgrad(ctx, 0, hz, '#04070f', '#0e2338', 7);
    scatter(ctx, '#cfd8e4', 74, 0, 0, W, hz - 14, 5);
    vgrad(ctx, hz, h, '#0b1c2e', '#050b14', 6);
    const spread = [4, 20, 33, 49, 71, 88, 108];
    s.colors.forEach((c, i) => {
      const x = spread[i], y = hz - 3 - ((i * 7) % 5);
      glow(ctx, x, y, 3 + Math.abs(Math.sin(t * 1.4 + i * 1.7)) * 1.5, c, k * .55);
      ctx.globalAlpha = k * .9; ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); ctx.globalAlpha = 1;
    });
    const rockY = Math.round(h * .80);
    drawRock(ctx, 60, rockY, 30, 311);
    const lampY = drawTower(ctx, 60, rockY, 40);
    drawBeams(ctx, 60, lampY, .28 * k, t * .45, 130, '#ffffff');
    drawLamp(ctx, 60, lampY, k, '#fff6d8');
    drawSea(ctx, rockY + 14, h, '#1d3f5e');
    reflect(ctx, 60, rockY + 16, h, '#ffffff', k * .55);
  }
};

function startFinale() {
  fin.colors = STATIONS.map(s => st[s.id].fire || s.fire);
  fin.icons = STATIONS.map(s => itemOf(s).icon);
  fin.lit = 0; fin.merge = 0; fin.beat = 0; fin.t0 = performance.now() / 1000;
  SND.ambient(AMB.finale);
  SND.tone(110, 3, { gain: .10, type: 'sine' });

  const at = (ms, fn) => setTimeout(fn, ms);
  at(4400, () => {                                       // склейка в машинный зал
    fin.beat = 1; fin.t0 = performance.now() / 1000;
    SND.clack();
  });
  // предметы по одному покидают инвентарь и уходят в гнёзда аппарата
  for (let i = 0; i < 7; i++) at(5600 + i * 820, () => {
    const so = SCENES.lamp.sockets(AH)[i];
    const cell = bagEl.children[i];
    const cr = stage.getBoundingClientRect();
    let sx = W / 2, sy = AH - 6;
    if (cell) {
      const r = cell.getBoundingClientRect();
      sx = (r.left + r.width / 2 - cr.left) / scale;
      sy = (r.top + r.height / 2 - cr.top) / scale;
      cell.classList.remove('full');
      cell.style.boxShadow = 'none';
      cell.getContext('2d').clearRect(0, 0, 11, 11);
    }
    SND.whoosh(true);
    FX.fly(sx, sy, so.x, so.y, fin.colors[i], fin.icons[i], () => {
      fin.lit = i + 1;
      FX.burst(so.x, so.y, [fin.colors[i], '#ffffff'], 18, { speed: 34, g: 0, life: .8 });
      FX.flash(fin.colors[i], .20);
      SND.tone(KEY[STATIONS[i].id] || 392, .9, { gain: .13, type: 'triangle' });
      SND.noise(.2, { f0: 1400, f1: 500, gain: .05 });
    });
  });
  at(12200, () => {                                      // аппарат запускается
    const t0 = performance.now();
    const step = now => {
      fin.merge = clamp((now - t0) / 2200, 0, 1);
      if (fin.merge < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    SND.arp([262, 330, 392, 523], .12, { dur: 2.8, gain: .10 });
    SND.noise(2.4, { f0: 90, f1: 420, gain: .09, type: 'lowpass' });
  });
  at(14600, () => {
    FX.flash('#ffffff', 1.6);
    FX.hit(reduced ? 0 : 6);
    SND.noise(1.6, { f0: 200, f1: 2600, gain: .16, q: .6 });
    SND.tone(65, 2.4, { gain: .20 });
  });
  at(15200, () => { fin.beat = 2; fin.t0 = performance.now() / 1000; SND.clack(); });
  at(16900, () => {
    renderLabel(document.getElementById('finaleTitle'), TEXT.finaleTitle, Math.max(2, scale - 1), '#e0a94a');
    document.getElementById('finaleWish').textContent = TEXT.finaleWish;
    document.getElementById('finaleStack').classList.add('on');
    SND.arp([392, 494, 587, 784], .18, { dur: 3.2, gain: .11 });
  });
}

/* ═══════════════════════════════════════════════════════════════
   ЗАПУСК
   ═══════════════════════════════════════════════════════════════ */
function boot() {
  load();
  buildBag();
  layout();
  done.forEach(id => {
    const s = STATIONS.find(x => x.id === id), it = itemOf(s);
    fillSlot(STATIONS.indexOf(s), it.icon, st[id].fire || s.fire);
  });
  if (done.length) {
    const nextIdx = FRAMES.findIndex(f => f.station && !done.includes(f.station.id));
    idx = nextIdx === -1 ? FRAMES.length - 1 : nextIdx;
  }
  soundBtn.textContent = TEXT.soundOn;
  enterFrame();
  requestAnimationFrame(frame);
}

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { layout(); }, 160);
});

boot();
</script>
