<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Маяк</title>

<style>
:root {
  --ground:  #04070d;
  --ink:     #e8dcc0;
  --ink-dim: #8c8674;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans:  ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
}
* , *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: #04070d;
  height: 100%; overflow: hidden;                /* плёнка листается, а не прокручивается */
  overscroll-behavior: none;
}

.app {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible { outline: 2px solid #e0a94a; outline-offset: 3px; }

/* Полотно мира — приколото к экрану, прокручивается «камера» */
#stage {
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  image-rendering: pixelated;
  touch-action: none;                            /* жесты принадлежат сцене */
  z-index: 1;
}

/* ── Надписи рассказчика ───────────────────────────────── */
.say {
  position: fixed;
  left: 50%; bottom: 84px;
  transform: translateX(-50%) translateY(10px);
  z-index: 6;
  width: min(30ch, calc(100vw - 44px));
  margin: 0;
  text-align: center;
  font-size: 17px;
  line-height: 1.5;
  text-wrap: balance;
  text-shadow: 0 2px 12px #04070d, 0 0 26px #04070d;
  opacity: 0;
  pointer-events: none;
  transition: opacity .55s ease, transform .55s ease;
}
.say.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Печать с цитатой ──────────────────────────────────── */
.seal {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(1.14);
  z-index: 8;
  width: min(34ch, calc(100vw - 40px));
  padding: 22px 24px;
  background: rgba(6, 10, 17, .93);
  border: 1px solid #6d5327;
  box-shadow: 0 0 0 1px rgba(224,169,74,.13), 0 18px 60px rgba(0,0,0,.7);
  text-align: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;              /* карточка не должна съедать касания */
  transition: opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1), visibility .4s;
}
.seal.on { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
.seal q {
  display: block;
  font-size: 19px;
  line-height: 1.45;
  font-style: italic;
  quotes: "«" "»";
}
.seal .src {
  display: block;
  margin-top: 14px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .09em;
  color: #9a8a63;
}
.seal .got {
  display: block;
  margin-top: 18px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #e0a94a;
}

/* ── Сумка: семь гнёзд ─────────────────────────────────── */
.bag {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  z-index: 7;
  display: flex;
  gap: 9px;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.slot {
  width: 26px; height: 26px;
  padding: 1px;
  border: 1px solid #232d3b;
  background: rgba(8, 13, 21, .55);
  image-rendering: pixelated;
  opacity: .55;
  transition: opacity .5s ease, box-shadow .5s ease, border-color .5s ease;
}
.slot.full { opacity: 1; }

/* ── Подсказка «дальше» ────────────────────────────────── */
.hint {
  position: fixed;
  left: 50%; bottom: 46px;
  transform: translateX(-50%);
  z-index: 6;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #7d8496;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}
.hint.on { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }

/* ── Финальные титры поверх кадра ──────────────────────── */
.titles {
  position: fixed;
  left: 50%; top: max(9vh, 56px);
  transform: translateX(-50%);
  z-index: 12;
  width: min(30ch, calc(100vw - 40px));
  display: grid;
  gap: 20px;
  justify-items: center;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.6s ease;
}
.titles.on { opacity: 1; }
.titles canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
.titles .wish {
  margin: 0;
  font-size: 20px;
  line-height: 1.5;
  text-wrap: balance;
  text-shadow: 0 2px 16px #04070d, 0 0 30px #04070d;
}

/* ── Меню ──────────────────────────────────────────────── */
.menu {
  position: fixed;
  top: calc(8px + env(safe-area-inset-top));
  right: max(8px, calc(50vw - 184px));
  z-index: 9;
  display: flex;
  gap: 2px;
}
.menu button {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #4d5666;
  background: none;
  border: 0;
  padding: 8px 10px;
  cursor: pointer;
  opacity: .6;
}
.menu button:hover { color: var(--ink); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}
</style>

/* ═══════════════════════════════════════════════════════════════
   ПИКСЕЛЬНЫЕ УТИЛИТЫ
   ═══════════════════════════════════════════════════════════════ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, t) => smooth(clamp((t - a) / (b - a), 0, 1));

function mix(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const v = s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t);
  return '#' + ((1 << 24) | (v(16) << 16) | (v(8) << 8) | v(0)).toString(16).slice(1);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), c = v => clamp(Math.round(v), 0, 255);
  return '#' + ((1 << 24) | (c(((n >> 16) & 255) + amt) << 16) |
    (c(((n >> 8) & 255) + amt) << 8) | c((n & 255) + amt)).toString(16).slice(1);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNoise(seed) {
  const rnd = mulberry32(seed), G = 64, g = new Float32Array(G * G);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const at = (x, y) => g[(((y % G) + G) % G) * G + (((x % G) + G) % G)];
  return function (x, y, oct) {
    let s = 0, amp = .5, f = 1, norm = 0;
    for (let i = 0; i < (oct || 3); i++) {
      const x0 = Math.floor(x * f), y0 = Math.floor(y * f);
      const fx = smooth(x * f - x0), fy = smooth(y * f - y0);
      const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
      s += ((a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy) * amp;
      norm += amp; amp *= .5; f *= 2;
    }
    return s / norm;
  };
}

const W = 120;                                   // ширина мира в пикселях арта
const FEET = .62;                                // доля высоты кадра, где земля

function band(ctx, y, h, col) { ctx.fillStyle = col; ctx.fillRect(0, y, W, h); }
function vgrad(ctx, y0, y1, top, bot, n) {
  const h = y1 - y0;
  for (let i = 0; i < n; i++) {
    const a = Math.round(y0 + h * i / n), b = Math.round(y0 + h * (i + 1) / n);
    ctx.fillStyle = mix(top, bot, i / Math.max(1, n - 1));
    ctx.fillRect(0, a, W, b - a);
    if (i < n - 1) {                              // дизеринг на стыке полос
      ctx.fillStyle = mix(top, bot, (i + 1) / (n - 1));
      for (let x = i % 2; x < W; x += 2) ctx.fillRect(x, b - 1, 1, 1);
    }
  }
}
function vgradIn(ctx, x, y, w, h, top, bot) {
  for (let i = 0; i < h; i++) {
    ctx.fillStyle = mix(top, bot, i / Math.max(1, h - 1));
    ctx.fillRect(x, y + i, w, 1);
  }
}
function disc(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(r * r - y * y));
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}
/** Мягкое свечение слоями — один диск на прозрачности читается как шар. */
function glow(ctx, cx, cy, r, col, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';          // свет складывается, а не кроет
  for (let i = 3; i >= 1; i--) {
    ctx.globalAlpha = a * (.08 + (3 - i) * .10);
    disc(ctx, cx, cy, Math.max(1, Math.round(r * i / 3)), col);
  }
  ctx.restore();
}
/** Дорожка света на воде: расходящийся книзу конус, разбитый в дизеринг. */
function reflect(ctx, cx, y0, y1, col, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = col;
  const rnd = mulberry32(4242);
  for (let y = y0; y < y1; y++) {
    const d = (y - y0) / Math.max(1, y1 - y0);
    const half = 1 + Math.round(d * 10);
    for (let x = cx - half; x <= cx + half; x++) {
      const r = rnd();
      if ((x + y) % 2 && r < .55) continue;                 // дизеринг
      const edge = 1 - Math.abs(x - cx) / (half + 1.2);
      const v = a * (1 - d * .75) * edge * edge * (.45 + r * .55);
      if (v < .03) continue;
      ctx.globalAlpha = Math.min(1, v);
      ctx.fillRect(x, y, 1, 1);
    }
  }
  ctx.restore();
}
function ring(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let a = 0; a < 360; a += 4) {
    const t = a * Math.PI / 180;
    ctx.fillRect(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), 1, 1);
  }
}
function scatter(ctx, col, n, x0, y0, w, h, seed) {
  const rnd = mulberry32(seed);
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) ctx.fillRect(x0 + Math.floor(rnd() * w), y0 + Math.floor(rnd() * h), 1, 1);
}
/** Силуэт холмов/крон: заполняет всё, что ниже линии шума. */
function ridge(ctx, col, baseY, amp, freq, seed, toY) {
  const n = makeNoise(seed);
  ctx.fillStyle = col;
  for (let x = 0; x < W; x++) {
    const y = Math.round(baseY - n(x * freq, 3.5, 3) * amp);
    ctx.fillRect(x, y, 1, (toY == null ? baseY + amp * 2 : toY) - y);
  }
}
/** Каплевидное пламя — основа половины сцен. */
function flame(ctx, cx, baseY, size, t, hot, cool, seed) {
  seed = seed || 0;
  for (let i = 0; i < size; i++) {
    const w = Math.max(1, Math.round((size - i) * .52));
    ctx.fillStyle = mix(hot, cool, Math.min(1, i / size * 1.15));
    const wob = Math.round(Math.sin(t * 6.5 + i * .55 + seed) * (i / size) * 1.6);
    ctx.fillRect(cx - (w >> 1) + wob, baseY - i, w, 1);
  }
}
/** Ромбик — читается лучше, чем круг радиусом 1-2. */
function gem(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const w = r - Math.abs(y);
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}
/** Мягкое затухание в темноту сверху и снизу блока. */
function fadeEdges(ctx, h, top, bottom, col) {
  for (let i = 0; i < top; i++) {
    ctx.globalAlpha = 1 - i / top;
    ctx.fillStyle = col; ctx.fillRect(0, i, W, 1);
  }
  for (let i = 0; i < bottom; i++) {
    ctx.globalAlpha = 1 - i / bottom;
    ctx.fillStyle = col; ctx.fillRect(0, h - 1 - i, W, 1);
  }
  ctx.globalAlpha = 1;
}

/* ── Растровый шрифт: 8 строк, верхняя под диакритику ─────────── */
const GLYPHS = {

  'А': '...../.###./#...#/#...#/#####/#...#/#...#/#...#',

const GCACHE = {};

  tr = tr == null ? 1 : tr;
  ctx.fillStyle = col;

  for (const ch of s) {

    for (let r = 0; r < g.length; r++)
      for (let c = 0; c < g[r].length; c++)
        if (g[r][c] === '#') ctx.fillRect(cx + c, y + r, 1, 1);
    cx += g[0].length + tr;
  }
}
function renderLabel(canvas, s, scale, col, tr) {
  tr = tr == null ? 1 : tr;
  const w = textWidth(s, tr) + 2, h = 10;
  canvas.width = w; canvas.height = h;
  canvas.style.width = (w * scale) + 'px';
  canvas.style.height = (h * scale) + 'px';
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, w, h);
  drawText(c, s, 1, 1, col, tr);
}

function drawRock(ctx, cx, baseY, halfW, seed) {
  const rn = makeNoise(seed || 207);
  for (let x = cx - halfW; x < cx + halfW; x++) {
    const q = Math.abs(x - cx) / halfW;
    const hh = Math.round(4 + rn(x * .16, 2, 4) * 20 * (1 - q * .55) - q * q * 10);
    if (hh < 1) continue;
    ctx.fillStyle = '#101823'; ctx.fillRect(x, baseY - hh, 1, hh + 18);
    ctx.fillStyle = '#1e2c3b'; ctx.fillRect(x, baseY - hh, 1, 1);
    if (rn(x * .3, 7, 2) > .62) { ctx.fillStyle = '#182432'; ctx.fillRect(x, baseY - hh + 2, 1, 3); }
  }
}
/** Возвращает y фонаря — от него идут лучи. */
function drawTower(ctx, cx, baseY, hgt) {
  const top = baseY - hgt;
  for (let y = 0; y < hgt; y++) {
    const wdt = Math.round(14 - (1 - y / hgt) * 4);
    ctx.fillStyle = '#2c3a4a'; ctx.fillRect(cx - (wdt >> 1), top + y, wdt, 1);
    ctx.fillStyle = '#202c3a'; ctx.fillRect(cx - (wdt >> 1), top + y, 3, 1);
    ctx.fillStyle = '#3a4c60'; ctx.fillRect(cx + (wdt >> 1) - 1, top + y, 1, 1);
  }
  ctx.fillStyle = '#1b2632';
  for (let y = top + 10; y < baseY; y += 12) ctx.fillRect(cx - 8, y, 16, 1);
  ctx.fillStyle = '#3a4a5c'; ctx.fillRect(cx - 9, top - 9, 18, 9);       // галерея
  ctx.fillStyle = '#4a5c72'; ctx.fillRect(cx - 10, top - 11, 20, 2);
  ctx.fillStyle = '#22303e'; ctx.fillRect(cx - 7, top - 7, 14, 7);
  ctx.fillStyle = '#2c3a4a'; ctx.fillRect(cx - 6, top - 18, 12, 8);      // фонарное помещение
  ctx.fillStyle = '#1a2531'; ctx.fillRect(cx - 7, top - 21, 14, 3);
  ctx.fillStyle = '#151f2a'; ctx.fillRect(cx - 2, top - 24, 4, 3);
  return top - 14;
}

  ctx.globalAlpha = power;
  ctx.fillStyle = col; ctx.fillRect(cx - 4, lampY - 2, 8, 6);

  ctx.globalAlpha = 1;
}
function drawBeams(ctx, cx, lampY, alpha, ang, reach, col) {
  if (alpha <= .01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = col;
  for (const dir of [0, Math.PI]) {
    for (let k = 0; k < 3; k++) {                   // мягкие края конуса
      ctx.globalAlpha = alpha * (k === 1 ? .7 : .35);
      const spread = .05 + k * .035;
      ctx.beginPath();
      ctx.moveTo(cx, lampY + 1);
      ctx.arc(cx, lampY + 1, reach, ang + dir - spread, ang + dir + spread);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}
/** Море полосами: к низу гуще и контрастнее. */
function drawSea(ctx, y0, y1, col) {
  const rnd = mulberry32(808);
  for (let y = y0; y < y1; y += 2) {
    const d = (y - y0) / Math.max(1, y1 - y0);
    ctx.globalAlpha = .16 + d * .34;
    ctx.fillStyle = col;
    let x = Math.floor(rnd() * 12);
    while (x < W) {
      const len = 2 + Math.floor(rnd() * (2 + d * 6));
      ctx.fillRect(x, y, len, 1);
      x += len + 3 + Math.floor(rnd() * 8);
    }
  }
  ctx.globalAlpha = 1;
}

    // окно: за ним суббота, а тут работают

    vgradIn(ctx, 4, 20, 22, 30, '#5f8395', '#9dbcb4');
    ctx.fillStyle = '#7c9a6a'; ctx.fillRect(4, 42, 22, 8);
    ctx.fillStyle = '#101a13'; ctx.fillRect(13, 18, 2, 34); ctx.fillRect(2, 33, 26, 2);

    // стеллаж во всю стену
    const rnd = mulberry32(88);
    const jars = ['#7a8f6a', '#8a6a4a', '#5f7f96', '#96795f', '#6a6f8a', '#87745a', '#4f7a5c'];
    for (let s = 0; s < 4; s++) {
      const y = 16 + s * 26;
      ctx.fillStyle = '#3b2a1a'; ctx.fillRect(32, y + 18, 88, 3);
      ctx.fillStyle = '#4d3722'; ctx.fillRect(32, y + 18, 88, 1);
      let x = 34;
      while (x < 118) {
        const w = 3 + Math.floor(rnd() * 5), hh = 7 + Math.floor(rnd() * 11);
        const c = jars[Math.floor(rnd() * jars.length)];
        ctx.fillStyle = c; ctx.fillRect(x, y + 18 - hh, w, hh);
        ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y + 18 - hh, 1, hh);
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y + 18 - hh, w, 1);
        x += w + 2;
      }
    }
    // корешки книг на нижней полке
    let bx = 34;
    while (bx < 118) {
      const w = 2 + Math.floor(rnd() * 3), hh = 10 + Math.floor(rnd() * 5);
      ctx.fillStyle = ['#7a3a2a', '#3a5a7a', '#6a6a2a', '#5a3a6a'][Math.floor(rnd() * 4)];
      ctx.fillRect(bx, 16 + 3 * 26 + 18 - hh, w, hh);
      bx += w + 1;
    }
    // доска с мелом на пустой стене
    const bY = 16 + 4 * 26 + 6;
    ctx.fillStyle = '#4a3520'; ctx.fillRect(30, bY, 84, 30);
    ctx.fillStyle = '#1c2a22'; ctx.fillRect(32, bY + 2, 80, 26);
    ctx.fillStyle = 'rgba(220,235,225,.55)';
    const cr = mulberry32(404);
    for (let i = 0; i < 16; i++) {
      const x = 36 + Math.floor(cr() * 68), y = bY + 5 + Math.floor(cr() * 19);
      ctx.fillRect(x, y, 2 + Math.floor(cr() * 7), 1);
    }
    ctx.fillRect(38, bY + 6, 1, 8); ctx.fillRect(38, bY + 10, 6, 1);      // формула
    ctx.fillRect(46, bY + 6, 6, 1); ctx.fillRect(46, bY + 13, 6, 1);
    ctx.fillStyle = '#5c4429'; ctx.fillRect(30, bY + 30, 84, 3);
    ctx.fillStyle = '#e8e2d0'; ctx.fillRect(96, bY + 28, 5, 2);           // мелок

    // часы, которые тут ничего не значат
    ctx.fillStyle = '#5a4126'; ctx.fillRect(12, bY + 2, 14, 14);
    ctx.fillStyle = '#d8d0b8'; ctx.fillRect(14, bY + 4, 10, 10);
    ctx.fillStyle = '#3a2916'; ctx.fillRect(18, bY + 6, 1, 4); ctx.fillRect(19, bY + 9, 4, 1);

    // кот, который всё видел
    drawSpr(ctx, SPR.cat, 20, this.act(h).y - 6, { '#': '#23232a' }, 1);

    // стол
    ctx.fillStyle = '#5a4126'; ctx.fillRect(36, tableY, 82, 5);
    ctx.fillStyle = '#6d5030'; ctx.fillRect(36, tableY, 82, 1);
    ctx.fillStyle = '#3a2916'; ctx.fillRect(42, tableY + 5, 4, 11); ctx.fillRect(108, tableY + 5, 4, 11);
    // мелочь на столе
    ctx.fillStyle = '#8a9a7a'; ctx.fillRect(112, tableY - 6, 5, 6);
    ctx.fillStyle = '#d8d0b8'; ctx.fillRect(38, tableY - 3, 9, 3);

    fadeEdges(ctx, h, 20, 16, '#04070d');
  },
  anim(ctx, h, t, st) {
    const cols = ['#7fd88a', '#d8b95e', '#3fc9a0'];
    const picked = st.pick;
    glow(ctx, 60, 14, 32, '#d8e0a8', .28);

    this.spots(h).forEach((s, i) => {
      const dim = picked != null && picked !== i;
      const pulse = Math.abs(Math.sin(t * 2.2 + i * 1.9)) * 2;
      ctx.globalAlpha = dim ? .16 : 1;
      ctx.fillStyle = '#2f2113'; ctx.fillRect(s.x - 6, s.y + 15, 13, 2);

      if (i === 0) {                                   // склянка с живой водой
        ctx.fillStyle = '#cfe4e8'; ctx.fillRect(s.x - 4, s.y + 3, 9, 12);
        ctx.fillStyle = cols[0];   ctx.fillRect(s.x - 3, s.y + 7, 7, 7);
        ctx.fillStyle = '#e8f6f2'; ctx.fillRect(s.x - 4, s.y + 3, 1, 12);
        ctx.fillStyle = '#8a7a5a'; ctx.fillRect(s.x - 2, s.y, 5, 4);
      } else if (i === 1) {                            // неразменный пятак
        disc(ctx, s.x, s.y + 9, 6, shade(cols[1], -40));
        disc(ctx, s.x, s.y + 8, 6, cols[1]);
        disc(ctx, s.x, s.y + 8, 3, shade(cols[1], 45));
        ctx.fillStyle = shade(cols[1], -60); ctx.fillRect(s.x - 1, s.y + 6, 2, 5);
      } else {                                         // перо феникса
        for (let k = 0; k < 16; k++) {
          const wpx = Math.max(1, Math.round(4 - Math.abs(k - 6) * .45));
          ctx.fillStyle = mix(cols[2], '#ffffff', .35 - k * .02);
          ctx.fillRect(s.x - (wpx >> 1), s.y + k, wpx, 1);
        }
        ctx.fillStyle = shade(cols[2], -50); ctx.fillRect(s.x, s.y + 2, 1, 13);
      }
      if (!dim) glow(ctx, s.x, s.y + 8, 9 + pulse, cols[i], .75);
      ctx.globalAlpha = 1;
    });
  }
};

/* ── 3. ПУСТЫНЯ · поднос у фургона ────────────────────────────
   Два плана: общий, где поднос лежит в тени фургона, и приближение,
   где по стеклянной плите бьют молотком, дробя её на всё более
   мелкие кристаллы.
   ────────────────────────────────────────────────────────────── */
/* Рукоять сверху, боёк снизу — молоток падает на плиту. */
const HAMMER = [
  '....##.....',
  '....##.....',
  '....##.....',
  '....##.....',
  '....##.....',
  '....##.....',
  '....##.....',
  '.#######...',
  '#########..',
  '#########..',
  '#########..',
  '.#######...'
];

SCENES.desert = {
  live: true,
  HITS: 6,

  tray(h) { return { x: 74, y: Math.round(h * FEET) }; },
  slab(h) { const y = Math.round(h * .44); return { x: 18, y, w: 84, h: 40 }; },
  /** Куда целиться: в общем плане — поднос, в приближении — плита. */
  crystal(h) {
    const s = st.desert;
    if (s && (s.zoom || 0) >= 1) { const b = this.slab(h); return { x: b.x + b.w / 2, y: b.y + b.h + 10 }; }
    return this.tray(h);
  },

  reset(s, h) {
    const b = this.slab(h);
    s.shards = [{ x: b.x + 3, y: b.y + 3, w: b.w - 6, h: b.h - 6, s: .5 }];
    s.hits = 0; s.hammer = 0;
    if (s.done) { for (let i = 0; i < this.HITS; i++) this.split(s); s.zoom = 1; }
  },
  /** Каждый удар делит каждый крупный осколок надвое. */
  split(s) {
    const out = [];
    for (const r of s.shards) {
      if (Math.max(r.w, r.h) <= 5) { out.push(r); continue; }
      const along = r.w >= r.h;
      const at = .34 + Math.random() * .32;
      if (along) {
        const w1 = Math.max(2, Math.round(r.w * at));
        out.push({ x: r.x, y: r.y, w: w1 - 1, h: r.h, s: Math.random() });
        out.push({ x: r.x + w1, y: r.y, w: r.w - w1, h: r.h, s: Math.random() });
      } else {
        const h1 = Math.max(2, Math.round(r.h * at));
        out.push({ x: r.x, y: r.y, w: r.w, h: h1 - 1, s: Math.random() });
        out.push({ x: r.x, y: r.y + h1, w: r.w, h: r.h - h1, s: Math.random() });
      }
    }
    for (const r of out) {                                  // осколки чуть расползаются
      r.x += Math.round((Math.random() - .5) * 1.4);
      r.y += Math.round((Math.random() - .5) * 1.4);
    }
    s.shards = out;
    s.hits++;
  },

  /* ── общий план ── */
  wide(h) {
    const key = 'desertWide@' + h;
    if (cache[key]) return cache[key];
    const c = document.createElement('canvas');
    c.width = W; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const hz = Math.round(h * .40);
    vgrad(ctx, 0, hz, '#dfe3e0', '#f6efd6', 8);
    vgrad(ctx, hz, h, '#d3ad66', '#9c7433', 8);

    ctx.globalAlpha = .55; disc(ctx, 34, 22, 12, '#fffbe8'); ctx.globalAlpha = 1;
    disc(ctx, 34, 22, 7, '#ffffff');
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    for (let y = hz - 6; y < hz + 4; y += 2) ctx.fillRect(0, y, W, 1);

    ctx.fillStyle = '#6b5a44';                              // столб с проводами
    ctx.fillRect(88, hz - 46, 3, 50); ctx.fillRect(82, hz - 42, 15, 2);
    ctx.fillStyle = '#4e4133';
    for (let x = 0; x < 82; x++) {
      const q = x / 82;
      ctx.fillRect(x, Math.round(hz - 41 + Math.sin(q * Math.PI) * 7 - q * 3), 1, 1);
      ctx.fillRect(x, Math.round(hz - 37 + Math.sin(q * Math.PI) * 6 - q * 2), 1, 1);
    }
    ctx.fillStyle = '#8a7a5a';
    for (const [bx, by] of [[30, 40], [42, 52]]) {
      ctx.fillRect(bx, by, 2, 1); ctx.fillRect(bx + 2, by - 1, 2, 1); ctx.fillRect(bx + 4, by, 2, 1);
    }
    ctx.fillStyle = '#c9ab84';
    ctx.fillRect(0, hz - 11, 30, 11); ctx.fillRect(5, hz - 15, 18, 4);
    ctx.fillStyle = '#bb9c74';
    ctx.fillRect(84, hz - 9, 36, 9); ctx.fillRect(94, hz - 13, 20, 4);
    ctx.fillStyle = '#a98a63'; ctx.fillRect(0, hz - 3, W, 3);

    const vx = 10, vy = hz + 22;                            // фургон
    ctx.fillStyle = 'rgba(90,64,30,.28)'; ctx.fillRect(vx - 3, vy + 4, 54, 3);
    ctx.fillStyle = '#cfc9b4'; ctx.fillRect(vx, vy - 24, 46, 24);
    ctx.fillStyle = '#eae5d4'; ctx.fillRect(vx, vy - 24, 46, 3);
    ctx.fillStyle = '#9a9482'; ctx.fillRect(vx, vy - 3, 46, 3);
    ctx.fillStyle = '#8a7752'; ctx.fillRect(vx, vy - 10, 46, 3);
    ctx.fillStyle = '#46525d'; ctx.fillRect(vx + 4, vy - 20, 11, 8); ctx.fillRect(vx + 18, vy - 20, 11, 8);
    ctx.fillStyle = '#5d6a74'; ctx.fillRect(vx + 4, vy - 20, 11, 2); ctx.fillRect(vx + 18, vy - 20, 11, 2);
    ctx.fillStyle = '#20242a'; ctx.fillRect(vx + 34, vy - 21, 11, 21);
    ctx.fillStyle = '#7d8894'; ctx.fillRect(vx + 45, vy - 21, 2, 21);
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(vx + 7, vy, 7, 5); ctx.fillRect(vx + 33, vy, 7, 5);
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(vx + 8, vy + 1, 5, 3); ctx.fillRect(vx + 34, vy + 1, 5, 3);

    const cx = 100;                                         // сагуаро
    ctx.fillStyle = 'rgba(90,64,30,.24)'; ctx.fillRect(cx - 10, hz + 40, 26, 3);
    ctx.fillStyle = '#54724a';
    ctx.fillRect(cx, hz + 2, 6, 38);
    ctx.fillRect(cx - 8, hz + 14, 4, 14); ctx.fillRect(cx - 8, hz + 14, 9, 4);
    ctx.fillRect(cx + 10, hz + 9, 4, 16); ctx.fillRect(cx + 5, hz + 21, 9, 4);
    ctx.fillStyle = '#3f5738'; ctx.fillRect(cx + 4, hz + 2, 2, 38);
    ctx.fillStyle = '#6a8a5c'; ctx.fillRect(cx, hz + 2, 1, 38);

    const rnd = mulberry32(19);
    for (let i = 0; i < 34; i++) {
      const x = Math.floor(rnd() * W), y = hz + 10 + Math.floor(rnd() * (h - hz - 20));
      if (rnd() > .45) { ctx.fillStyle = '#8a7a4a'; ctx.fillRect(x, y, 4, 2); ctx.fillRect(x + 1, y - 2, 2, 2); }
      else { ctx.fillStyle = '#7d6440'; ctx.fillRect(x, y, 5, 3); ctx.fillStyle = '#96794f'; ctx.fillRect(x, y, 5, 1); }
    }
    ctx.fillStyle = 'rgba(120,88,44,.30)';
    for (let y = hz + 26; y < h; y += 3) {
      ctx.fillRect(16 + Math.round((y - hz) * .18), y, 3, 1);
      ctx.fillRect(40 + Math.round((y - hz) * .30), y, 3, 1);
    }
    const n = makeNoise(17);
    ctx.fillStyle = 'rgba(120,90,50,.22)';
    for (let y = hz + 6; y < h; y += 4)
      for (let x = (y * 3) % 9; x < W; x += 10)
        if (n(x * .08, y * .08, 2) > .48) ctx.fillRect(x, y, 5, 1);

    // поднос в тени: металлический борт и синяя плита
    const T = this.tray(h);
    ctx.fillStyle = 'rgba(70,50,24,.35)'; ctx.fillRect(T.x - 20, T.y + 7, 40, 3);
    ctx.fillStyle = '#7d8894'; ctx.fillRect(T.x - 19, T.y - 8, 38, 15);
    ctx.fillStyle = '#a4b0bc'; ctx.fillRect(T.x - 19, T.y - 8, 38, 2);
    ctx.fillStyle = '#5a646e'; ctx.fillRect(T.x - 19, T.y + 5, 38, 2);
    ctx.fillStyle = '#2b8fa8'; ctx.fillRect(T.x - 16, T.y - 5, 32, 10);
    ctx.fillStyle = '#4fd6e8'; ctx.fillRect(T.x - 16, T.y - 5, 32, 3);
    ctx.fillStyle = '#bff4fb'; ctx.fillRect(T.x - 15, T.y - 5, 9, 1);

    ctx.fillStyle = '#8a6c42';                              // камни на переднем плане
    ctx.fillRect(0, h - 16, 24, 16); ctx.fillRect(4, h - 20, 14, 5);
    ctx.fillRect(96, h - 13, 24, 13); ctx.fillRect(104, h - 17, 12, 5);
    ctx.fillStyle = '#a3855a'; ctx.fillRect(0, h - 16, 24, 2); ctx.fillRect(96, h - 13, 24, 2);
    fadeEdges(ctx, h, 18, 14, '#04070d');
    cache[key] = c;
    return c;
  },

  /* ── приближение ── */
  close(h) {
    const key = 'desertClose@' + h;
    if (cache[key]) return cache[key];
    const c = document.createElement('canvas');
    c.width = W; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const b = this.slab(h);

    vgrad(ctx, 0, h, '#c9a563', '#8a6631', 8);               // земля крупным планом
    const n = makeNoise(29);
    ctx.fillStyle = 'rgba(110,80,42,.30)';
    for (let y = 0; y < h; y += 3)
      for (let x = (y * 5) % 11; x < W; x += 8)
        if (n(x * .12, y * .12, 2) > .46) ctx.fillRect(x, y, 4, 1);
    ctx.globalAlpha = .35;                                   // тень от фургона сверху
    ctx.fillStyle = '#4a3418'; ctx.fillRect(0, 0, W, Math.round(h * .22));
    ctx.globalAlpha = 1;

    // страница с формулой рядом с подносом
    const px = 8, py = b.y + b.h + 18;
    ctx.fillStyle = 'rgba(70,50,24,.30)'; ctx.fillRect(px + 1, py + 1, 34, 26);
    ctx.fillStyle = '#e8e0c8'; ctx.fillRect(px, py, 34, 26);
    ctx.fillStyle = '#cfc5a8'; ctx.fillRect(px, py, 34, 1);
    ctx.fillStyle = '#3d4450';
    const hex = [[10, 8], [15, 5], [20, 8], [20, 14], [15, 17], [10, 14]];
    for (let i = 0; i < 6; i++) {
      const a = hex[i], q = hex[(i + 1) % 6];
      const steps = 6;
      for (let k = 0; k <= steps; k++)
        ctx.fillRect(px + Math.round(lerp(a[0], q[0], k / steps)),
                     py + Math.round(lerp(a[1], q[1], k / steps)), 1, 1);
    }
    for (let k = 0; k < 5; k++) ctx.fillRect(px + 20 + k, py + 8 - (k % 2), 1, 1);
    for (let k = 0; k < 4; k++) ctx.fillRect(px + 25 + k, py + 7 + (k % 2), 1, 1);
    ctx.fillRect(px + 28, py + 6, 2, 2);
    ctx.fillStyle = '#8a8270';
    for (let k = 0; k < 3; k++) ctx.fillRect(px + 5, py + 20 + k * 2, 24 - k * 5, 1);

    // поднос: борт и дно
    ctx.fillStyle = 'rgba(60,42,18,.40)'; ctx.fillRect(b.x + 3, b.y + b.h + 2, b.w, 4);
    ctx.fillStyle = '#5a646e'; ctx.fillRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
    ctx.fillStyle = '#8f9ba7'; ctx.fillRect(b.x - 3, b.y - 3, b.w + 6, 3);
    ctx.fillStyle = '#aab6c2'; ctx.fillRect(b.x - 3, b.y - 3, 3, b.h + 6);
    ctx.fillStyle = '#454e57'; ctx.fillRect(b.x - 3, b.y + b.h, b.w + 6, 3);
    ctx.fillStyle = '#1b2b33'; ctx.fillRect(b.x, b.y, b.w, b.h);
    fadeEdges(ctx, h, 14, 12, '#04070d');
    cache[key] = c;
    return c;
  },

  drawShards(ctx, s) {
    for (const r of s.shards) {
      if (r.w < 1 || r.h < 1) continue;
      ctx.fillStyle = mix('#2b8fa8', '#57c9de', r.s);
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = mix('#7ee8f4', '#bff4fb', r.s);        // верхняя грань
      ctx.fillRect(r.x, r.y, r.w, 1);
      ctx.fillRect(r.x, r.y, 1, r.h);
      ctx.fillStyle = '#12596e';                             // тень справа снизу
      ctx.fillRect(r.x + r.w - 1, r.y + 1, 1, r.h - 1);
      ctx.fillRect(r.x + 1, r.y + r.h - 1, r.w - 1, 1);
      if (r.w > 3 && r.h > 3 && r.s > .55) {                 // блик
        ctx.fillStyle = '#e8fdff';
        ctx.fillRect(r.x + 1 + ((r.w * r.s) | 0) % Math.max(1, r.w - 2), r.y + 1, 1, 1);
      }
    }
  },

  draw(ctx, h, t, s) {
    if (!s.shards) this.reset(s, h);
    const z = clamp(s.zoom || 0, 0, 1);

    if (z < 1) {
      const T = this.tray(h), k = 1 + z * 2.4;
      ctx.save();
      ctx.globalAlpha = 1 - z * .9;
      ctx.translate(T.x, T.y); ctx.scale(k, k); ctx.translate(-T.x, -T.y);
      ctx.drawImage(this.wide(h), 0, 0);
      ctx.restore();
      // пыль за фургоном и блеск подноса
      const hz = Math.round(h * .40);
      ctx.save();
      ctx.globalAlpha = (1 - z) * .18;
      ctx.fillStyle = '#efe0ba';
      for (let i = 0; i < 9; i++) {
        const y = hz + 16 - i * 6 + Math.round(Math.sin(t * .7 + i) * 2);
        ctx.fillRect(52 + i + Math.round(Math.sin(t * .9 + i * .6) * 3), y, 12 - i, 5);
      }
      ctx.restore();
      if (z < .05) glow(ctx, T.x, T.y, 16 + Math.abs(Math.sin(t * 2)) * 3, '#4fd6e8', .5);
    }

    if (z > 0) {
      const b = this.slab(h);
      ctx.save();
      ctx.globalAlpha = z;
      ctx.drawImage(this.close(h), 0, 0);
      this.drawShards(ctx, s);
      // молоток заносится и падает на плиту
      const hm = clamp(s.hammer || 0, 0, 1);
      const hx = b.x + b.w - 30;
      const hy = b.y - 24 - Math.round((1 - hm) * 24);
      drawSpr(ctx, HAMMER, hx + 1, hy + 1, { '#': 'rgba(6,10,18,.5)' }, 2);
      drawSpr(ctx, HAMMER, hx, hy, { '#': '#8f9ba7' }, 2);
      ctx.fillStyle = '#5a646e'; ctx.fillRect(hx + 8, hy, 4, 14);       // рукоять темнее
      ctx.fillStyle = '#c2ccd6'; ctx.fillRect(hx, hy + 16, 18, 2);      // блик на бойке
      ctx.restore();
      glow(ctx, b.x + b.w / 2, b.y + b.h / 2, 26, '#4fd6e8', .35 * z);
    }
  }
};

/* ── 4. АРРАКИС · дюны на закате ──────────────────────────────── */
SCENES.arrakis = {
  thumper(h) { return { x: 74, y: Math.round(h * .64) }; },
  paint(ctx, h) {
    const hz = Math.round(h * .34);
    vgrad(ctx, 0, hz, '#1a1030', '#e07a3a', 10);
    scatter(ctx, '#f0e2d2', 34, 0, 0, W, hz - 26, 5);

    // две луны: большая с тенью, маленькая
    disc(ctx, 92, 20, 9, '#e8d6c0');
    ctx.globalAlpha = .35; disc(ctx, 95, 17, 4, '#b09880'); ctx.globalAlpha = 1;
    disc(ctx, 24, 12, 4, '#cbb9a8');

    // подложка до самого низа, иначе между небом и дюнами зияет шов
    vgrad(ctx, hz - 2, h, '#e8c294', '#7a5240', 4);

    // гряды дюн: у каждой освещённый гребень и уходящий в тень склон
    const n = makeNoise(23);
    const layers = [
      { y: hz + 8,  amp: 4,  lit: '#f0c893', dark: '#a87a52', fall: 22 },
      { y: hz + 26, amp: 7,  lit: '#e6ad6c', dark: '#8d5a3c', fall: 30 },
      { y: hz + 52, amp: 10, lit: '#d6944c', dark: '#6d4436', fall: 40 },
      { y: hz + 86, amp: 13, lit: '#c07d33', dark: '#5a3838', fall: 54 }
    ];
    const paintLayer = L => {
      for (let x = 0; x < W; x++) {
        const top = Math.round(L.y - n(x * .022, L.amp, 3) * L.amp * 2);
        for (let y = top; y < h; y++) {
          ctx.fillStyle = mix(L.lit, L.dark, clamp((y - top) / L.fall, 0, 1));
          ctx.fillRect(x, y, 1, 1);
        }
      }
    };
    paintLayer(layers[0]);
    // червь идёт по дальнему гребню — виден на светлом песке
    ctx.globalAlpha = .40;
    drawSpr(ctx, SPR.worm, 12, hz + 16, { '#': '#6b4632' }, 2);
    ctx.globalAlpha = 1;
    layers.slice(1).forEach(paintLayer);

    // рябь: поперёк склонов, к низу крупнее
    for (let y = hz + 14; y < h; y += 4) {
      const d = (y - hz) / (h - hz);
      ctx.globalAlpha = .10 + d * .14;
      ctx.fillStyle = '#3a2030';
      for (let x = (y * 5) % 13; x < W; x += 9 + Math.round(d * 6))
        ctx.fillRect(x, y, 4 + Math.round(d * 4), 1);
    }
    ctx.globalAlpha = 1;
    // следы на песке к стучалке
    ctx.globalAlpha = .18; ctx.fillStyle = '#2e1b28';
    for (let i = 0; i < 8; i++) ctx.fillRect(14 + i * 6, Math.round(h * .70) + (i % 2) * 3, 3, 2);
    ctx.globalAlpha = 1;

    fadeEdges(ctx, h, 18, 12, '#04070d');
  },
  anim(ctx, h, t, st) {
    const p = clamp(st.pull || 0, 0, 1);
    const A = this.thumper(h), tx = A.x, ty = A.y;

    // стучалка входит в песок
    const sink = Math.round(p * 16);
    const top = ty - 34 + sink;
    ctx.fillStyle = '#5c4c33'; ctx.fillRect(tx - 2, top + 6, 5, 28);      // шток
    ctx.fillStyle = '#7d6a48'; ctx.fillRect(tx - 2, top + 6, 1, 28);
    ctx.fillStyle = '#8a7550'; ctx.fillRect(tx - 7, top, 15, 7);          // груз
    ctx.fillStyle = '#a08c64'; ctx.fillRect(tx - 7, top, 15, 2);
    ctx.fillStyle = '#4a3d28'; ctx.fillRect(tx - 7, top + 6, 15, 1);
    ctx.fillStyle = '#6b5a3e';                                            // кольца
    ctx.fillRect(tx - 4, top + 13, 9, 2); ctx.fillRect(tx - 4, top + 21, 9, 2);

    if (p > .05) {
      ctx.globalAlpha = .30 * p;
      for (let i = 1; i <= 3; i++) ring(ctx, tx, ty + 2, Math.round((t * 14 + i * 11) % 40), '#f0c88e');
      ctx.globalAlpha = 1;
      // песок вздрагивает
      scatter(ctx, '#e8c08a', Math.round(p * 14), tx - 16, ty - 6, 32, 10, 5 + Math.floor(t * 8));
    }

    if (p >= 1) {
      // из воронки поднимается пряность
      ctx.globalAlpha = .5;
      disc(ctx, tx, ty - 2, 9 + Math.abs(Math.sin(t * 2.4)) * 4, '#7d6bd8');
      ctx.globalAlpha = 1;
      scatter(ctx, '#c3b4ff', 20, tx - 12, ty - 30, 24, 30, 3 + Math.floor(t * 5));
      ctx.fillStyle = '#9b8ae8';
      ctx.fillRect(tx - 3, ty - 8, 7, 5);
      ctx.fillStyle = '#c3b4ff'; ctx.fillRect(tx - 3, ty - 8, 7, 1);

      // тень на горизонте разворачивается и идёт сюда
      const wx = 20 + Math.round(sstep(0, 6, t % 12) * 40);
      ctx.globalAlpha = .75;
      drawSpr(ctx, SPR.worm, wx, Math.round(h * .34) + 14, { '#': '#3a2420' }, 3);
      ctx.globalAlpha = 1;
    }
  }
};

/* ── 5. ВЕСТЕРОС · Стена и жаровня ────────────────────────────── */
SCENES.westeros = {
  brazier(h) { return { x: 74, y: Math.round(h * FEET) - 4 }; },
  runePts(h) {
    const A = this.brazier(h);
    return [
      { x: A.x - 18, y: A.y + 12 }, { x: A.x - 9, y: A.y - 2 }, { x: A.x, y: A.y + 16 },
      { x: A.x + 9, y: A.y - 2 },   { x: A.x + 18, y: A.y + 12 }
    ];
  },
  paint(ctx, h) {
    const A = this.brazier(h), groundY = A.y + 4;
    const wallBottom = Math.round(h * .30);

    vgrad(ctx, 0, groundY, '#050810', '#101d31', 7);

    // Стена: толща льда, уходит за верхний край
    vgradIn(ctx, 0, 0, W, wallBottom, '#0f2038', '#4a76a0');
    const rnd = mulberry32(77);
    for (let y = -10; y < wallBottom; y += 15) {
      const off = ((y / 15) | 0) % 2 ? 13 : 0;
      for (let x = -13 + off; x < W; x += 26) {
        const q = clamp((y + 10) / (wallBottom + 10), 0, 1);
        ctx.fillStyle = mix('#172b46', '#5b8ab4', clamp(q * .8 + rnd() * .2, 0, 1));
        ctx.fillRect(x + 1, y + 1, 24, 13);
        ctx.fillStyle = 'rgba(6,14,26,.55)';
        ctx.fillRect(x, y, 26, 1); ctx.fillRect(x, y, 1, 15);
        ctx.fillStyle = 'rgba(210,238,255,.13)';       // блик по верху блока
        ctx.fillRect(x + 1, y + 1, 24, 1);
      }
    }
    ctx.fillStyle = 'rgba(215,240,255,.16)';           // потёки и трещины
    for (let i = 0; i < 34; i++) {
      const x = Math.floor(rnd() * W), y = Math.floor(rnd() * wallBottom);
      ctx.fillRect(x, y, 1, 4 + Math.floor(rnd() * 14));
    }
    ctx.fillStyle = '#bde0f6'; ctx.fillRect(0, wallBottom - 3, W, 3);
    ctx.globalAlpha = .16; ctx.fillStyle = '#a8d4ee'; ctx.fillRect(0, wallBottom, W, 10); ctx.globalAlpha = 1;
    // сосульки разной длины
    for (let x = 1; x < W; x += 4) {
      const L = 2 + Math.floor(rnd() * 9);
      ctx.fillStyle = '#cfe8f8'; ctx.fillRect(x, wallBottom, 1, L);
      if (L > 6) { ctx.fillStyle = '#8fbfe0'; ctx.fillRect(x, wallBottom + L - 2, 1, 2); }
    }

    // сосны средним планом — заполняют разрыв под Стеной
    for (let i = 0; i < 16; i++) {
      const x = Math.floor(rnd() * (W + 14)) - 7;
      drawSpr(ctx, SPR.fir, x, wallBottom + 4 + Math.floor(rnd() * 14),
        { '#': '#0a1420', 'h': '#081019' }, 2);
    }

    // чардрева: голые стволы с изломанными ветвями, в них живёт темнота
    for (let i = 0; i < 10; i++) {
      const x = Math.floor(rnd() * (W + 16)) - 8;
      const th = 30 + Math.floor(rnd() * 22);
      const ty = Math.round(h * .54) - th + Math.floor(rnd() * 10);
      ctx.fillStyle = '#060c14';
      ctx.fillRect(x, ty, 3, th);
      for (let k = 0; k < 3; k++) {
        const by = ty + 4 + k * 8, dir = k % 2 ? 1 : -1;
        for (let s = 1; s <= 7; s++) ctx.fillRect(x + 1 + dir * s, by - Math.round(s * .8), 2, 2);
      }
      ctx.fillRect(x - 2, ty - 3, 7, 4);
    }

    // снег
    vgrad(ctx, groundY - 3, h, '#cfdcea', '#7f93ab', 6);
    const n = makeNoise(31);
    ctx.fillStyle = '#e2ecf6';
    for (let x = 0; x < W; x++) {
      const y = groundY - 3 - Math.round(n(x * .05, 2, 3) * 5);
      ctx.fillRect(x, y, 1, groundY - y);
    }
    // вытоптанный круг
    ctx.fillStyle = '#63758a';
    for (let x = A.x - 40; x < A.x + 40; x++) {
      if (x < 0 || x >= W) continue;
      const dy = Math.round(Math.sqrt(Math.max(0, 1 - ((x - A.x) / 40) ** 2)) * 8);
      ctx.fillRect(x, A.y + 8 - dy, 1, dy * 2);
    }
    ctx.fillStyle = '#7b8ea3';
    for (let x = A.x - 40; x < A.x + 40; x++) {
      if (x < 0 || x >= W) continue;
      const dy = Math.round(Math.sqrt(Math.max(0, 1 - ((x - A.x) / 40) ** 2)) * 8);
      ctx.fillRect(x, A.y + 8 - dy, 1, 1);
    }
    // жаровня: сужающаяся чаша на трёх ножках
    for (let i = 0; i < 7; i++) {
      const wd = 17 - i * 2;
      ctx.fillStyle = i < 2 ? '#3d3835' : '#242020';
      ctx.fillRect(A.x - (wd >> 1), A.y - 6 + i, wd, 1);
    }
    ctx.fillStyle = '#4a443f'; ctx.fillRect(A.x - 10, A.y - 7, 21, 2);
    ctx.fillStyle = '#1a1717';
    ctx.fillRect(A.x - 6, A.y + 1, 2, 9); ctx.fillRect(A.x + 5, A.y + 1, 2, 9);
    ctx.fillRect(A.x, A.y + 1, 2, 10);
    ctx.fillStyle = '#2a2523'; ctx.fillRect(A.x - 8, A.y + 10, 17, 2);

    // следы на снегу, ведущие к кругу
    ctx.fillStyle = 'rgba(90,110,132,.5)';
    for (let i = 0; i < 9; i++) ctx.fillRect(6 + i * 5, A.y + 16 + (i % 2) * 3, 2, 2);
    // камни и веточки
    const r2 = mulberry32(53);
    for (let i = 0; i < 12; i++) {
      const x = Math.floor(r2() * W), y = A.y + 12 + Math.floor(r2() * (h - A.y - 24));
      ctx.fillStyle = r2() > .5 ? '#93a5b9' : '#6c7d90';
      ctx.fillRect(x, y, 3, 2);
    }
    // наносы: каждый со своей тенью, чтобы снег не был плитой
    const drifts = [
      { y: A.y + 26, amp: 5, top: '#eef5fc', body: '#c2d3e5' },
      { y: A.y + 48, amp: 7, top: '#e4eef8', body: '#adc0d6' },
      { y: h - 12,   amp: 9, top: '#f2f8fd', body: '#9db2ca' }
    ];
    for (const D of drifts) {
      for (let x = 0; x < W; x++) {
        const top = Math.round(D.y - n(x * .035 + D.amp, 5, 3) * D.amp * 2);
        ctx.fillStyle = D.top;  ctx.fillRect(x, top, 1, 2);
        ctx.fillStyle = D.body; ctx.fillRect(x, top + 2, 1, h - top);
      }
    }
    // позёмка
    ctx.fillStyle = 'rgba(140,168,196,.45)';
    for (let y = A.y + 30; y < h; y += 6)
      for (let x = (y * 5) % 17; x < W; x += 13 + (y % 3) * 4) ctx.fillRect(x, y, 5 + (y % 4), 1);
    // занесённое бревно
    ctx.fillStyle = '#2e3846'; ctx.fillRect(8, A.y + 40, 34, 5);
    ctx.fillStyle = '#3d4a5c'; ctx.fillRect(8, A.y + 40, 34, 1);
    ctx.fillStyle = '#e4eef8'; ctx.fillRect(8, A.y + 43, 34, 3);

    fadeEdges(ctx, h, 16, 10, '#04070d');
  },
  anim(ctx, h, t, st) {
    const A = this.brazier(h);
    const done = st.done;
    const lit = st.marks ? st.marks.filter(Boolean).length : 0;

    // синие глаза в чардревах — отступают, когда огонь встаёт
    ctx.globalAlpha = (done ? .12 : 1) * (.5 + Math.abs(Math.sin(t * .8)) * .35);
    ctx.fillStyle = '#63c8ff';
    for (const [ex, ey] of [[6, .46], [24, .50], [96, .47], [112, .52], [40, .44]]) {
      const yy = Math.round(h * ey) + (done ? 5 : 0);
      ctx.fillRect(ex, yy, 2, 1); ctx.fillRect(ex + 4, yy, 2, 1);
    }
    ctx.globalAlpha = 1;

    // угли знака
    const pts = this.runePts(h);
    if (st.marks) {
      ctx.strokeStyle = '#ff7a2e'; ctx.lineWidth = 1;
      for (let i = 1; i < pts.length; i++) {
        if (!st.marks[i - 1] || !st.marks[i]) continue;
        ctx.beginPath();
        ctx.moveTo(pts[i - 1].x + .5, pts[i - 1].y + .5);
        ctx.lineTo(pts[i].x + .5, pts[i].y + .5);
        ctx.stroke();
      }
    }
    pts.forEach((p, i) => {
      const on = st.marks && st.marks[i];
      if (on) {
        gem(ctx, p.x, p.y, 2, '#ffcf7a');
        ctx.globalAlpha = .35; disc(ctx, p.x, p.y, 4, '#ff7a2e'); ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = .5 + Math.abs(Math.sin(t * 2 + i)) * .35;
        ctx.fillStyle = '#8a5240';
        ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
        ctx.globalAlpha = 1;
      }
    });

    // пламя в жаровне
    const power = done ? 1 : lit / 5;
    flame(ctx, A.x, A.y - 6, 5 + Math.round(power * 26), t, '#fff0c0', '#e8452c', 2);
    if (done) {
      glow(ctx, A.x, A.y - 16, 40 + Math.abs(Math.sin(t * 2)) * 4, '#e8452c', .55);
      scatter(ctx, '#ffa860', 12, A.x - 12, A.y - 44, 24, 34, 3 + Math.floor(t * 6));
    }

    // метель
    const rnd = mulberry32(9);
    ctx.fillStyle = 'rgba(230,240,250,.7)';
    for (let i = 0; i < 46; i++) {
      const sp = .4 + rnd() * .9, x0 = rnd() * W, y0 = rnd() * h;
      ctx.fillRect(Math.round((x0 + t * 26 * sp) % W), Math.round((y0 + t * 15 * sp) % h), 1, 1);
    }
  }
};

/* ── 6. ЛАГЕРЬ · минута тепла ─────────────────────────────────── */
SCENES.camp = {
  fire(h) { return { x: 70, y: Math.round(h * FEET) - 6 }; },
  paint(ctx, h) {
    const F = this.fire(h), groundY = F.y + 6;
    vgrad(ctx, 0, groundY, '#0c1520', '#131d27', 8);
    scatter(ctx, '#8fa6bd', 26, 0, 0, W, Math.round(h * .22), 41);

    // дальний лес
    const rnd = mulberry32(57);
    ridge(ctx, '#0c141c', Math.round(h * .26), 10, .04, 13, Math.round(h * .40));
    for (let i = 0; i < 26; i++) {
      const x = Math.floor(rnd() * (W + 16)) - 8;
      drawSpr(ctx, SPR.fir, x, Math.round(h * .18) + Math.floor(rnd() * 30),
        { '#': '#0b1219', 'h': '#080d12' }, 2);
    }
    // те, кто стоит между деревьями. Они не двигаются, их просто много
    for (let i = 0; i < 15; i++) {
      const x = Math.floor(rnd() * (W - 8));
      const y = Math.round(h * .34) + Math.floor(rnd() * 26);
      drawSpr(ctx, SPR.walker, x, y, { '#': '#18242e' }, 1);
    }
    // ещё несколько ближе и крупнее — по краям кадра
    for (const [x, y] of [[2, .40], [110, .43], [96, .38]]) {
      drawSpr(ctx, SPR.walker, x, Math.round(h * y), { '#': '#131e27' }, 2);
    }
    // темнота между кромкой леса и кругом света
    ctx.globalAlpha = .55;
    band(ctx, Math.round(h * .28), groundY - Math.round(h * .28), '#060b11');
    ctx.globalAlpha = 1;

    // земля
    vgrad(ctx, groundY - 4, h, '#202a1a', '#0b0f0b', 7);
    for (let i = 0; i < 46; i++) {
      const x = Math.floor(rnd() * W), y = groundY + Math.floor(rnd() * (h - groundY));
      ctx.fillStyle = rnd() > .5 ? '#2c3822' : '#18200f';
      ctx.fillRect(x, y, 2, 1);
    }
    // брёвна, на которых сидят
    ctx.fillStyle = '#2b2116';
    ctx.fillRect(F.x - 48, F.y + 5, 30, 5); ctx.fillRect(F.x + 18, F.y + 5, 30, 5);
    ctx.fillStyle = '#3f3121';
    ctx.fillRect(F.x - 48, F.y + 5, 30, 1); ctx.fillRect(F.x + 18, F.y + 5, 30, 1);
    // брошенный рюкзак и котелок
    ctx.fillStyle = '#3a3626'; ctx.fillRect(F.x - 26, F.y + 14, 8, 6);
    ctx.fillStyle = '#4a4634'; ctx.fillRect(F.x - 26, F.y + 14, 8, 1);
    ctx.fillStyle = '#2e3238'; ctx.fillRect(F.x + 16, F.y + 15, 7, 5);
    ctx.fillStyle = '#3f444c'; ctx.fillRect(F.x + 15, F.y + 14, 9, 1);

    // кочки и камни на вытоптанной земле
    for (let i = 0; i < 16; i++) {
      const x = Math.floor(rnd() * W), y = groundY + 14 + Math.floor(rnd() * Math.max(4, h - groundY - 24));
      if (rnd() > .5) {
        ctx.fillStyle = '#131a10'; ctx.fillRect(x, y, 7, 3);
        ctx.fillStyle = '#1d2716'; ctx.fillRect(x, y, 7, 1);
      } else {
        ctx.fillStyle = '#242c22'; ctx.fillRect(x, y, 4, 2);
      }
    }
    // передний план: тёмные кусты
    ctx.fillStyle = '#050908';
    for (let x = 0; x < W; x++) {
      const y = h - 10 - Math.round(Math.abs(Math.sin(x * .17)) * 12);
      ctx.fillRect(x, y, 1, h - y);
    }
    fadeEdges(ctx, h, 18, 8, '#04070d');
  },
  anim(ctx, h, t, st) {
    const F = this.fire(h);
    const lvl = clamp(st.fan || 0, 0, 3);
    const p = lvl / 3;

    // круг света
    ctx.globalAlpha = .09 + p * .13;
    ctx.fillStyle = '#e08a3a';
    ctx.beginPath();
    ctx.ellipse(F.x, F.y + 6, 30 + p * 30, 12 + p * 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = .10 + p * .12;
    ctx.beginPath();
    ctx.ellipse(F.x, F.y + 4, 18 + p * 16, 8 + p * 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // четверо у огня: тёмный силуэт с тёплой каймой со стороны костра
    const rim = mix('#4a2c18', '#ffb060', .30 + p * .45);
    const art = SPR.sitter;
    const seats = [[F.x - 44, 1], [F.x - 30, -1], [F.x + 20, -1], [F.x + 34, -1]];
    seats.forEach(([x, dir]) => {
      drawRim(ctx, art, x, F.y + 5 - sprH(art), '#070d13', rim, dir, 1);
    });

    // костёр
    ctx.fillStyle = '#2f2317';
    ctx.fillRect(F.x - 11, F.y + 1, 23, 5);
    ctx.fillStyle = '#3f3020'; ctx.fillRect(F.x - 11, F.y + 1, 23, 1);
    ctx.fillStyle = '#4a3826';
    ctx.fillRect(F.x - 8, F.y - 2, 17, 3); ctx.fillRect(F.x - 5, F.y - 4, 11, 2);
    // угли
    ctx.fillStyle = mix('#5a2a10', '#ff7a2e', .3 + p * .6);
    for (let i = 0; i < 6; i++) ctx.fillRect(F.x - 8 + i * 3, F.y + 2, 2, 2);

    flame(ctx, F.x, F.y - 4, 7 + Math.round(p * 22), t, '#fff2cc', '#c93a1e', 4);
    if (lvl > 0) flame(ctx, F.x - 6, F.y - 2, 4 + Math.round(p * 9), t, '#ffd88a', '#c93a1e', 9);
    if (lvl > 1) flame(ctx, F.x + 6, F.y - 2, 4 + Math.round(p * 10), t, '#ffd88a', '#c93a1e', 6);

    scatter(ctx, '#e8a24e', 5 + lvl * 7, F.x - 13, F.y - 38, 26, 34, 3 + Math.floor(t * 4));
  }
};

/* ── 7. ЛОРИЭН · тихая вода ───────────────────────────────────── */
SCENES.lorien = {
  pool(h) { return { x: 58, y: Math.round(h * FEET) + 22 }; },
  vial(h) { return { x: 98, y: Math.round(h * FEET) }; },
  paint(ctx, h) {
    const P = this.pool(h);
    vgrad(ctx, 0, h, '#04080f', '#0c1523', 7);
    scatter(ctx, '#dfe9f5', 46, 0, 0, W, Math.round(h * .45), 11);

    // маллорны: широкие книзу стволы с ветвями
    const rnd = mulberry32(71);
    const trunks = [];
    for (let i = 0; i < 7; i++) {
      trunks.push({ x: Math.floor(rnd() * (W + 20)) - 10, w: 4 + Math.floor(rnd() * 6), s: rnd() });
    }
    for (const tr of trunks) {
      const base = P.y - 26 + Math.floor(tr.s * 10);
      const light = mix('#25364a', '#8fa6bd', .25 + tr.s * .5);
      const bend = y => Math.round(Math.sin(y * .018 + tr.s * 6) * 2.5 + Math.sin(y * .006) * 2);
      for (let y = 0; y < base; y++) {
        const q = y / base;
        const w = Math.max(2, Math.round(tr.w * (.5 + q * .8)));
        const x = tr.x + bend(y);
        ctx.fillStyle = light; ctx.fillRect(x, y, w, 1);
        ctx.fillStyle = 'rgba(226,238,252,.22)'; ctx.fillRect(x, y, 1, 1);
        ctx.fillStyle = 'rgba(4,8,15,.5)'; ctx.fillRect(x + w - 1, y, 1, 1);
      }
      // ветви: выгибаются вверх и утончаются к концу
      for (let k = 0; k < 3; k++) {
        const by = Math.round(base * (.12 + k * .16));
        const dir = k % 2 ? 1 : -1;
        const len = 10 + Math.floor(tr.s * 8);
        for (let s = 1; s <= len; s++) {
          const q = s / len;
          const bx = tr.x + bend(by) + (dir > 0 ? tr.w + s : -s);
          const byy = by - Math.round(s * .35 + s * s * .035);
          ctx.fillStyle = mix(light, '#0b1420', q * .45);
          ctx.fillRect(bx, byy, q > .6 ? 1 : 2, q > .6 ? 1 : 2);
        }
      }
      // корни, расходящиеся по земле
      const bx0 = tr.x + bend(base);
      ctx.fillStyle = mix(light, '#0a121d', .45);
      for (let k = -3; k <= 3; k++)
        ctx.fillRect(bx0 + k * 3, base + Math.abs(k), Math.max(2, tr.w - Math.abs(k)), 3);
    }
    // полог листвы
    ctx.fillStyle = '#0b1420';
    for (let x = 0; x < W; x++) {
      const y = Math.round(20 + Math.sin(x * .3) * 6 + Math.sin(x * .11) * 9);
      ctx.fillRect(x, 0, 1, y);
    }
    scatter(ctx, '#3f5c78', 54, 0, 0, W, 34, 3);
    scatter(ctx, '#9fb6cd', 18, 0, 0, W, 38, 8);

    // земля и трава
    vgrad(ctx, P.y - 30, h, '#10202e', '#08111b', 5);
    for (let i = 0; i < 44; i++) {
      const x = Math.floor(rnd() * W), y = P.y + 16 + Math.floor(rnd() * Math.max(4, h - P.y - 22));
      ctx.fillStyle = rnd() > .6 ? '#1d3346' : '#132433';
      ctx.fillRect(x, y, 2, 1);
    }

    // чаша воды
    ctx.fillStyle = '#1c2d40';
    for (let y = -17; y <= 17; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 17) ** 2)) * 46);
      ctx.fillRect(P.x - w, P.y + y, w * 2, 1);
    }
    for (let y = -14; y <= 14; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 14) ** 2)) * 41);
      ctx.fillStyle = mix('#16293c', '#0a1522', (y + 14) / 28);
      ctx.fillRect(P.x - w, P.y + y, w * 2, 1);
    }
    // рябь на воде: короткие штрихи, а не сплошные линии
    const wr = mulberry32(515);
    for (let y = -12; y <= 12; y += 2) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 14) ** 2)) * 40);
      let x = P.x - w + Math.floor(wr() * 6);
      while (x < P.x + w) {
        ctx.fillStyle = 'rgba(190,216,242,' + (.05 + wr() * .09).toFixed(2) + ')';
        ctx.fillRect(x, P.y + y, 2 + Math.floor(wr() * 5), 1);
        x += 4 + Math.floor(wr() * 9);
      }
    }
    // камни по краю
    ctx.fillStyle = '#22364a';
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2;
      ctx.fillRect(Math.round(P.x + Math.cos(a) * 45) - 2, Math.round(P.y + Math.sin(a) * 17) - 1, 6, 3);
    }
    // камень под сосуд
    const V = this.vial(h);
    ctx.fillStyle = '#2c3d52'; ctx.fillRect(V.x - 12, V.y, 24, 11);
    ctx.fillStyle = '#43597a'; ctx.fillRect(V.x - 12, V.y, 24, 2);
    ctx.fillStyle = '#1a2635'; ctx.fillRect(V.x - 12, V.y + 9, 24, 2);

    fadeEdges(ctx, h, 20, 14, '#04070d');
  },
  anim(ctx, h, t, st) {
    const P = this.pool(h), V = this.vial(h);
    const p = clamp(st.still || 0, 0, 1);
    const rip = st.ripple || 0;

    // одна звезда в небе и её отражение
    glow(ctx, P.x + 4, Math.round(h * .16), 7, '#dfe9f5', .7);
    gem(ctx, P.x + 4, Math.round(h * .16), 2, '#ffffff');

    const wob = rip > 0 ? Math.sin(t * 12) * rip * 4 : Math.sin(t * 1.1) * .7;
    glow(ctx, Math.round(P.x + wob), P.y + 1, 8 + Math.sin(t * 2) * 1.5, '#cfe0f5', (1 - p) * .8);
    ctx.globalAlpha = 1 - p * .8;
    gem(ctx, Math.round(P.x + wob), P.y + 1, 2, '#ffffff');
    ctx.globalAlpha = 1;

    if (rip > 0) {
      ctx.globalAlpha = rip * .45;
      for (let i = 1; i <= 3; i++) ring(ctx, P.x, P.y + 1, ((t * 20 + i * 10) % 36), '#7f96ad');
      ctx.globalAlpha = 1;
    }

    // сосуд наполняется
    ctx.fillStyle = '#a8bccf'; ctx.fillRect(V.x - 4, V.y - 15, 9, 15);
    ctx.fillStyle = '#0a1420'; ctx.fillRect(V.x - 3, V.y - 14, 7, 13);
    ctx.fillStyle = '#8fa6bd'; ctx.fillRect(V.x - 2, V.y - 19, 5, 4);
    const fill = Math.round(p * 12);
    if (fill > 0) {
      ctx.fillStyle = '#dfe9f5'; ctx.fillRect(V.x - 3, V.y - 1 - fill, 7, fill);
      glow(ctx, V.x, V.y - 8, 10 + Math.sin(t * 2) * 2, '#dfe9f5', p);
    }
    // ниточка света от отражения к сосуду
    if (p > 0 && p < 1) {
      ctx.globalAlpha = .55;
      ctx.fillStyle = '#dfe9f5';
      for (let i = 0; i <= 14; i++) {
        const q = i / 14;
        ctx.fillRect(Math.round(lerp(P.x, V.x, q)),
                     Math.round(lerp(P.y + 1, V.y - 8, q) - Math.sin(q * Math.PI) * 12), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }
};

/* ── ЛЕСТНИЦА МАЯКА ───────────────────────────────────────────── */
SCENES.stairs = {
  paint(ctx, h) {
    vgrad(ctx, 0, h, '#080e16', '#111925', 5);

    // каменная кладка стен
    const rnd = mulberry32(133);
    for (const [x0, wd] of [[0, 18], [W - 18, 18]]) {
      ctx.fillStyle = '#212c39'; ctx.fillRect(x0, 0, wd, h);
      for (let y = 0; y < h; y += 8) {
        const off = ((y / 8) | 0) % 2 ? 6 : 0;
        for (let x = x0 - 6 + off; x < x0 + wd; x += 12) {
          ctx.fillStyle = 'rgba(150,180,210,' + (.03 + rnd() * .05).toFixed(2) + ')';
          ctx.fillRect(x + 1, y + 1, 10, 6);
          ctx.fillStyle = 'rgba(6,10,16,.5)';
          ctx.fillRect(x, y, 12, 1); ctx.fillRect(x, y, 1, 8);
        }
      }
    }

    // центральный столб, вокруг которого вьётся лестница
    ctx.fillStyle = '#1b2530'; ctx.fillRect(54, 0, 13, h);
    ctx.fillStyle = '#2a3745'; ctx.fillRect(54, 0, 3, h);
    ctx.fillStyle = '#141c25'; ctx.fillRect(65, 0, 2, h);

    // ступени идут по спирали: ближние широкие и светлые, дальние тонут
    const phase = y => y * .050;
    for (let y = h - 6; y > -14; y -= 9) {
      const ph = phase(y), s = Math.sin(ph), c = Math.cos(ph);
      const outer = Math.round(60 + s * 40);
      const x0 = Math.min(60, outer), x1 = Math.max(60, outer);
      if (x1 - x0 < 3) continue;
      const front = c > 0;
      ctx.fillStyle = front ? '#465872' : '#2b3a4e'; ctx.fillRect(x0, y, x1 - x0, 3);
      ctx.fillStyle = front ? '#5f7499' : '#374862'; ctx.fillRect(x0, y, x1 - x0, 1);
      ctx.fillStyle = front ? '#1c2531' : '#151d27'; ctx.fillRect(x0, y + 3, x1 - x0, 3);
      // столбик перил на внешнем крае
      ctx.fillStyle = front ? '#42536d' : '#28344a';
      ctx.fillRect(outer - (s > 0 ? 2 : 0), y - 13, 2, 14);
    }
    // сами перила — непрерывная винтовая линия
    for (let y = 0; y < h; y++) {
      const ph = phase(y), s = Math.sin(ph), c = Math.cos(ph);
      const x = Math.round(60 + s * 41);
      ctx.fillStyle = c > 0 ? '#7189b0' : '#33415a';
      ctx.fillRect(x - 1, y - 14, 3, 2);
    }

    // окна на море и настенные лампы
    for (let y = 24; y < h - 20; y += 78) {
      ctx.fillStyle = '#0c141d'; ctx.fillRect(W - 17, y, 15, 26);
      vgradIn(ctx, W - 16, y + 1, 13, 24, '#1b3350', '#0b1622');
      ctx.fillStyle = '#2d5478';
      for (let k = 12; k < 24; k += 3) ctx.fillRect(W - 16, y + k, 13, 1);
      ctx.fillStyle = '#0c141d'; ctx.fillRect(W - 11, y, 2, 26);
    }
    for (let y = 60; y < h - 20; y += 78) {
      ctx.fillStyle = '#3a2c18'; ctx.fillRect(15, y, 4, 3);
      ctx.fillStyle = '#e0d6bc'; ctx.fillRect(16, y - 4, 2, 4);
    }
    fadeEdges(ctx, h, 24, 18, '#04070d');
  },
  anim(ctx, h, t) {
    for (let y = 60; y < h - 20; y += 78) {
      flame(ctx, 17, y - 4, 4, t, '#fff0c4', '#ff9a2e', y);
      glow(ctx, 17, y - 6, 20, '#ffb648', .5);
    }
  }
};

/* ── ФОНАРНАЯ КОМНАТА С АППАРАТОМ ─────────────────────────────
   Внизу пульт с семью гнёздами и стеклянной колонной, сверху линза.
   Предметы уходят из инвентаря в гнёзда, колонна набирает свет и
   отдаёт его по трубе наверх — маяк загорается.
   ────────────────────────────────────────────────────────────── */
SCENES.lamp = {
  lens(h)   { return { x: 60, y: Math.round(h * .25), r: 26 }; },
  column(h) { return { x: 52, y: Math.round(h * .45), w: 17, h: 30 }; },
  sockets(h) {
    const y = Math.round(h * .66);
    const out = [];
    for (let i = 0; i < 7; i++) out.push({ x: 13 + i * 15, y });
    return out;
  },

  paint(ctx, h) {
    const L = this.lens(h), C = this.column(h), floorY = Math.round(h * .82);

    vgrad(ctx, 0, floorY, '#050a12', '#0a1420', 6);
    scatter(ctx, '#cfd8e4', 30, 0, 0, W, Math.round(h * .14), 91);

    ctx.fillStyle = '#1a2430'; ctx.fillRect(0, 0, W, 12);          // крыша
    for (let x = 6; x < W; x += 14) { ctx.fillStyle = '#222d39'; ctx.fillRect(x, 0, 3, 12); }
    ctx.fillStyle = '#1e2a36';                                      // переплёты остекления
    for (let x = 4; x < W; x += 19) ctx.fillRect(x, 12, 3, Math.round(h * .42));

    // линза Френеля
    ctx.fillStyle = '#22303f';
    for (let y = -L.r - 2; y <= L.r + 2; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / (L.r + 2)) ** 2)) * (L.r + 2));
      ctx.fillRect(L.x - w, L.y + y, w * 2, 1);
    }
    for (let r = L.r - 2; r > 4; r -= 5) {
      ctx.fillStyle = r % 10 === 3 ? '#2e4054' : '#28374a';
      for (let y = -r; y <= r; y++) {
        const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / r) ** 2)) * r);
        ctx.fillRect(L.x - w, L.y + y, 2, 1);
        ctx.fillRect(L.x + w - 2, L.y + y, 2, 1);
      }
    }
    ctx.fillStyle = 'rgba(190,220,250,.06)';
    for (let y = -L.r + 4; y <= L.r - 4; y += 4) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / L.r) ** 2)) * (L.r - 2));
      ctx.fillRect(L.x - w + 3, L.y + y, Math.max(1, w >> 1), 1);
    }
    ctx.fillStyle = '#33455a'; ctx.fillRect(L.x - 30, L.y + L.r + 2, 60, 4);

    // труба от колонны к линзе
    ctx.fillStyle = '#3a4a5c'; ctx.fillRect(56, L.y + L.r + 6, 9, C.y - (L.y + L.r + 6));
    ctx.fillStyle = '#2a3746'; ctx.fillRect(56, L.y + L.r + 6, 3, C.y - (L.y + L.r + 6));
    ctx.fillStyle = '#4a5c72';
    for (let y = L.y + L.r + 10; y < C.y; y += 9) ctx.fillRect(54, y, 13, 2);

    // стеклянная колонна
    ctx.fillStyle = '#2c3a4a'; ctx.fillRect(C.x - 3, C.y - 3, C.w + 6, C.h + 6);
    ctx.fillStyle = '#0a1420'; ctx.fillRect(C.x, C.y, C.w, C.h);
    ctx.fillStyle = 'rgba(190,220,250,.10)'; ctx.fillRect(C.x + 1, C.y, 3, C.h);
    ctx.fillStyle = '#4a5c72';
    ctx.fillRect(C.x - 5, C.y - 5, C.w + 10, 3); ctx.fillRect(C.x - 5, C.y + C.h + 2, C.w + 10, 3);

    // пульт
    const cTop = Math.round(h * .58);
    ctx.fillStyle = '#4a3a22'; ctx.fillRect(2, cTop, W - 4, floorY - cTop);
    ctx.fillStyle = '#6b5530'; ctx.fillRect(2, cTop, W - 4, 3);
    ctx.fillStyle = '#382c19'; ctx.fillRect(2, floorY - 5, W - 4, 5);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    for (let x = 6; x < W - 6; x += 9) ctx.fillRect(x, cTop + 4, 1, floorY - cTop - 10);

    // приборы и рычаг
    for (const gx of [16, 104]) {
      ctx.fillStyle = '#2a2318'; disc(ctx, gx, cTop + 10, 6, '#2a2318');
      disc(ctx, gx, cTop + 10, 5, '#c8bb90');
      ctx.fillStyle = '#5a4a2a'; ctx.fillRect(gx, cTop + 6, 1, 5); ctx.fillRect(gx, cTop + 10, 4, 1);
    }
    ctx.fillStyle = '#5a4a2a'; ctx.fillRect(58, cTop + 4, 5, 12);
    ctx.fillStyle = '#8a3a2a'; ctx.fillRect(56, cTop + 2, 9, 4);

    // гнёзда
    this.sockets(h).forEach(s => {
      ctx.fillStyle = '#2a2318'; ctx.fillRect(s.x - 6, s.y - 6, 13, 13);
      ctx.fillStyle = '#6b5530'; ctx.fillRect(s.x - 6, s.y - 6, 13, 2);
      ctx.fillStyle = '#0d1219'; ctx.fillRect(s.x - 4, s.y - 4, 9, 9);
    });

    // пол-решётка
    ctx.fillStyle = '#1a232e'; ctx.fillRect(0, floorY, W, h - floorY);
    ctx.fillStyle = '#26313d';
    for (let x = 0; x < W; x += 7) ctx.fillRect(x, floorY, 2, h - floorY);
    for (let y = floorY; y < h; y += 7) ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = '#3a4a5c'; ctx.fillRect(0, floorY - 3, W, 3);

    fadeEdges(ctx, h, 12, 12, '#04070d');
  },

  anim(ctx, h, t, s) {
    const L = this.lens(h), C = this.column(h);
    const lit = s.lit || 0, m = clamp(s.merge || 0, 0, 1);
    const cols = s.colors || [];

    // предметы в гнёздах
    this.sockets(h).forEach((so, i) => {
      if (i >= lit) return;
      const col = cols[i] || '#ffffff';
      glow(ctx, so.x, so.y, 9 + Math.abs(Math.sin(t * 2 + i)) * 2, col, 1);
      drawIcon(ctx, (s.icons && s.icons[i]) || 'shard', so.x - 5, so.y - 5, 1);
      // ниточка света от гнезда к колонне
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = .35 + m * .5;
      ctx.fillStyle = col;
      const steps = 10;
      for (let k = 0; k <= steps; k++) {
        const q = k / steps;
        const ph = (t * .8 + i * .13 + q) % 1;
        if (ph > .35) continue;
        ctx.fillRect(Math.round(lerp(so.x, C.x + C.w / 2, q)),
                     Math.round(lerp(so.y - 6, C.y + C.h, q)), 1, 1);
      }
      ctx.restore();
    });

    // колонна набирает свет
    const fill = Math.round((lit / 7) * C.h * .82 + m * C.h * .18);
    if (fill > 0) {
      for (let k = 0; k < fill; k++) {
        const q = k / Math.max(1, fill);
        const col = cols.length ? cols[Math.min(6, Math.floor(q * lit))] || '#ffffff' : '#ffffff';
        ctx.fillStyle = m > .3 ? mix(col, '#ffffff', (m - .3) / .7) : col;
        ctx.fillRect(C.x + 1, C.y + C.h - 1 - k, C.w - 2, 1);
      }
      glow(ctx, C.x + C.w / 2, C.y + C.h - fill / 2, 14 + m * 14, '#ffffff', .30 + m * .45);
      // пузырьки
      scatter(ctx, '#ffffff', 5, C.x + 2, C.y + C.h - fill, C.w - 4, Math.max(2, fill), 3 + Math.floor(t * 6));
    }

    // свет идёт по трубе вверх
    if (m > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const y0 = C.y, y1 = L.y + L.r + 6;
      for (let y = y0; y > y1; y--) {
        const q = (y0 - y) / Math.max(1, y0 - y1);
        if (q > m * 1.25) break;
        ctx.globalAlpha = .5 * (1 - q * .4);
        ctx.fillStyle = '#dff0ff';
        ctx.fillRect(58, y, 5, 1);
      }
      ctx.restore();
    }

    // линза разгорается
    if (m > .55) {
      const k = (m - .55) / .45;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * .28;
      for (let y = -L.r + 4; y <= L.r - 4; y++) {
        const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / (L.r - 3)) ** 2)) * (L.r - 3));
        ctx.fillStyle = '#cfe4ff'; ctx.fillRect(L.x - w, L.y + y, w * 2, 1);
      }
      ctx.restore();
      glow(ctx, L.x, L.y, 28 + k * 30, '#ffffff', k * .9);
      drawBeams(ctx, L.x, L.y - 1, .22 * k, t * .5, 90, '#ffffff');
    }
  }
};

/* ═══════════════════════════════════════════════════════════════
   ЗВУК. Ничего не грузим — всё синтезируется на месте.
   ═══════════════════════════════════════════════════════════════ */
const SND = {
  ctx: null, master: null, buf: null, muted: false, amb: [],

  boot() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : .5;
    this.master.connect(this.ctx.destination);
    const n = Math.floor(this.ctx.sampleRate * 2);
    this.buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  mute(v) {
    this.muted = v;
    if (this.master) this.master.gain.setTargetAtTime(v ? 0 : .5, this.ctx.currentTime, .05);
  },

  /** Чистый тон с огибающей. */
  tone(f, dur, o) {
    if (!this.ctx || this.muted) return;
    o = o || {};
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    const peak = o.gain == null ? .16 : o.gain;
    const atk = o.attack == null ? .008 : o.attack;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + .05);
  },

  /** Шум через фильтр — из него делаются удары, ветер, прибой и огонь. */
  noise(dur, o) {
    if (!this.ctx || this.muted) return;
    o = o || {};
    const t0 = this.ctx.currentTime + (o.delay || 0);
    const src = this.ctx.createBufferSource();
    src.buffer = this.buf; src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 800, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f1), t0 + dur);
    f.Q.value = o.q == null ? 1 : o.q;
    const g = this.ctx.createGain();
    const peak = o.gain == null ? .12 : o.gain;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack == null ? .01 : o.attack));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + .05);
  },

  arp(freqs, step, o) {
    freqs.forEach((f, i) => this.tone(f, (o && o.dur) || .5,
      Object.assign({ delay: i * step, gain: .12, type: 'triangle' }, o)));
  },

  /* готовые звуки */
  tap()      { this.noise(.07, { f0: 1600, f1: 700, gain: .10, q: .8 }); this.tone(760, .07, { gain: .05, type: 'square' }); },
  crack()    { this.noise(.13, { f0: 3400, f1: 900, gain: .16, q: .7 }); this.tone(220, .10, { to: 110, gain: .08, type: 'square' }); },
  whoosh(up) { this.noise(.34, { f0: up ? 380 : 1100, f1: up ? 1300 : 260, gain: .10, q: .9 }); },
  thud()     { this.tone(72, .30, { to: 42, gain: .22, type: 'sine' }); this.noise(.20, { f0: 200, f1: 70, gain: .10, type: 'lowpass' }); },
  spark(i)   { this.tone(520 + i * 90, .18, { gain: .09, type: 'triangle' }); },
  fillTone(p){ this.tone(360 + p * 420, .14, { gain: .05, type: 'sine' }); },
  clack()    { this.noise(.09, { f0: 2200, f1: 500, gain: .13, q: .6, type: 'bandpass' });
               this.tone(150, .10, { to: 80, gain: .10, type: 'square' }); },
  tick()     { this.noise(.035, { f0: 1900, f1: 900, gain: .045, q: 1.4 }); },
  got(base)  { this.arp([base, base * 1.25, base * 1.5, base * 2], .09, { dur: .8, gain: .11 }); },

  /** Фон мира: гул, дыхание ветра и редкие потрескивания. */
  ambient(cfg) {
    this.stopAmb();
    if (!this.ctx || !cfg) return;
    const t0 = this.ctx.currentTime;
    if (cfg.drone) {
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = cfg.drone;
      g.gain.value = 0;
      g.gain.setTargetAtTime(cfg.dg, t0, 1.2);
      osc.connect(g); g.connect(this.master); osc.start();
      this.amb.push({ osc, g });
    }
    if (cfg.ng) {
      const src = this.ctx.createBufferSource(); src.buffer = this.buf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.value = cfg.nf[0]; f.Q.value = .7;
      const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
      lfo.frequency.value = .06 + Math.random() * .05;
      lg.gain.value = (cfg.nf[1] - cfg.nf[0]) / 2;
      f.frequency.value = (cfg.nf[0] + cfg.nf[1]) / 2;
      lfo.connect(lg); lg.connect(f.frequency);
      const g = this.ctx.createGain(); g.gain.value = 0;
      g.gain.setTargetAtTime(cfg.ng, t0, 1.5);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(); lfo.start();
      this.amb.push({ osc: src, g, lfo });
    }
    if (cfg.crack) {
      const tick = () => {
        if (!this.ambCfg || this.ambCfg !== cfg) return;
        this.noise(.05 + Math.random() * .06, {
          f0: cfg.cf || 2200, f1: (cfg.cf || 2200) * .4,
          gain: .03 + Math.random() * .04, q: 1.2
        });
        this._ct = setTimeout(tick, (400 + Math.random() * 1400) / cfg.crack);
      };
      this._ct = setTimeout(tick, 300);
    }
    this.ambCfg = cfg;
  },
  stopAmb() {
    clearTimeout(this._ct);
    this.ambCfg = null;
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (const a of this.amb) {
      a.g.gain.setTargetAtTime(0, t, .35);
      try { a.osc.stop(t + 1.6); if (a.lfo) a.lfo.stop(t + 1.6); } catch (e) {}
    }
    this.amb = [];
  }
};

/** Фон каждого мира: гул, полоса ветра, частота потрескиваний. */
const AMB = {
  prologue: { drone: 55,  dg: .05, nf: [140, 460],  ng: .034, crack: .25, cf: 900 },
  moscow:   { drone: 98,  dg: .05, nf: [160, 400],  ng: .016, crack: .7,  cf: 1800 },
  niichavo: { drone: 100, dg: .035, nf: [260, 820], ng: .012, crack: 1.1, cf: 2600 },
  desert:   { drone: 62,  dg: .028, nf: [500, 1900],ng: .028, crack: .35, cf: 3200 },
  arrakis:  { drone: 44,  dg: .06, nf: [180, 820],  ng: .040, crack: 0 },
  westeros: { drone: 70,  dg: .04, nf: [700, 2700], ng: .046, crack: .4,  cf: 3000 },
  camp:     { drone: 82,  dg: .04, nf: [180, 640],  ng: .022, crack: 3.4, cf: 2400 },
  lorien:   { drone: 147, dg: .05, nf: [900, 2300], ng: .009, crack: .3,  cf: 3600 },
  finale:   { drone: 110, dg: .05, nf: [200, 900],  ng: .026, crack: .2,  cf: 1600 }
};
/** Нота, на которой звучит огонь каждого мира. */
const KEY = { moscow: 392, niichavo: 440, desert: 494, arrakis: 330, westeros: 294, camp: 262, lorien: 523 };

/* ═══════════════════════════════════════════════════════════════
   ЭФФЕКТЫ: тряска, вспышка, частицы
   ═══════════════════════════════════════════════════════════════ */
const FX = {
  shake: 0, flashA: 0, flashCol: '#ffffff', parts: [], flyers: [],

  hit(power) { this.shake = Math.min(6, this.shake + power); },
  flash(col, a) { this.flashCol = col; this.flashA = Math.max(this.flashA, a); },

  burst(x, y, col, n, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = o.dir == null ? Math.random() * Math.PI * 2
        : o.dir + (Math.random() - .5) * (o.spread == null ? 1.2 : o.spread);
      const sp = (o.speed || 34) * (.35 + Math.random() * .9);
      this.parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: o.g == null ? 34 : o.g, life: (o.life || .8) * (.6 + Math.random() * .8),
        age: 0, col: Array.isArray(col) ? col[(Math.random() * col.length) | 0] : col,
        size: o.size || 1
      });
    }
  },
  /** Предмет летит из сцены в свою ячейку внизу экрана. */
  fly(x, y, tx, ty, col, icon, done) {
    this.flyers.push({ x, y, x0: x, y0: y, tx, ty, col, icon, p: 0, done });
  },

  update(dt) {
    this.shake = Math.max(0, this.shake - dt * 22);
    this.flashA = Math.max(0, this.flashA - dt * 2.4);
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.age += dt;
      if (p.age >= p.life) { this.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
      p.vx *= .985;
    }
    for (let i = this.flyers.length - 1; i >= 0; i--) {
      const f = this.flyers[i];
      f.p += dt * 1.5;
      if (f.p >= 1) { f.done && f.done(); this.flyers.splice(i, 1); continue; }
      const q = smooth(f.p);
      f.x = lerp(f.x0, f.tx, q);
      f.y = lerp(f.y0, f.ty, q) - Math.sin(f.p * Math.PI) * 26;
      if (Math.random() > .5) this.parts.push({
        x: f.x, y: f.y, vx: 0, vy: 0, g: 6, life: .35, age: 0, col: f.col, size: 1
      });
    }
  },

  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.parts) {
      ctx.globalAlpha = (1 - p.age / p.life) * .95;
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    for (const f of this.flyers) {
      ctx.globalAlpha = .55;
      disc(ctx, Math.round(f.x), Math.round(f.y), 8, f.col);
    }
    ctx.restore();
    for (const f of this.flyers) {
      drawIcon(ctx, f.icon, Math.round(f.x) - 5, Math.round(f.y) - 5, 1);
    }
    if (this.flashA > .01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, this.flashA);
      ctx.fillStyle = this.flashCol;
      ctx.fillRect(0, 0, W, AH);
      ctx.restore();
    }
  },
  clear() { this.parts.length = 0; this.flyers.length = 0; this.shake = 0; this.flashA = 0; }
};

/* ═══════════════════════════════════════════════════════════════
   ПОКАЗ ЖЕСТА: рука проделывает действие, потом его повторяют
   ═══════════════════════════════════════════════════════════════ */
const HAND = [
  '...##..', '..####.', '..####.', '..####.', '..####.',
  '.#####.', '#######', '#######', '#######', '.#####.', '..###..'
];
function drawHand(ctx, x, y, a) {
  ctx.globalAlpha = a;
  for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]])   // контур: читается на любом фоне
    drawSpr(ctx, HAND, x - 7 + dx, y + dy, { '#': '#0a0f16' }, 2);
  drawSpr(ctx, HAND, x - 7, y, { '#': '#f2ead6' }, 2);
  ctx.globalAlpha = 1;
}
function dashTo(ctx, x0, y0, x1, y1, phase, col) {
  const n = Math.round(Math.hypot(x1 - x0, y1 - y0) / 3);
  for (let i = 0; i <= n; i++) {
    if ((i + phase) % 3) continue;
    const x = Math.round(lerp(x0, x1, i / n)), y = Math.round(lerp(y0, y1, i / n));
    ctx.globalAlpha = .55;
    ctx.fillStyle = '#0a0f16'; ctx.fillRect(x - 1, y - 1, 5, 5);
    ctx.globalAlpha = .95;
    ctx.fillStyle = col; ctx.fillRect(x, y, 3, 3);
  }
  ctx.globalAlpha = 1;
}
function targetRing(ctx, x, y, t, col) {
  for (let k = 0; k < 2; k++) {
    const q = ((t * 1.6 + k * .5) % 1);
    ctx.globalAlpha = .75 * (1 - q);
    ring(ctx, x, y, Math.round(5 + q * 16), col);
    ctx.globalAlpha = .35 * (1 - q);
    ring(ctx, x, y, Math.round(6 + q * 16), '#ffffff');
  }
  ctx.globalAlpha = 1;
}

/** Рисует подсказку для текущего действия. */
function drawDemo(ctx, h, s, t) {
  const c = s.fire, ph = (t * .8) % 1;
  switch (s.act) {
    case 'hold': {
      const A = SCENES.moscow.act(h);
      targetRing(ctx, A.x, A.y - 30, t, c);
      drawHand(ctx, A.x + 18, A.y - 22 + Math.round(Math.sin(t * 2) * 1.5), .95);
      break;
    }
    case 'choice': {
      const sp = SCENES.niichavo.spots(h);
      const k = Math.floor(t * .9) % 3, p = sp[k];
      targetRing(ctx, p.x, p.y + 8, t, c);
      drawHand(ctx, p.x + 13, p.y + 16 + Math.round(Math.sin(t * 6) * 2), .95);
      break;
    }
    case 'taps': {
      const D = SCENES.desert, d = st.desert;
      const bounce = Math.round(Math.abs(Math.sin(t * 5)) * 9);
      if ((d.zoom || 0) < 1) {                        // общий план: показать на поднос
        const T = D.tray(h);
        targetRing(ctx, T.x, T.y, t, c);
        drawHand(ctx, T.x + 22, T.y - 20 + bounce, .95);
      } else {                                        // приближение: бить по плите
        const b = D.slab(h), cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        targetRing(ctx, cx, cy, t, c);
        drawHand(ctx, cx + 30, cy - 26 + bounce, .95);
      }
      break;
    }
    case 'pull': {
      const A = SCENES.arrakis.thumper(h);
      const gx = A.x + 26, y0 = A.y - 36, y1 = A.y - 4;
      dashTo(ctx, gx, y0, gx, y1, Math.floor(t * 9), c);
      ctx.fillStyle = c;                                  // стрелка вниз
      for (let i = 0; i < 5; i++) ctx.fillRect(gx - 4 + i, y1 - 4 + i, 9 - i * 2, 2);
      drawHand(ctx, gx, Math.round(lerp(y0, y1 - 12, ph)), .95);
      break;
    }
    case 'draw': {
      const pts = SCENES.westeros.runePts(h);
      for (let i = 1; i < pts.length; i++)
        dashTo(ctx, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y, Math.floor(t * 9), c);
      const q = ph * (pts.length - 1), i0 = Math.min(pts.length - 2, Math.floor(q)), f = q - i0;
      drawHand(ctx, Math.round(lerp(pts[i0].x, pts[i0 + 1].x, f)) + 4,
                    Math.round(lerp(pts[i0].y, pts[i0 + 1].y, f)) + 4, .95);
      break;
    }
    case 'fan': {
      const F = SCENES.camp.fire(h);
      const gx = F.x + 26, y0 = F.y + 6, y1 = F.y - 28;
      dashTo(ctx, gx, y1, gx, y0, Math.floor(t * 9), c);
      ctx.fillStyle = c;                                  // стрелка вверх
      for (let i = 0; i < 5; i++) ctx.fillRect(gx - 4 + i, y1 + 4 - i, 9 - i * 2, 2);
      drawHand(ctx, gx, Math.round(lerp(y0, y1, ph)), .95);
      break;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   ПРОЛОГ КАК ПЕРВЫЙ КАДР ПЛЁНКИ
   ═══════════════════════════════════════════════════════════════ */
SCENES.prologue = {
  live: true,
  draw(ctx, h, t, s) {
    const bt = t - (s.t0 || 0), beat = s.beat || 0;
    const hz = Math.round(h * .50);
    vgrad(ctx, 0, hz, '#04070f', '#0b1b2e', 7);
    scatter(ctx, '#cfd8e4', 62, 0, 0, W, hz - 8, 5);
    vgrad(ctx, hz, h, '#0a1826', '#050a12', 6);

    const rockY = Math.round(h * .62);
    drawRock(ctx, 60, rockY, 35);
    const lampY = drawTower(ctx, 60, rockY, 50);

    let on = 1, beam = .22;
    if (beat === 0) beam = .20 + Math.sin(bt * 1.2) * .04;
    if (beat === 1) { const k = clamp(bt / 2.6, 0, 1); on = 1 - k; beam = .20 * (1 - k); }
    if (beat >= 2) { on = 0; beam = 0; }

    drawBeams(ctx, 60, lampY, beam, bt * .5, 110, '#ffe0a0');
    drawLamp(ctx, 60, lampY, on, '#ffe6a8');

    const sea0 = rockY + 16;
    drawSea(ctx, sea0, h, '#1d3f5e');
    if (on > .1) reflect(ctx, 60, sea0, h, '#ffd27a', on * .5);

    if (beat === 1) {                                   // темнота идёт от горизонта
      const k = clamp((bt - .8) / 2.4, 0, 1);
      ctx.globalAlpha = .92; ctx.fillStyle = '#04070d';
      ctx.fillRect(0, hz, W, Math.round((h - hz) * k));
      ctx.fillRect(0, hz - Math.round(hz * k * .9), W, Math.round(hz * k * .9));
      ctx.globalAlpha = 1;
    }
    if (beat >= 2) {
      ctx.globalAlpha = .86; ctx.fillStyle = '#04070d'; ctx.fillRect(0, 0, W, h);
      ctx.globalAlpha = 1;
    }
  }
};

/* ═══════════════════════════════════════════════════════════════
   ДВИЖОК: плёнка из кадров, свайп перематывает
   ═══════════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
const sctx = stage.getContext('2d');
const sayEl = document.getElementById('say');
const hintEl = document.getElementById('hint');
const bagEl = document.getElementById('bag');
const sealEl = document.getElementById('seal');
const soundBtn = document.getElementById('sound');

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GAP = 20;                                    // межкадровая полоса плёнки
const REEL_MS = 1250;                              // столько длится перемотка

/** Фактура плёнки: пылинки, царапины и дрожь заслонки — только на ходу ленты. */
function filmGrain(t, amount) {
  if (reduced || amount < .02) return;
  const rnd = mulberry32(Math.floor(t * 24));      // обновляется 24 раза в секунду
  sctx.save();
  sctx.globalAlpha = .10 * amount + rnd() * .06 * amount;   // мигание заслонки
  sctx.fillStyle = '#03060c';
  sctx.fillRect(0, 0, W, AH);
  sctx.globalAlpha = .22 * amount;                 // пыль и волоски
  sctx.fillStyle = '#e8f0fa';
  for (let i = 0; i < 22; i++) {
    const x = Math.floor(rnd() * W), y = Math.floor(rnd() * AH);
    sctx.fillRect(x, y, 1, rnd() > .8 ? 2 : 1);
  }
  sctx.globalAlpha = .09 * amount;                 // вертикальные царапины
  for (let i = 0; i < 3; i++) {
    const x = Math.floor(rnd() * W);
    sctx.fillRect(x, 0, 1, AH);
  }
  sctx.restore();
}

const FRAMES = [{ id: 'prologue' }]
  .concat(STATIONS.map(s => ({ id: s.scene, station: s })))
  .concat([{ id: 'finale' }]);

let scale = 3, AH = 240;
let idx = 0, phase = 'play', cut = 0, cutting = false, dragging = false;
let idle = 0, demoOn = false, sealUp = false, wheelAcc = 0, advanceLock = 0;
let lastT = performance.now() / 1000;
const st = {};
STATIONS.forEach(s => st[s.id] = {});
const pro = { beat: 0, t0: 0 };
const fin = { beat: -1, t0: 0, lit: 0, colors: [], pan: 0 };
let done = [];
const cache = {};

function layout() {
  const vw = Math.min(innerWidth, 720), vh = innerHeight;
