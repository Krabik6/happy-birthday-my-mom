<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Маяк</title>

<style>
:root {
  --ground:  #04070d;
  --ink:     #e8dcc0;
  --ink-dim: #8c8674;
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans:  ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #04070d; }

.app {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible { outline: 2px solid #e0a94a; outline-offset: 3px; }

/* Полотно мира — приколото к экрану, прокручивается «камера» */
#stage {
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  image-rendering: pixelated;
  z-index: 1;
}
#spacer { width: 1px; }

/* ── Надписи рассказчика ───────────────────────────────── */
.say {
  position: fixed;
  left: 50%; bottom: 84px;
  transform: translateX(-50%) translateY(10px);
  z-index: 6;
  width: min(30ch, calc(100vw - 44px));
  margin: 0;
  text-align: center;
  font-size: 17px;
  line-height: 1.5;
  text-wrap: balance;
  text-shadow: 0 2px 12px #04070d, 0 0 26px #04070d;
  opacity: 0;
  pointer-events: none;
  transition: opacity .55s ease, transform .55s ease;
}
.say.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Печать с цитатой ──────────────────────────────────── */
.seal {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(1.14);
  z-index: 8;
  width: min(34ch, calc(100vw - 40px));
  padding: 22px 24px;
  background: rgba(6, 10, 17, .93);
  border: 1px solid #6d5327;
  box-shadow: 0 0 0 1px rgba(224,169,74,.13), 0 18px 60px rgba(0,0,0,.7);
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1), visibility .4s;
}
.seal.on { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
.seal q {
  display: block;
  font-size: 19px;
  line-height: 1.45;
  font-style: italic;
  quotes: "«" "»";
}
.seal .src {
  display: block;
  margin-top: 14px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .09em;
  color: #9a8a63;
}
.seal .got {
  display: block;
  margin-top: 18px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #e0a94a;
}

/* ── Сумка: семь гнёзд ─────────────────────────────────── */
.bag {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  z-index: 7;
  display: flex;
  gap: 9px;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  pointer-events: none;
}
.slot {
  width: 9px; height: 9px;
  transform: rotate(45deg);
  border: 1px solid #2f3a4a;
  transition: background-color .5s ease, box-shadow .5s ease, border-color .5s ease;
}
.slot.full { border-color: transparent; }

/* ── Подсказка «дальше» ────────────────────────────────── */
.hint {
  position: fixed;
  left: 50%; bottom: 46px;
  transform: translateX(-50%);
  z-index: 6;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #7d8496;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}
.hint.on { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }

/* ── Оверлеи: пролог и финал ───────────────────────────── */
.veil {
  position: fixed; inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: var(--ground);
  text-align: center;
  padding: 26px;
}
.veil[hidden] { display: none; }
.veil canvas { image-rendering: pixelated; position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
#prologue { place-items: end center; padding-bottom: max(20vh, 140px); }
.veil .line {
  position: relative;
  z-index: 2;
  max-width: 26ch;
  font-size: 19px;
  line-height: 1.55;
  text-wrap: balance;
  text-shadow: 0 2px 16px #04070d, 0 0 30px #04070d;
  opacity: 0;
  transition: opacity 1.1s ease;
}
.veil .line.on { opacity: 1; }
.veil .go {
  position: absolute;
  left: 50%; bottom: calc(48px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #e0a94a;
  background: none;
  border: 0;
  padding: 12px 18px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .8s ease;
}
.veil .go.on { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }

/* ── Финал ─────────────────────────────────────────────── */
#finale { place-items: start center; padding-top: max(9vh, 60px); }
#finale .stack {
  position: relative;
  z-index: 2;
  display: grid;
  gap: 22px;
  justify-items: center;
  opacity: 0;
  transition: opacity 1.4s ease;
}
#finale .stack.on { opacity: 1; }
#finale canvas.title { position: static; transform: none; }
#finale .wish { font-size: 20px; line-height: 1.5; text-wrap: balance; }

/* ── Меню ──────────────────────────────────────────────── */
.menu {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  right: max(10px, calc(50vw - 180px));
  z-index: 9;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #4d5666;
  background: none;
  border: 0;
  padding: 8px 10px;
  cursor: pointer;
  opacity: .55;
}
.menu:hover { color: var(--ink); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}
</style>

<div class="app">
  <canvas id="stage" aria-label="Путешествие по семи мирам за огнём для маяка" role="img"></canvas>

</div>

/* ═══════════════════════════════════════════════════════════════
   ПИКСЕЛЬНЫЕ УТИЛИТЫ
   ═══════════════════════════════════════════════════════════════ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, t) => smooth(clamp((t - a) / (b - a), 0, 1));

function mix(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const v = s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t);
  return '#' + ((1 << 24) | (v(16) << 16) | (v(8) << 8) | v(0)).toString(16).slice(1);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), c = v => clamp(Math.round(v), 0, 255);
  return '#' + ((1 << 24) | (c(((n >> 16) & 255) + amt) << 16) |
    (c(((n >> 8) & 255) + amt) << 8) | c((n & 255) + amt)).toString(16).slice(1);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNoise(seed) {
  const rnd = mulberry32(seed), G = 64, g = new Float32Array(G * G);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const at = (x, y) => g[(((y % G) + G) % G) * G + (((x % G) + G) % G)];
  return function (x, y, oct) {
    let s = 0, amp = .5, f = 1, norm = 0;
    for (let i = 0; i < (oct || 3); i++) {
      const x0 = Math.floor(x * f), y0 = Math.floor(y * f);
      const fx = smooth(x * f - x0), fy = smooth(y * f - y0);
      const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
      s += ((a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy) * amp;
      norm += amp; amp *= .5; f *= 2;
    }
    return s / norm;
  };
}

const W = 120;                                   // ширина мира в пикселях арта

function band(ctx, y, h, col) { ctx.fillStyle = col; ctx.fillRect(0, y, W, h); }
function vgrad(ctx, y0, y1, top, bot, n) {
  const h = y1 - y0;
  for (let i = 0; i < n; i++) {
    const a = Math.round(y0 + h * i / n), b = Math.round(y0 + h * (i + 1) / n);
    ctx.fillStyle = mix(top, bot, i / Math.max(1, n - 1));
    ctx.fillRect(0, a, W, b - a);
    if (i < n - 1) {                              // дизеринг на стыке полос
      ctx.fillStyle = mix(top, bot, (i + 1) / (n - 1));
      for (let x = i % 2; x < W; x += 2) ctx.fillRect(x, b - 1, 1, 1);
    }
  }
}
function vgradIn(ctx, x, y, w, h, top, bot) {
  for (let i = 0; i < h; i++) {
    ctx.fillStyle = mix(top, bot, i / Math.max(1, h - 1));
    ctx.fillRect(x, y + i, w, 1);
  }
}
function disc(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(r * r - y * y));
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}
/** Мягкое свечение слоями — один диск на прозрачности читается как шар. */
function glow(ctx, cx, cy, r, col, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';          // свет складывается, а не кроет
  for (let i = 3; i >= 1; i--) {
    ctx.globalAlpha = a * (.08 + (3 - i) * .10);
    disc(ctx, cx, cy, Math.max(1, Math.round(r * i / 3)), col);
  }
  ctx.restore();
}
/** Дорожка света на воде: расходящийся книзу конус, разбитый в дизеринг. */
function reflect(ctx, cx, y0, y1, col, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = col;
  const rnd = mulberry32(4242);
  for (let y = y0; y < y1; y++) {
    const d = (y - y0) / Math.max(1, y1 - y0);
    const half = 1 + Math.round(d * 10);
    for (let x = cx - half; x <= cx + half; x++) {
      const r = rnd();
      if ((x + y) % 2 && r < .55) continue;                 // дизеринг
      const edge = 1 - Math.abs(x - cx) / (half + 1.2);
      const v = a * (1 - d * .75) * edge * edge * (.45 + r * .55);
      if (v < .03) continue;
      ctx.globalAlpha = Math.min(1, v);
      ctx.fillRect(x, y, 1, 1);
    }
  }
  ctx.restore();
}
function ring(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let a = 0; a < 360; a += 4) {
    const t = a * Math.PI / 180;
    ctx.fillRect(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), 1, 1);
  }
}
function scatter(ctx, col, n, x0, y0, w, h, seed) {
  const rnd = mulberry32(seed);
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) ctx.fillRect(x0 + Math.floor(rnd() * w), y0 + Math.floor(rnd() * h), 1, 1);
}
/** Силуэт холмов/крон: заполняет всё, что ниже линии шума. */
function ridge(ctx, col, baseY, amp, freq, seed, toY) {
  const n = makeNoise(seed);
  ctx.fillStyle = col;
  for (let x = 0; x < W; x++) {
    const y = Math.round(baseY - n(x * freq, 3.5, 3) * amp);
    ctx.fillRect(x, y, 1, (toY == null ? baseY + amp * 2 : toY) - y);
  }
}
/** Каплевидное пламя — основа половины сцен. */
function flame(ctx, cx, baseY, size, t, hot, cool, seed) {
  seed = seed || 0;
  for (let i = 0; i < size; i++) {
    const w = Math.max(1, Math.round((size - i) * .52));
    ctx.fillStyle = mix(hot, cool, Math.min(1, i / size * 1.15));
    const wob = Math.round(Math.sin(t * 6.5 + i * .55 + seed) * (i / size) * 1.6);
    ctx.fillRect(cx - (w >> 1) + wob, baseY - i, w, 1);
  }
}
/** Ромбик — читается лучше, чем круг радиусом 1-2. */
function gem(ctx, cx, cy, r, col) {
  ctx.fillStyle = col;
  for (let y = -r; y <= r; y++) {
    const w = r - Math.abs(y);
    ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
  }
}
/** Мягкое затухание в темноту сверху и снизу блока. */
function fadeEdges(ctx, h, top, bottom, col) {
  for (let i = 0; i < top; i++) {
    ctx.globalAlpha = 1 - i / top;
    ctx.fillStyle = col; ctx.fillRect(0, i, W, 1);
  }
  for (let i = 0; i < bottom; i++) {
    ctx.globalAlpha = 1 - i / bottom;
    ctx.fillStyle = col; ctx.fillRect(0, h - 1 - i, W, 1);
  }
  ctx.globalAlpha = 1;
}

/* ── Растровый шрифт: 8 строк, верхняя под диакритику ─────────── */
const GLYPHS = {

const GCACHE = {};

function textWidth(s, tr) {

  tr = tr == null ? 1 : tr;

    for (let r = 0; r < g.length; r++)

  canvas.style.width = (w * scale) + 'px';
  canvas.style.height = (h * scale) + 'px';

  for (let x = cx - halfW; x < cx + halfW; x++) {
    const q = Math.abs(x - cx) / halfW;
    const hh = Math.round(4 + rn(x * .16, 2, 4) * 20 * (1 - q * .55) - q * q * 10);
    if (hh < 1) continue;
    ctx.fillStyle = '#101823'; ctx.fillRect(x, baseY - hh, 1, hh + 18);
    ctx.fillStyle = '#1e2c3b'; ctx.fillRect(x, baseY - hh, 1, 1);

  }

  const top = baseY - hgt;

    ctx.fillStyle = '#2c3a4a'; ctx.fillRect(cx - (wdt >> 1), top + y, wdt, 1);
    ctx.fillStyle = '#202c3a'; ctx.fillRect(cx - (wdt >> 1), top + y, 3, 1);
    ctx.fillStyle = '#3a4c60'; ctx.fillRect(cx + (wdt >> 1) - 1, top + y, 1, 1);
  }
  ctx.fillStyle = '#1b2632';

  ctx.fillStyle = '#3a4a5c'; ctx.fillRect(cx - 9, top - 9, 18, 9);       // галерея

  ctx.fillStyle = '#2c3a4a'; ctx.fillRect(cx - 6, top - 18, 12, 8);      // фонарное помещение

function drawBeams(ctx, cx, lampY, alpha, ang, reach, col) {
  if (alpha <= .01) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = col;
  for (const dir of [0, Math.PI]) {
    for (let k = 0; k < 3; k++) {                   // мягкие края конуса
      ctx.globalAlpha = alpha * (k === 1 ? .7 : .35);
      const spread = .05 + k * .035;
      ctx.beginPath();
      ctx.moveTo(cx, lampY + 1);
      ctx.arc(cx, lampY + 1, reach, ang + dir - spread, ang + dir + spread);
      ctx.closePath(); ctx.fill();
    }

  ctx.restore();
}
/** Море полосами: к низу гуще и контрастнее. */
function drawSea(ctx, y0, y1, col) {
  const rnd = mulberry32(808);
  for (let y = y0; y < y1; y += 2) {
    const d = (y - y0) / Math.max(1, y1 - y0);
    ctx.globalAlpha = .16 + d * .34;

    let x = Math.floor(rnd() * 12);

      ctx.fillRect(x, y, len, 1);
      x += len + 3 + Math.floor(rnd() * 8);

    ctx.fillRect(46, bY + 6, 6, 1); ctx.fillRect(46, bY + 13, 6, 1);
    ctx.fillStyle = '#5c4429'; ctx.fillRect(30, bY + 30, 84, 3);
    ctx.fillStyle = '#e8e2d0'; ctx.fillRect(96, bY + 28, 5, 2);           // мелок

    // часы, которые тут ничего не значат
    ctx.fillStyle = '#5a4126'; ctx.fillRect(12, bY + 2, 14, 14);
    ctx.fillStyle = '#d8d0b8'; ctx.fillRect(14, bY + 4, 10, 10);
    ctx.fillStyle = '#3a2916'; ctx.fillRect(18, bY + 6, 1, 4); ctx.fillRect(19, bY + 9, 4, 1);

    // кот, который всё видел
    drawSpr(ctx, SPR.cat, 20, this.act(h).y - 6, { '#': '#23232a' }, 1);

    // стол
    ctx.fillStyle = '#5a4126'; ctx.fillRect(36, tableY, 82, 5);
    ctx.fillStyle = '#6d5030'; ctx.fillRect(36, tableY, 82, 1);
    ctx.fillStyle = '#3a2916'; ctx.fillRect(42, tableY + 5, 4, 11); ctx.fillRect(108, tableY + 5, 4, 11);
    // мелочь на столе
    ctx.fillStyle = '#8a9a7a'; ctx.fillRect(112, tableY - 6, 5, 6);
    ctx.fillStyle = '#d8d0b8'; ctx.fillRect(38, tableY - 3, 9, 3);

    fadeEdges(ctx, h, 20, 16, '#04070d');
  },
  anim(ctx, h, t, st) {
    const cols = ['#7fd88a', '#d8b95e', '#3fc9a0'];
    const picked = st.pick;
    glow(ctx, 60, 14, 32, '#d8e0a8', .28);

    this.spots(h).forEach((s, i) => {
      const dim = picked != null && picked !== i;
      const pulse = Math.abs(Math.sin(t * 2.2 + i * 1.9)) * 2;
      ctx.globalAlpha = dim ? .16 : 1;
      ctx.fillStyle = '#2f2113'; ctx.fillRect(s.x - 6, s.y + 15, 13, 2);

      if (i === 0) {                                   // склянка с живой водой
        ctx.fillStyle = '#cfe4e8'; ctx.fillRect(s.x - 4, s.y + 3, 9, 12);
        ctx.fillStyle = cols[0];   ctx.fillRect(s.x - 3, s.y + 7, 7, 7);
        ctx.fillStyle = '#e8f6f2'; ctx.fillRect(s.x - 4, s.y + 3, 1, 12);
        ctx.fillStyle = '#8a7a5a'; ctx.fillRect(s.x - 2, s.y, 5, 4);
      } else if (i === 1) {                            // неразменный пятак
        disc(ctx, s.x, s.y + 9, 6, shade(cols[1], -40));
        disc(ctx, s.x, s.y + 8, 6, cols[1]);
        disc(ctx, s.x, s.y + 8, 3, shade(cols[1], 45));
        ctx.fillStyle = shade(cols[1], -60); ctx.fillRect(s.x - 1, s.y + 6, 2, 5);
      } else {                                         // перо феникса
        for (let k = 0; k < 16; k++) {
          const wpx = Math.max(1, Math.round(4 - Math.abs(k - 6) * .45));
          ctx.fillStyle = mix(cols[2], '#ffffff', .35 - k * .02);
          ctx.fillRect(s.x - (wpx >> 1), s.y + k, wpx, 1);
        }
        ctx.fillStyle = shade(cols[2], -50); ctx.fillRect(s.x, s.y + 2, 1, 13);
      }
      if (!dim) glow(ctx, s.x, s.y + 8, 9 + pulse, cols[i], .75);
      ctx.globalAlpha = 1;
    });
  }
};

/* ── 3. ПУСТЫНЯ · фургон в полдень ────────────────────────────── */
SCENES.desert = {
  crystal(h) { return { x: 74, y: Math.round(h * .62) }; },
  paint(ctx, h) {
    const hz = Math.round(h * .40);
    vgrad(ctx, 0, hz, '#dfe3e0', '#f6efd6', 8);
    vgrad(ctx, hz, h, '#d3ad66', '#9c7433', 8);

    // солнце в зените и марево
    ctx.globalAlpha = .55; disc(ctx, 34, 22, 12, '#fffbe8'); ctx.globalAlpha = 1;
    disc(ctx, 34, 22, 7, '#ffffff');
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    for (let y = hz - 6; y < hz + 4; y += 2) ctx.fillRect(0, y, W, 1);

    // столб с провисающими проводами — примета этой дороги
    ctx.fillStyle = '#6b5a44';
    ctx.fillRect(88, hz - 46, 3, 50);
    ctx.fillRect(82, hz - 42, 15, 2);
    ctx.fillStyle = '#4e4133';
    for (let x = 0; x < 82; x++) {
      const q = x / 82;
      ctx.fillRect(x, Math.round(hz - 41 + Math.sin(q * Math.PI) * 7 - q * 3), 1, 1);
      ctx.fillRect(x, Math.round(hz - 37 + Math.sin(q * Math.PI) * 6 - q * 2), 1, 1);
    }
    // две птицы
    ctx.fillStyle = '#8a7a5a';
    for (const [bx, by] of [[30, 40], [42, 52]]) {
      ctx.fillRect(bx, by, 2, 1); ctx.fillRect(bx + 2, by - 1, 2, 1); ctx.fillRect(bx + 4, by, 2, 1);
    }

    // столовые горы вдали
    ctx.fillStyle = '#c9ab84';
    ctx.fillRect(0, hz - 11, 30, 11); ctx.fillRect(5, hz - 15, 18, 4);
    ctx.fillStyle = '#bb9c74';
    ctx.fillRect(84, hz - 9, 36, 9); ctx.fillRect(94, hz - 13, 20, 4);
    ctx.fillStyle = '#a98a63'; ctx.fillRect(0, hz - 3, W, 3);

    // фургон
    const vx = 10, vy = hz + 22;
    ctx.fillStyle = 'rgba(90,64,30,.28)'; ctx.fillRect(vx - 3, vy + 4, 54, 3);
    ctx.fillStyle = '#cfc9b4'; ctx.fillRect(vx, vy - 24, 46, 24);
    ctx.fillStyle = '#eae5d4'; ctx.fillRect(vx, vy - 24, 46, 3);
    ctx.fillStyle = '#9a9482'; ctx.fillRect(vx, vy - 3, 46, 3);
    ctx.fillStyle = '#8a7752'; ctx.fillRect(vx, vy - 10, 46, 3);
    ctx.fillStyle = '#46525d'; ctx.fillRect(vx + 4, vy - 20, 11, 8);
    ctx.fillRect(vx + 18, vy - 20, 11, 8);
    ctx.fillStyle = '#5d6a74'; ctx.fillRect(vx + 4, vy - 20, 11, 2); ctx.fillRect(vx + 18, vy - 20, 11, 2);
    ctx.fillStyle = '#20242a'; ctx.fillRect(vx + 34, vy - 21, 11, 21);
    ctx.fillStyle = '#7d8894'; ctx.fillRect(vx + 45, vy - 21, 2, 21);
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(vx + 7, vy, 7, 5); ctx.fillRect(vx + 33, vy, 7, 5);
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(vx + 8, vy + 1, 5, 3); ctx.fillRect(vx + 34, vy + 1, 5, 3);

    // сагуаро
    const cx = 100;
    ctx.fillStyle = 'rgba(90,64,30,.24)'; ctx.fillRect(cx - 10, hz + 40, 26, 3);
    ctx.fillStyle = '#54724a';
    ctx.fillRect(cx, hz + 2, 6, 38);
    ctx.fillRect(cx - 8, hz + 14, 4, 14); ctx.fillRect(cx - 8, hz + 14, 9, 4);
    ctx.fillRect(cx + 10, hz + 9, 4, 16); ctx.fillRect(cx + 5, hz + 21, 9, 4);
    ctx.fillStyle = '#3f5738'; ctx.fillRect(cx + 4, hz + 2, 2, 38);
    ctx.fillStyle = '#6a8a5c'; ctx.fillRect(cx, hz + 2, 1, 38);

    // кусты и камни
    const rnd = mulberry32(19);
    for (let i = 0; i < 34; i++) {
      const x = Math.floor(rnd() * W), y = hz + 10 + Math.floor(rnd() * (h - hz - 20));
      if (rnd() > .45) {
        ctx.fillStyle = '#8a7a4a';
        ctx.fillRect(x, y, 4, 2); ctx.fillRect(x + 1, y - 2, 2, 2);
      } else {
        ctx.fillStyle = '#7d6440'; ctx.fillRect(x, y, 5, 3);
        ctx.fillStyle = '#96794f'; ctx.fillRect(x, y, 5, 1);
      }
    }
    // след колёс
    ctx.fillStyle = 'rgba(120,88,44,.30)';
    for (let y = hz + 26; y < h; y += 3) {
      ctx.fillRect(16 + Math.round((y - hz) * .18), y, 3, 1);
      ctx.fillRect(40 + Math.round((y - hz) * .30), y, 3, 1);
    }

    // камень под кристалл
    const c = this.crystal(h);
    ctx.fillStyle = 'rgba(90,64,30,.30)'; ctx.fillRect(c.x - 16, c.y + 8, 34, 3);
    ctx.fillStyle = '#8e7148'; ctx.fillRect(c.x - 14, c.y, 30, 9);
    ctx.fillStyle = '#a5875a'; ctx.fillRect(c.x - 14, c.y, 30, 2);
    ctx.fillStyle = '#6f5738'; ctx.fillRect(c.x - 14, c.y + 7, 30, 2);

    // песчаная рябь
    const n = makeNoise(17);
    ctx.fillStyle = 'rgba(120,90,50,.22)';
    for (let y = hz + 6; y < h; y += 4)
      for (let x = (y * 3) % 9; x < W; x += 10)
        if (n(x * .08, y * .08, 2) > .48) ctx.fillRect(x, y, 5, 1);

    // передний план: крупные камни
    ctx.fillStyle = '#8a6c42';
    ctx.fillRect(0, h - 16, 24, 16); ctx.fillRect(4, h - 20, 14, 5);
    ctx.fillRect(96, h - 13, 24, 13); ctx.fillRect(104, h - 17, 12, 5);
    ctx.fillStyle = '#a3855a'; ctx.fillRect(0, h - 16, 24, 2); ctx.fillRect(96, h - 13, 24, 2);

    fadeEdges(ctx, h, 18, 14, '#04070d');
  },
  anim(ctx, h, t, st) {
    const hz = Math.round(h * .40);
    // столб пыли за фургоном
    ctx.globalAlpha = .18;
    ctx.fillStyle = '#efe0ba';
    for (let i = 0; i < 9; i++) {
      const y = hz + 16 - i * 6 + Math.round(Math.sin(t * .7 + i) * 2);
      ctx.fillRect(52 + i + Math.round(Math.sin(t * .9 + i * .6) * 3), y, 12 - i, 5);
    }
    ctx.globalAlpha = 1;

    const c = this.crystal(h);
    const taps = clamp(st.taps || 0, 0, 6);
    const done = taps >= 6;

    // кристалл: гранёный, с каждым ударом скалывается
    const k = 1 - taps / 9;
    const cw = Math.round(15 * k), ch = Math.round(20 * k);
    const bx = c.x, by = c.y;
    for (let i = 0; i < ch; i++) {
      const q = i / ch;
      const wd = Math.max(1, Math.round(cw * (q < .25 ? q * 4 : 1 - (q - .25) * .35)));
      ctx.fillStyle = mix('#7ee8f4', '#1d6d86', q);
      ctx.fillRect(bx - (wd >> 1), by - ch + i, wd, 1);
      ctx.fillStyle = mix('#d8fbff', '#4fd6e8', q);
      ctx.fillRect(bx - (wd >> 1), by - ch + i, Math.max(1, wd >> 2), 1);
    }
    for (let i = 0; i < taps; i++) {
      ctx.fillStyle = '#0d5468';
      ctx.fillRect(bx - 5 + (i * 3) % 10, by - ch + 3 + (i % 3) * 4, 1, 4);
    }
    // осколки на камне
    ctx.fillStyle = '#4fd6e8';
    for (let i = 0; i < taps; i++) ctx.fillRect(bx - 12 + i * 4, by + 2 + (i % 2), 2, 2);

    glow(ctx, bx, by - (ch >> 1), (done ? 18 : 7 + taps * 1.6) + Math.abs(Math.sin(t * 3)) * 2,
      '#4fd6e8', done ? 1.1 : .5 + taps * .09);
    if (done) scatter(ctx, '#bff4fb', 10, bx - 10, by - 26, 20, 24, 3 + Math.floor(t * 5));
  }
};

/* ── 4. АРРАКИС · дюны на закате ──────────────────────────────── */
SCENES.arrakis = {
  thumper(h) { return { x: 74, y: Math.round(h * .64) }; },
  paint(ctx, h) {
    const hz = Math.round(h * .34);
    vgrad(ctx, 0, hz, '#1a1030', '#e07a3a', 10);
    scatter(ctx, '#f0e2d2', 34, 0, 0, W, hz - 26, 5);

    // две луны: большая с тенью, маленькая
    disc(ctx, 92, 20, 9, '#e8d6c0');
    ctx.globalAlpha = .35; disc(ctx, 95, 17, 4, '#b09880'); ctx.globalAlpha = 1;
    disc(ctx, 24, 12, 4, '#cbb9a8');

    // подложка до самого низа, иначе между небом и дюнами зияет шов
    vgrad(ctx, hz - 2, h, '#e8c294', '#7a5240', 4);

    // гряды дюн: у каждой освещённый гребень и уходящий в тень склон
    const n = makeNoise(23);
    const layers = [
      { y: hz + 8,  amp: 4,  lit: '#f0c893', dark: '#a87a52', fall: 22 },
      { y: hz + 26, amp: 7,  lit: '#e6ad6c', dark: '#8d5a3c', fall: 30 },
      { y: hz + 52, amp: 10, lit: '#d6944c', dark: '#6d4436', fall: 40 },
      { y: hz + 86, amp: 13, lit: '#c07d33', dark: '#5a3838', fall: 54 }
    ];
    const paintLayer = L => {
      for (let x = 0; x < W; x++) {
        const top = Math.round(L.y - n(x * .022, L.amp, 3) * L.amp * 2);
        for (let y = top; y < h; y++) {
          ctx.fillStyle = mix(L.lit, L.dark, clamp((y - top) / L.fall, 0, 1));
          ctx.fillRect(x, y, 1, 1);
        }
      }
    };
    paintLayer(layers[0]);
    // червь идёт по дальнему гребню — виден на светлом песке
    ctx.globalAlpha = .40;
    drawSpr(ctx, SPR.worm, 12, hz + 16, { '#': '#6b4632' }, 2);
    ctx.globalAlpha = 1;
    layers.slice(1).forEach(paintLayer);

    // рябь: поперёк склонов, к низу крупнее
    for (let y = hz + 14; y < h; y += 4) {
      const d = (y - hz) / (h - hz);
      ctx.globalAlpha = .10 + d * .14;
      ctx.fillStyle = '#3a2030';
      for (let x = (y * 5) % 13; x < W; x += 9 + Math.round(d * 6))
        ctx.fillRect(x, y, 4 + Math.round(d * 4), 1);
    }
    ctx.globalAlpha = 1;
    // следы на песке к стучалке
    ctx.globalAlpha = .18; ctx.fillStyle = '#2e1b28';
    for (let i = 0; i < 8; i++) ctx.fillRect(14 + i * 6, Math.round(h * .70) + (i % 2) * 3, 3, 2);
    ctx.globalAlpha = 1;

    fadeEdges(ctx, h, 18, 12, '#04070d');
  },
  anim(ctx, h, t, st) {
    const p = clamp(st.pull || 0, 0, 1);
    const A = this.thumper(h), tx = A.x, ty = A.y;

    // стучалка входит в песок
    const sink = Math.round(p * 16);
    const top = ty - 34 + sink;
    ctx.fillStyle = '#5c4c33'; ctx.fillRect(tx - 2, top + 6, 5, 28);      // шток
    ctx.fillStyle = '#7d6a48'; ctx.fillRect(tx - 2, top + 6, 1, 28);
    ctx.fillStyle = '#8a7550'; ctx.fillRect(tx - 7, top, 15, 7);          // груз
    ctx.fillStyle = '#a08c64'; ctx.fillRect(tx - 7, top, 15, 2);
    ctx.fillStyle = '#4a3d28'; ctx.fillRect(tx - 7, top + 6, 15, 1);
    ctx.fillStyle = '#6b5a3e';                                            // кольца
    ctx.fillRect(tx - 4, top + 13, 9, 2); ctx.fillRect(tx - 4, top + 21, 9, 2);

    if (p > .05) {
      ctx.globalAlpha = .30 * p;
      for (let i = 1; i <= 3; i++) ring(ctx, tx, ty + 2, Math.round((t * 14 + i * 11) % 40), '#f0c88e');
      ctx.globalAlpha = 1;
      // песок вздрагивает
      scatter(ctx, '#e8c08a', Math.round(p * 14), tx - 16, ty - 6, 32, 10, 5 + Math.floor(t * 8));
    }

    if (p >= 1) {
      // из воронки поднимается пряность
      ctx.globalAlpha = .5;
      disc(ctx, tx, ty - 2, 9 + Math.abs(Math.sin(t * 2.4)) * 4, '#7d6bd8');
      ctx.globalAlpha = 1;
      scatter(ctx, '#c3b4ff', 20, tx - 12, ty - 30, 24, 30, 3 + Math.floor(t * 5));
      ctx.fillStyle = '#9b8ae8';
      ctx.fillRect(tx - 3, ty - 8, 7, 5);
      ctx.fillStyle = '#c3b4ff'; ctx.fillRect(tx - 3, ty - 8, 7, 1);

      // тень на горизонте разворачивается и идёт сюда
      const wx = 20 + Math.round(sstep(0, 6, t % 12) * 40);
      ctx.globalAlpha = .75;
      drawSpr(ctx, SPR.worm, wx, Math.round(h * .34) + 14, { '#': '#3a2420' }, 3);
      ctx.globalAlpha = 1;
    }
  }
};

/* ── 5. ВЕСТЕРОС · Стена и жаровня ────────────────────────────── */
SCENES.westeros = {
  brazier(h) { return { x: 74, y: Math.round(h * .62) }; },
  runePts(h) {
    const A = this.brazier(h);
    return [
      { x: A.x - 18, y: A.y + 12 }, { x: A.x - 9, y: A.y - 2 }, { x: A.x, y: A.y + 16 },
      { x: A.x + 9, y: A.y - 2 },   { x: A.x + 18, y: A.y + 12 }
    ];
  },
  paint(ctx, h) {
    const A = this.brazier(h), groundY = A.y + 4;
    const wallBottom = Math.round(h * .30);

    vgrad(ctx, 0, groundY, '#050810', '#101d31', 7);

    // Стена: ледяные блоки, уходит за верхний край
    vgradIn(ctx, 0, 0, W, wallBottom, '#152740', '#3a628a');
    const rnd = mulberry32(77);
    for (let y = -6; y < wallBottom; y += 9) {
      const off = ((y / 9) | 0) % 2 ? 9 : 0;
      for (let x = -9 + off; x < W; x += 18) {
        ctx.fillStyle = 'rgba(190,225,250,' + (.05 + rnd() * .09).toFixed(2) + ')';
        ctx.fillRect(x + 1, y + 1, 16, 7);
        ctx.fillStyle = 'rgba(10,22,38,.5)';
        ctx.fillRect(x, y, 18, 1); ctx.fillRect(x, y, 1, 9);
      }
    }
    ctx.fillStyle = 'rgba(190,225,250,.20)';
    for (let i = 0; i < 22; i++) {                       // трещины
      const x = Math.floor(rnd() * W), y = Math.floor(rnd() * wallBottom);
      ctx.fillRect(x, y, 1, 3 + Math.floor(rnd() * 6));
    }
    ctx.fillStyle = '#a8d4ee'; ctx.fillRect(0, wallBottom - 2, W, 2);
    ctx.globalAlpha = .18; ctx.fillStyle = '#a8d4ee'; ctx.fillRect(0, wallBottom, W, 7); ctx.globalAlpha = 1;
    // сосульки
    ctx.fillStyle = '#bcdcf0';
    for (let x = 2; x < W; x += 7) ctx.fillRect(x, wallBottom, 1, 2 + Math.floor(rnd() * 5));

    // чардрева-силуэты, в них и живёт темнота
    for (let i = 0; i < 12; i++) {
      const x = Math.floor(rnd() * (W + 16)) - 8;
      const th = 26 + Math.floor(rnd() * 20);
      const ty = Math.round(h * .52) - th + Math.floor(rnd() * 12);
      ctx.fillStyle = '#070d16';
      ctx.fillRect(x, ty, 3, th);
      ctx.fillRect(x - 5, ty + 4, 13, 3);
      ctx.fillRect(x - 3, ty - 2, 9, 4);
    }

    // снег
    vgrad(ctx, groundY - 3, h, '#cfdcea', '#7f93ab', 6);
    const n = makeNoise(31);
    ctx.fillStyle = '#e2ecf6';
    for (let x = 0; x < W; x++) {
      const y = groundY - 3 - Math.round(n(x * .05, 2, 3) * 5);
      ctx.fillRect(x, y, 1, groundY - y);
    }
    // вытоптанный круг
    ctx.fillStyle = '#63758a';
    for (let x = A.x - 40; x < A.x + 40; x++) {
      if (x < 0 || x >= W) continue;
      const dy = Math.round(Math.sqrt(Math.max(0, 1 - ((x - A.x) / 40) ** 2)) * 8);
      ctx.fillRect(x, A.y + 8 - dy, 1, dy * 2);
    }
    ctx.fillStyle = '#7b8ea3';
    for (let x = A.x - 40; x < A.x + 40; x++) {
      if (x < 0 || x >= W) continue;
      const dy = Math.round(Math.sqrt(Math.max(0, 1 - ((x - A.x) / 40) ** 2)) * 8);
      ctx.fillRect(x, A.y + 8 - dy, 1, 1);
    }
    // жаровня: сужающаяся чаша на трёх ножках
    for (let i = 0; i < 7; i++) {
      const wd = 17 - i * 2;
      ctx.fillStyle = i < 2 ? '#3d3835' : '#242020';
      ctx.fillRect(A.x - (wd >> 1), A.y - 6 + i, wd, 1);
    }
    ctx.fillStyle = '#4a443f'; ctx.fillRect(A.x - 10, A.y - 7, 21, 2);
    ctx.fillStyle = '#1a1717';
    ctx.fillRect(A.x - 6, A.y + 1, 2, 9); ctx.fillRect(A.x + 5, A.y + 1, 2, 9);
    ctx.fillRect(A.x, A.y + 1, 2, 10);
    ctx.fillStyle = '#2a2523'; ctx.fillRect(A.x - 8, A.y + 10, 17, 2);

    // следы на снегу, ведущие к кругу
    ctx.fillStyle = 'rgba(90,110,132,.5)';
    for (let i = 0; i < 9; i++) ctx.fillRect(6 + i * 5, A.y + 16 + (i % 2) * 3, 2, 2);
    // камни и веточки
    const r2 = mulberry32(53);
    for (let i = 0; i < 12; i++) {
      const x = Math.floor(r2() * W), y = A.y + 12 + Math.floor(r2() * (h - A.y - 24));
      ctx.fillStyle = r2() > .5 ? '#93a5b9' : '#6c7d90';
      ctx.fillRect(x, y, 3, 2);
    }
    // передний план: сугроб
    ctx.fillStyle = '#e6eff8';
    for (let x = 0; x < W; x++) {
      const y = h - 10 - Math.round(n(x * .04 + 9, 5, 3) * 9);
      ctx.fillRect(x, y, 1, h - y);
    }
    ctx.fillStyle = '#c3d2e2';
    for (let x = 0; x < W; x++) {
      const y = h - 10 - Math.round(n(x * .04 + 9, 5, 3) * 9);
      ctx.fillRect(x, y + 2, 1, 1);
    }
    fadeEdges(ctx, h, 16, 10, '#04070d');
  },
  anim(ctx, h, t, st) {
    const A = this.brazier(h);
    const done = st.done;
    const lit = st.marks ? st.marks.filter(Boolean).length : 0;

    // синие глаза в чардревах — отступают, когда огонь встаёт
    ctx.globalAlpha = (done ? .12 : 1) * (.5 + Math.abs(Math.sin(t * .8)) * .35);
    ctx.fillStyle = '#63c8ff';
    for (const [ex, ey] of [[6, .46], [24, .50], [96, .47], [112, .52], [40, .44]]) {
      const yy = Math.round(h * ey) + (done ? 5 : 0);
      ctx.fillRect(ex, yy, 2, 1); ctx.fillRect(ex + 4, yy, 2, 1);
    }
    ctx.globalAlpha = 1;

    // угли знака
    const pts = this.runePts(h);
    if (st.marks) {
      ctx.strokeStyle = '#ff7a2e'; ctx.lineWidth = 1;
      for (let i = 1; i < pts.length; i++) {
        if (!st.marks[i - 1] || !st.marks[i]) continue;
        ctx.beginPath();
        ctx.moveTo(pts[i - 1].x + .5, pts[i - 1].y + .5);
        ctx.lineTo(pts[i].x + .5, pts[i].y + .5);
        ctx.stroke();
      }
    }
    pts.forEach((p, i) => {
      const on = st.marks && st.marks[i];
      if (on) {
        gem(ctx, p.x, p.y, 2, '#ffcf7a');
        ctx.globalAlpha = .35; disc(ctx, p.x, p.y, 4, '#ff7a2e'); ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = .5 + Math.abs(Math.sin(t * 2 + i)) * .35;
        ctx.fillStyle = '#8a5240';
        ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
        ctx.globalAlpha = 1;
      }
    });

    // пламя в жаровне
    const power = done ? 1 : lit / 5;
    flame(ctx, A.x, A.y - 6, 5 + Math.round(power * 26), t, '#fff0c0', '#e8452c', 2);
    if (done) {
      glow(ctx, A.x, A.y - 16, 40 + Math.abs(Math.sin(t * 2)) * 4, '#e8452c', .55);
      scatter(ctx, '#ffa860', 12, A.x - 12, A.y - 44, 24, 34, 3 + Math.floor(t * 6));
    }

    // метель
    const rnd = mulberry32(9);
    ctx.fillStyle = 'rgba(230,240,250,.7)';
    for (let i = 0; i < 46; i++) {
      const sp = .4 + rnd() * .9, x0 = rnd() * W, y0 = rnd() * h;
      ctx.fillRect(Math.round((x0 + t * 26 * sp) % W), Math.round((y0 + t * 15 * sp) % h), 1, 1);
    }
  }
};

/* ── 6. ЛАГЕРЬ · минута тепла ─────────────────────────────────── */
SCENES.camp = {
  fire(h) { return { x: 70, y: Math.round(h * .64) }; },
  paint(ctx, h) {
    const F = this.fire(h), groundY = F.y + 6;
    vgrad(ctx, 0, groundY, '#0d1620', '#243440', 8);
    scatter(ctx, '#8fa6bd', 26, 0, 0, W, Math.round(h * .22), 41);

    // дальний лес
    const rnd = mulberry32(57);
    ridge(ctx, '#0c141c', Math.round(h * .26), 10, .04, 13, Math.round(h * .40));
    for (let i = 0; i < 26; i++) {
      const x = Math.floor(rnd() * (W + 16)) - 8;
      drawSpr(ctx, SPR.fir, x, Math.round(h * .18) + Math.floor(rnd() * 30),
        { '#': '#0b1219', 'h': '#080d12' }, 2);
    }
    // те, кто стоит между деревьями. Они не двигаются, их просто много
    for (let i = 0; i < 15; i++) {
      const x = Math.floor(rnd() * (W - 8));
      const y = Math.round(h * .34) + Math.floor(rnd() * 26);
      drawSpr(ctx, SPR.walker, x, y, { '#': '#18242e' }, 1);
    }
    // ещё несколько ближе и крупнее — по краям кадра
    for (const [x, y] of [[2, .40], [110, .43], [96, .38]]) {
      drawSpr(ctx, SPR.walker, x, Math.round(h * y), { '#': '#131e27' }, 2);
    }
    ctx.globalAlpha = .55; band(ctx, Math.round(h * .28), Math.round(h * .30), '#060b11'); ctx.globalAlpha = 1;

    // земля
    vgrad(ctx, groundY - 4, h, '#202a1a', '#0b0f0b', 7);
    for (let i = 0; i < 46; i++) {
      const x = Math.floor(rnd() * W), y = groundY + Math.floor(rnd() * (h - groundY));
      ctx.fillStyle = rnd() > .5 ? '#2c3822' : '#18200f';
      ctx.fillRect(x, y, 2, 1);
    }
    // брёвна, на которых сидят
    ctx.fillStyle = '#2b2116';
    ctx.fillRect(F.x - 48, F.y + 5, 30, 5); ctx.fillRect(F.x + 18, F.y + 5, 30, 5);
    ctx.fillStyle = '#3f3121';
    ctx.fillRect(F.x - 48, F.y + 5, 30, 1); ctx.fillRect(F.x + 18, F.y + 5, 30, 1);
    // брошенный рюкзак и котелок
    ctx.fillStyle = '#3a3626'; ctx.fillRect(F.x - 26, F.y + 14, 8, 6);
    ctx.fillStyle = '#4a4634'; ctx.fillRect(F.x - 26, F.y + 14, 8, 1);
    ctx.fillStyle = '#2e3238'; ctx.fillRect(F.x + 16, F.y + 15, 7, 5);
    ctx.fillStyle = '#3f444c'; ctx.fillRect(F.x + 15, F.y + 14, 9, 1);

    // передний план: тёмные кусты
    ctx.fillStyle = '#060a08';
    for (let x = 0; x < W; x++) {
      const y = h - 8 - Math.round(Math.abs(Math.sin(x * .17)) * 10);
      ctx.fillRect(x, y, 1, h - y);
    }
    fadeEdges(ctx, h, 18, 8, '#04070d');
  },
  anim(ctx, h, t, st) {
    const F = this.fire(h);
    const lvl = clamp(st.fan || 0, 0, 3);
    const p = lvl / 3;

    // круг света
    ctx.globalAlpha = .09 + p * .13;
    ctx.fillStyle = '#e08a3a';
    ctx.beginPath();
    ctx.ellipse(F.x, F.y + 6, 30 + p * 30, 12 + p * 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = .10 + p * .12;
    ctx.beginPath();
    ctx.ellipse(F.x, F.y + 4, 18 + p * 16, 8 + p * 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // четверо у огня: тёмный силуэт с тёплой каймой со стороны костра
    const rim = mix('#4a2c18', '#ffb060', .30 + p * .45);
    const art = SPR.sitter;
    const seats = [[F.x - 44, 1], [F.x - 30, -1], [F.x + 20, -1], [F.x + 34, -1]];
    seats.forEach(([x, dir]) => {
      drawRim(ctx, art, x, F.y + 5 - sprH(art), '#070d13', rim, dir, 1);
    });

    // костёр
    ctx.fillStyle = '#2f2317';
    ctx.fillRect(F.x - 11, F.y + 1, 23, 5);
    ctx.fillStyle = '#3f3020'; ctx.fillRect(F.x - 11, F.y + 1, 23, 1);
    ctx.fillStyle = '#4a3826';
    ctx.fillRect(F.x - 8, F.y - 2, 17, 3); ctx.fillRect(F.x - 5, F.y - 4, 11, 2);
    // угли
    ctx.fillStyle = mix('#5a2a10', '#ff7a2e', .3 + p * .6);
    for (let i = 0; i < 6; i++) ctx.fillRect(F.x - 8 + i * 3, F.y + 2, 2, 2);

    flame(ctx, F.x, F.y - 4, 7 + Math.round(p * 22), t, '#fff2cc', '#c93a1e', 4);
    if (lvl > 0) flame(ctx, F.x - 6, F.y - 2, 4 + Math.round(p * 9), t, '#ffd88a', '#c93a1e', 9);
    if (lvl > 1) flame(ctx, F.x + 6, F.y - 2, 4 + Math.round(p * 10), t, '#ffd88a', '#c93a1e', 6);

    scatter(ctx, '#e8a24e', 5 + lvl * 7, F.x - 13, F.y - 38, 26, 34, 3 + Math.floor(t * 4));
  }
};

/* ── 7. ЛОРИЭН · тихая вода ───────────────────────────────────── */
SCENES.lorien = {
  pool(h) { return { x: 58, y: Math.round(h * .68) }; },
  vial(h) { return { x: 98, y: Math.round(h * .58) }; },
  paint(ctx, h) {
    const P = this.pool(h);
    vgrad(ctx, 0, h, '#04080f', '#0c1523', 7);
    scatter(ctx, '#dfe9f5', 46, 0, 0, W, Math.round(h * .45), 11);

    // маллорны: широкие книзу стволы с ветвями
    const rnd = mulberry32(71);
    const trunks = [];
    for (let i = 0; i < 7; i++) {
      trunks.push({ x: Math.floor(rnd() * (W + 20)) - 10, w: 4 + Math.floor(rnd() * 6), s: rnd() });
    }
    for (const tr of trunks) {
      const base = P.y - 6 + Math.floor(tr.s * 10);
      const light = mix('#25364a', '#8fa6bd', .25 + tr.s * .5);
      for (let y = 0; y < base; y++) {
        const q = y / base;
        const w = Math.max(2, Math.round(tr.w * (.55 + q * .75)));
        ctx.fillStyle = light; ctx.fillRect(tr.x, y, w, 1);
        ctx.fillStyle = 'rgba(226,238,252,.22)'; ctx.fillRect(tr.x, y, 1, 1);
        ctx.fillStyle = 'rgba(4,8,15,.5)'; ctx.fillRect(tr.x + w - 1, y, 1, 1);
      }
      // ветви уходят вверх и в сторону
      ctx.fillStyle = light;
      for (let k = 0; k < 3; k++) {
        const by = Math.round(base * (.14 + k * .17));
        const dir = k % 2 ? 1 : -1;
        for (let s = 1; s <= 13; s++) {
          const bx = dir > 0 ? tr.x + tr.w + s : tr.x - s;
          ctx.fillRect(bx, by - Math.round(s * .55), 2, 2);
        }
      }
      // корни
      ctx.fillStyle = mix(light, '#0a121d', .4);
      for (let k = -2; k <= 2; k++)
        ctx.fillRect(tr.x + k * 3, base + Math.abs(k), Math.max(2, tr.w - Math.abs(k)), 3);
    }
    // полог листвы
    ctx.fillStyle = '#0b1420';
    for (let x = 0; x < W; x++) {
      const y = Math.round(20 + Math.sin(x * .3) * 6 + Math.sin(x * .11) * 9);
      ctx.fillRect(x, 0, 1, y);
    }
    scatter(ctx, '#3f5c78', 54, 0, 0, W, 34, 3);
    scatter(ctx, '#9fb6cd', 18, 0, 0, W, 38, 8);

    // земля и трава
    vgrad(ctx, P.y - 22, h, '#10202e', '#08111b', 5);
    for (let i = 0; i < 40; i++) {
      const x = Math.floor(rnd() * W), y = P.y + 14 + Math.floor(rnd() * (h - P.y - 20));
      ctx.fillStyle = rnd() > .6 ? '#1d3346' : '#132433';
      ctx.fillRect(x, y, 2, 1);
    }

    // чаша воды
    ctx.fillStyle = '#1c2d40';
    for (let y = -17; y <= 17; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 17) ** 2)) * 46);
      ctx.fillRect(P.x - w, P.y + y, w * 2, 1);
    }
    for (let y = -14; y <= 14; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 14) ** 2)) * 41);
      ctx.fillStyle = mix('#16293c', '#0a1522', (y + 14) / 28);
      ctx.fillRect(P.x - w, P.y + y, w * 2, 1);
    }
    ctx.fillStyle = 'rgba(200,222,245,.10)';                 // блик на воде
    for (let y = -10; y <= 8; y += 4) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 14) ** 2)) * 34);
      ctx.fillRect(P.x - w + 4, P.y + y, w, 1);
    }
    // камни по краю
    ctx.fillStyle = '#22364a';
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2;
      ctx.fillRect(Math.round(P.x + Math.cos(a) * 45) - 2, Math.round(P.y + Math.sin(a) * 17) - 1, 6, 3);
    }
    // камень под сосуд
    const V = this.vial(h);
    ctx.fillStyle = '#2c3d52'; ctx.fillRect(V.x - 12, V.y, 24, 11);
    ctx.fillStyle = '#43597a'; ctx.fillRect(V.x - 12, V.y, 24, 2);
    ctx.fillStyle = '#1a2635'; ctx.fillRect(V.x - 12, V.y + 9, 24, 2);

    fadeEdges(ctx, h, 20, 14, '#04070d');
  },
  anim(ctx, h, t, st) {
    const P = this.pool(h), V = this.vial(h);
    const p = clamp(st.still || 0, 0, 1);
    const rip = st.ripple || 0;

    // одна звезда в небе и её отражение
    glow(ctx, P.x + 4, Math.round(h * .16), 7, '#dfe9f5', .7);
    gem(ctx, P.x + 4, Math.round(h * .16), 2, '#ffffff');

    const wob = rip > 0 ? Math.sin(t * 12) * rip * 4 : Math.sin(t * 1.1) * .7;
    glow(ctx, Math.round(P.x + wob), P.y + 1, 8 + Math.sin(t * 2) * 1.5, '#cfe0f5', (1 - p) * .8);
    ctx.globalAlpha = 1 - p * .8;
    gem(ctx, Math.round(P.x + wob), P.y + 1, 2, '#ffffff');
    ctx.globalAlpha = 1;

    if (rip > 0) {
      ctx.globalAlpha = rip * .45;
      for (let i = 1; i <= 3; i++) ring(ctx, P.x, P.y + 1, ((t * 20 + i * 10) % 36), '#7f96ad');
      ctx.globalAlpha = 1;
    }

    // сосуд наполняется
    ctx.fillStyle = '#a8bccf'; ctx.fillRect(V.x - 4, V.y - 15, 9, 15);
    ctx.fillStyle = '#0a1420'; ctx.fillRect(V.x - 3, V.y - 14, 7, 13);
    ctx.fillStyle = '#8fa6bd'; ctx.fillRect(V.x - 2, V.y - 19, 5, 4);
    const fill = Math.round(p * 12);
    if (fill > 0) {
      ctx.fillStyle = '#dfe9f5'; ctx.fillRect(V.x - 3, V.y - 1 - fill, 7, fill);
      glow(ctx, V.x, V.y - 8, 10 + Math.sin(t * 2) * 2, '#dfe9f5', p);
    }
    // ниточка света от отражения к сосуду
    if (p > 0 && p < 1) {
      ctx.globalAlpha = .55;
      ctx.fillStyle = '#dfe9f5';
      for (let i = 0; i <= 14; i++) {
        const q = i / 14;
        ctx.fillRect(Math.round(lerp(P.x, V.x, q)),
                     Math.round(lerp(P.y + 1, V.y - 8, q) - Math.sin(q * Math.PI) * 12), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }
};

/* ── ЛЕСТНИЦА МАЯКА ───────────────────────────────────────────── */
SCENES.stairs = {
  paint(ctx, h) {
    vgrad(ctx, 0, h, '#080e16', '#111925', 5);

    // каменная кладка стен
    const rnd = mulberry32(133);
    for (const [x0, wd] of [[0, 18], [W - 18, 18]]) {
      ctx.fillStyle = '#212c39'; ctx.fillRect(x0, 0, wd, h);
      for (let y = 0; y < h; y += 8) {
        const off = ((y / 8) | 0) % 2 ? 6 : 0;
        for (let x = x0 - 6 + off; x < x0 + wd; x += 12) {
          ctx.fillStyle = 'rgba(150,180,210,' + (.03 + rnd() * .05).toFixed(2) + ')';
          ctx.fillRect(x + 1, y + 1, 10, 6);
          ctx.fillStyle = 'rgba(6,10,16,.5)';
          ctx.fillRect(x, y, 12, 1); ctx.fillRect(x, y, 1, 8);
        }
      }
    }

    // центральный столб, вокруг которого вьётся лестница
    ctx.fillStyle = '#1b2530'; ctx.fillRect(54, 0, 13, h);
    ctx.fillStyle = '#2a3745'; ctx.fillRect(54, 0, 3, h);
    ctx.fillStyle = '#141c25'; ctx.fillRect(65, 0, 2, h);

    // ступени идут по спирали: ближние широкие и светлые, дальние тонут
    const phase = y => y * .050;
    for (let y = h - 6; y > -14; y -= 9) {
      const ph = phase(y), s = Math.sin(ph), c = Math.cos(ph);
      const outer = Math.round(60 + s * 40);
      const x0 = Math.min(60, outer), x1 = Math.max(60, outer);
      if (x1 - x0 < 3) continue;
      const front = c > 0;
      ctx.fillStyle = front ? '#465872' : '#2b3a4e'; ctx.fillRect(x0, y, x1 - x0, 3);
      ctx.fillStyle = front ? '#5f7499' : '#374862'; ctx.fillRect(x0, y, x1 - x0, 1);
      ctx.fillStyle = front ? '#1c2531' : '#151d27'; ctx.fillRect(x0, y + 3, x1 - x0, 3);
      // столбик перил на внешнем крае
      ctx.fillStyle = front ? '#42536d' : '#28344a';
      ctx.fillRect(outer - (s > 0 ? 2 : 0), y - 13, 2, 14);
    }
    // сами перила — непрерывная винтовая линия
    for (let y = 0; y < h; y++) {
      const ph = phase(y), s = Math.sin(ph), c = Math.cos(ph);
      const x = Math.round(60 + s * 41);
      ctx.fillStyle = c > 0 ? '#7189b0' : '#33415a';
      ctx.fillRect(x - 1, y - 14, 3, 2);
    }

    // окна на море и настенные лампы
    for (let y = 24; y < h - 20; y += 78) {
      ctx.fillStyle = '#0c141d'; ctx.fillRect(W - 17, y, 15, 26);
      vgradIn(ctx, W - 16, y + 1, 13, 24, '#1b3350', '#0b1622');
      ctx.fillStyle = '#2d5478';
      for (let k = 12; k < 24; k += 3) ctx.fillRect(W - 16, y + k, 13, 1);
      ctx.fillStyle = '#0c141d'; ctx.fillRect(W - 11, y, 2, 26);
    }
    for (let y = 60; y < h - 20; y += 78) {
      ctx.fillStyle = '#3a2c18'; ctx.fillRect(15, y, 4, 3);
      ctx.fillStyle = '#e0d6bc'; ctx.fillRect(16, y - 4, 2, 4);
    }
    fadeEdges(ctx, h, 24, 18, '#04070d');
  },
  anim(ctx, h, t) {
    for (let y = 60; y < h - 20; y += 78) {
      flame(ctx, 17, y - 4, 4, t, '#fff0c4', '#ff9a2e', y);
      glow(ctx, 17, y - 6, 20, '#ffb648', .5);
    }
  }
};

/* ── ЛАМПОВАЯ ─────────────────────────────────────────────────── */
SCENES.lamp = {
  paint(ctx, h) {
    const cy = Math.round(h * .44);
    const floorY = Math.round(h * .76);

    // за стеклом — ночь и море
    vgrad(ctx, 0, floorY, '#050a12', '#0b1a2a', 6);
    scatter(ctx, '#cfd8e4', 40, 0, 0, W, Math.round(h * .30), 91);
    drawSea(ctx, Math.round(h * .58), floorY, '#12293f');

    // крыша с рёбрами
    ctx.fillStyle = '#1a2430'; ctx.fillRect(0, 0, W, 16);
    ctx.fillStyle = '#26333f'; ctx.fillRect(0, 14, W, 3);
    for (let x = 6; x < W; x += 14) { ctx.fillStyle = '#222d39'; ctx.fillRect(x, 0, 3, 16); }

    // остекление: вертикальные переплёты
    ctx.fillStyle = '#1e2a36';
    for (let x = 4; x < W; x += 19) ctx.fillRect(x, 17, 3, floorY - 17);
    ctx.fillStyle = '#26333f';
    ctx.fillRect(0, Math.round(h * .30), W, 2); ctx.fillRect(0, Math.round(h * .58), W, 2);

    // линза Френеля: концентрические призмы
    ctx.fillStyle = '#22303f';
    for (let y = -28; y <= 28; y++) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 28) ** 2)) * 28);
      ctx.fillRect(60 - w, cy + y, w * 2, 1);
    }
    for (let r = 26; r > 4; r -= 5) {
      ctx.fillStyle = r % 10 === 6 ? '#2e4054' : '#28374a';
      for (let y = -r; y <= r; y++) {
        const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / r) ** 2)) * r);
        ctx.fillRect(60 - w, cy + y, 2, 1);
        ctx.fillRect(60 + w - 2, cy + y, 2, 1);
      }
    }
    ctx.fillStyle = 'rgba(190,220,250,.07)';
    for (let y = -24; y <= 24; y += 4) {
      const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 28) ** 2)) * 26);
      ctx.fillRect(60 - w + 3, cy + y, Math.max(1, w >> 1), 1);
    }
    // оправа и постамент
    ctx.fillStyle = '#33455a'; ctx.fillRect(28, cy + 28, 64, 4);
    ctx.fillStyle = '#2a3849'; ctx.fillRect(34, cy + 32, 52, 8);
    ctx.fillStyle = '#1f2b39'; ctx.fillRect(40, cy + 40, 40, floorY - (cy + 40));

    // пол-решётка и поручень
    ctx.fillStyle = '#1a232e'; ctx.fillRect(0, floorY, W, h - floorY);
    ctx.fillStyle = '#26313d';
    for (let x = 0; x < W; x += 7) ctx.fillRect(x, floorY, 2, h - floorY);
    for (let y = floorY; y < h; y += 7) ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = '#3a4a5c'; ctx.fillRect(0, floorY - 3, W, 3);

    // гнёзда под огни
    this.sockets(h).forEach(s => {
      ctx.fillStyle = '#3a4a5c'; ctx.fillRect(s.x - 4, s.y - 3, 9, 7);
      ctx.fillStyle = '#131c26'; ctx.fillRect(s.x - 3, s.y - 2, 7, 5);
      ctx.fillStyle = '#4a5c72'; ctx.fillRect(s.x - 4, s.y + 4, 9, 2);
    });
    fadeEdges(ctx, h, 14, 14, '#04070d');
  },
  anim(ctx, h, t, st) {
    const cy = Math.round(h * .44);
    const lit = st.lit || 0;
    this.sockets(h).forEach((s, i) => {
      if (i >= lit) return;
      const col = st.colors[i];
      glow(ctx, s.x, s.y, 9 + Math.abs(Math.sin(t * 2 + i)) * 2, col, 1);
      gem(ctx, s.x, s.y, 2, col);
      // отсвет на оправе линзы
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = .16;
      ctx.fillStyle = col;
      ctx.fillRect(s.x - 2, cy + 28, 5, 4);
      ctx.restore();
    });
    if (lit > 0) {
      glow(ctx, 60, cy, 52, '#ffffff', .13 * lit);
      // линза начинает светиться изнутри
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = .05 * lit;
      for (let y = -22; y <= 22; y++) {
        const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / 22) ** 2)) * 22);
        ctx.fillStyle = '#cfe4ff'; ctx.fillRect(60 - w, cy + y, w * 2, 1);
      }
      ctx.restore();
    }
  },
  sockets(h) {
    const cy = Math.round(h * .44), out = [];
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * .18 + (i / 6) * Math.PI * .64;      // дуга под линзой
      out.push({ x: Math.round(60 - Math.cos(a) * 44), y: Math.round(cy + Math.sin(a) * 40) });
    }
    return out;
  }
};

/* ═══════════════════════════════════════════════════════════════
   ДВИЖОК
   ═══════════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
const sctx = stage.getContext('2d');
const spacer = document.getElementById('spacer');
const sayEl = document.getElementById('say');
const hintEl = document.getElementById('hint');
const bagEl = document.getElementById('bag');
const sealEl = document.getElementById('seal');

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let scale = 3, AH = 240, blocks = [], worldH = 0, cam = 0, maxCam = 0;
let active = null, walkPhase = 0, lastCam = 0;
const st = {};                                   // состояние каждой станции
STATIONS.forEach(s => st[s.id] = {});
const lampState = { lit: 0, colors: [] };
let done = [];                                   // id пройденных станций
let finished = false;

const pathX = y => 60 + Math.sin(y * .017) * 9 + Math.sin(y * .0061) * 5;

/** Куда встать героине. Внутри мира — слева от предмета действия. */
const STAND_X = 32;
function walkerX(wy) {
  const b = blockAt(wy);
  if (!b || b.kind !== 'world' || b.id === 'stairs' || b.id === 'lamp') return pathX(wy);
  const into = Math.min(wy - b.top, b.top + b.h - wy);
  return lerp(pathX(wy), STAND_X, sstep(6, 44, into));
}

function layout() {
  const vw = Math.min(innerWidth, 720), vh = innerHeight;
  scale = clamp(Math.min(Math.floor(vw / W), Math.floor(vh / 190)), 2, 6);
  AH = Math.ceil(vh / scale);
  stage.width = W; stage.height = AH;
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (AH * scale) + 'px';
  sctx.imageSmoothingEnabled = false;

  const worldBlock = Math.max(215, AH);
  const road = Math.max(120, Math.round(AH * .55));
  blocks = [];
  let y = 0;
  const push = (kind, id, hh, station) => { blocks.push({ kind, id, top: y, h: hh, station }); y += hh; };

  push('road', 'road', Math.round(road * 1.2));
  STATIONS.forEach(s => {
    push('world', s.scene, worldBlock, s);
    push('road', 'road', road);
  });
  push('world', 'stairs', Math.round(AH * 1.7));
  push('world', 'lamp', AH);
  worldH = y;

  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    b.cache = null;
    if (b.kind === 'world') { b.focus = b.top + Math.round((b.h - AH) / 2); continue; }
    const nxt = blocks[i + 1];                       // цвет мира, к которому ведёт дорога
    b.st = nxt && nxt.station ? { fire: nxt.station.fire } : {};
  }
  recomputeGate();
  applyBodyHeight();
}

function stationBlocks() { return blocks.filter(b => b.station); }
function lampBlock() { return blocks.find(b => b.id === 'lamp'); }

function recomputeGate() {
  const next = stationBlocks().find(b => !done.includes(b.station.id));
  maxCam = next ? next.focus : lampBlock().focus;
}
function applyBodyHeight() {
  spacer.style.height = ((maxCam + AH) * scale) + 'px';
}

function blockCache(b) {
  if (b.cache) return b.cache;
  const c = document.createElement('canvas');
  c.width = W; c.height = b.h;
  const cc = c.getContext('2d');
  cc.imageSmoothingEnabled = false;
  (SCENES[b.id] || SCENES.road).paint(cc, b.h);
  b.cache = c;
  return c;
}

/* ── Отрисовка кадра ─────────────────────────────────────────── */
let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  cam = window.scrollY / scale;

  sctx.fillStyle = '#04070d';
  sctx.fillRect(0, 0, W, AH);

  for (const b of blocks) {
    if (b.top + b.h < cam || b.top > cam + AH) continue;
    const off = Math.round(b.top - cam);
    sctx.save();
    sctx.translate(0, off);
    sctx.beginPath(); sctx.rect(0, 0, W, b.h); sctx.clip();
    sctx.drawImage(blockCache(b), 0, 0);
    const sc = SCENES[b.id];
    if (sc && sc.anim) {
      const state = b.station ? st[b.station.id]
        : b.id === 'lamp' ? lampState : (b.st || {});
      sc.anim(sctx, b.h, reduced ? 0 : t, state);
    }
    sctx.restore();
  }

  drawBeam(t);
  drawWalker(t);
  requestAnimationFrame(frame);
}

/** Луч-тропа: лежит на воде между мирами, гаснет внутри сцен. */
function drawBeam(t) {
  for (let sy = 0; sy < AH; sy++) {
    const wy = cam + sy;
    const b = blockAt(wy);
    if (!b) continue;
    const inWorld = b.kind === 'world';
    const edge = inWorld
      ? sstep(0, 30, Math.min(wy - b.top, b.top + b.h - wy))
      : 0;
    const strength = .30 * (1 - edge);
    if (strength < .02) continue;
    const x = pathX(wy);
    sctx.globalAlpha = strength;
    sctx.fillStyle = '#8fb8e0';
    sctx.fillRect(Math.round(x) - 5, sy, 11, 1);
    sctx.globalAlpha = strength * 1.9;
    sctx.fillStyle = '#dbeaf8';
    sctx.fillRect(Math.round(x) - 1, sy, 3, 1);
  }
  sctx.globalAlpha = 1;
}

function drawWalker(t) {
  if (finished) return;
  const sy = Math.round(AH * .58);
  const wy = cam + sy;
  const b = blockAt(wy);
  if (b && (b.id === 'lamp')) return;
  const moving = Math.abs(cam - lastCam) > .12;
  if (moving) walkPhase += .35;
  lastCam = cam;
  const art = (Math.floor(walkPhase) % 2) ? SPR.walkB : SPR.walkA;
  const bob = (Math.floor(walkPhase) % 2) ? 1 : 0;
  const x = Math.round(walkerX(wy)) - 3;
  drawSpr(sctx, art, x, sy - sprH(art) + bob, { '#': '#e8dcc0' }, 1);
  sctx.globalAlpha = .35;
  sctx.fillStyle = '#04070d';
  sctx.fillRect(x - 1, sy + bob, 7, 1);
  sctx.globalAlpha = 1;
}

function blockAt(y) {
  for (const b of blocks) if (y >= b.top && y < b.top + b.h) return b;
  return null;
}

/* ── Станции: приход, действие, печать ───────────────────────── */
function tick() {
  if (finished) return;
  const nextStation = stationBlocks().find(b => !done.includes(b.station.id));
  if (nextStation && !active && cam >= nextStation.focus - 3) enter(nextStation);
  if (!nextStation && !finished && cam >= lampBlock().focus - 3) startFinale();
}

function enter(b) {
  active = b;
  const s = b.station;
  sayEl.textContent = s.say;
  sayEl.classList.add('on');
  hintEl.textContent = s.hint;
  hintEl.classList.remove('on');
  stage.style.touchAction = 'none';
  if (s.act === 'still') beginStill();
  clearTimeout(enter._h);
  if (s.hint) enter._h = setTimeout(() => hintEl.classList.add('on'), 2600);
}

function complete() {
  const s = active.station;
  const state = st[s.id];
  state.done = true;
  const fire = (s.options && state.pick != null) ? s.options[state.pick].fire : s.fire;
  state.fire = fire;
  done.push(s.id);
  save();
  fillSlot(done.length - 1, fire);

  hintEl.classList.remove('on');
  sayEl.classList.remove('on');
  clearTimeout(enter._h);

  setTimeout(() => {
    document.getElementById('sealText').textContent = s.quote;
    document.getElementById('sealSrc').textContent = s.src;
    document.getElementById('sealGot').textContent = TEXT.taken;
    sealEl.classList.add('on');
  }, 620);

  setTimeout(() => {
    sealEl.classList.remove('on');
    active = null;
    stage.style.touchAction = '';
    recomputeGate();
    applyBodyHeight();
    hintEl.textContent = 'Веди вверх';
    hintEl.classList.add('on');
    setTimeout(() => hintEl.classList.remove('on'), 4200);
  }, 4200);
}

/* ── Жесты ───────────────────────────────────────────────────── */
let ptr = null;

function artPoint(e) {
  const r = stage.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / scale,
    y: (e.clientY - r.top) / scale + cam
  };
}
function sceneY(p) { return p.y - active.top; }

stage.addEventListener('pointerdown', e => {
  if (!active) return;
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  const s = active.station, state = st[s.id], p = artPoint(e), sy = sceneY(p);
  ptr = { x0: p.x, y0: sy, x: p.x, y: sy, t: performance.now() };

  if (s.act === 'hold') { state.holding = true; }
  if (s.act === 'still') { rippleNow(); }
  if (s.act === 'choice') {
    // щедрые зоны: промахнуться пальцем нельзя
    SCENES.niichavo.spots(active.h).forEach((sp, i) => {
      if (state.pick != null) return;
      if (Math.abs(p.x - sp.x) < 12 && sy > sp.y - 10 && sy < sp.y + 26) {
        state.pick = i; complete();
      }
    });
  }
  if (s.act === 'taps') {
    const c = SCENES.desert.crystal(active.h);
    if (Math.abs(p.x - c.x) < 20 && sy > c.y - 32 && sy < c.y + 16) {
      state.taps = clamp((state.taps || 0) + 1, 0, 6);
      if (state.taps >= 6) complete();
    }
  }
  if (s.act === 'draw') {
    state.marks = state.marks || [false, false, false, false, false];
    markRune(p.x, sy, state);
  }
}, { passive: false });

stage.addEventListener('pointermove', e => {
  if (!active || !ptr) return;
  e.preventDefault();
  const s = active.station, state = st[s.id], p = artPoint(e), sy = sceneY(p);
  ptr.x = p.x; ptr.y = sy;

  if (s.act === 'pull') {
    const d = clamp((sy - ptr.y0) / 34, 0, 1);
    state.pull = Math.max(state.pull || 0, d);
    if (state.pull >= 1 && !state.done) setTimeout(() => { if (!state.done) complete(); }, 900);
  }
  if (s.act === 'draw') markRune(p.x, sy, state);
  if (s.act === 'fan') {
    if (ptr.y0 - sy > 15) {                          // короткого взмаха достаточно
      state.fan = clamp((state.fan || 0) + 1, 0, 3);
      ptr.y0 = sy;
      if (state.fan >= 3) complete();
    }
  }
}, { passive: false });

function endPtr() {
  if (!active) { ptr = null; return; }
  const s = active.station, state = st[s.id];
  if (s.act === 'hold') state.holding = false;
  ptr = null;
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);

function markRune(x, y, state) {
  SCENES.westeros.runePts(active.h).forEach((pt, i) => {
    if (Math.abs(x - pt.x) < 9 && Math.abs(y - pt.y) < 10) state.marks[i] = true;
  });
  if (state.marks.every(Boolean) && !state.done) complete();
}
function rippleNow() {
  const state = st.lorien;
  state.ripple = 1;
  state.still = 0;
  clearTimeout(rippleNow._t);
  rippleNow._t = setTimeout(() => { state.ripple = 0; }, 900);
}
function beginStill() {
  const state = st.lorien;
  state.still = 0;
  clearInterval(beginStill._i);
  beginStill._i = setInterval(() => {
    if (!active || active.station.id !== 'lorien' || state.done) { clearInterval(beginStill._i); return; }
    if (state.ripple > 0) return;
    state.still = clamp(state.still + .022, 0, 1);
    if (state.still >= 1) { clearInterval(beginStill._i); complete(); }
  }, 100);
}

/* удержание свечи */
setInterval(() => {
  if (!active || active.station.act !== 'hold') return;
  const state = st.moscow;
  if (state.done) return;
  state.progress = clamp((state.progress || 0) + (state.holding ? .035 : -.05), 0, 1);
  if (state.progress >= 1) complete();
}, 60);

/* ── Сумка ───────────────────────────────────────────────────── */
function buildBag() {
  bagEl.innerHTML = '';
  for (let i = 0; i < STATIONS.length; i++) {
    const d = document.createElement('span');
    d.className = 'slot';
    bagEl.appendChild(d);
  }
}
function fillSlot(i, col) {
  const s = bagEl.children[i];
  if (!s) return;
  s.classList.add('full');
  s.style.background = col;
  s.style.boxShadow = '0 0 10px 2px ' + col + '88';
}

/* ── Сохранение ──────────────────────────────────────────────── */
const KEY = 'lighthouse.journey.v1';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      done, pick: st.niichavo.pick == null ? null : st.niichavo.pick
    }));
  } catch (e) {}
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!r || !Array.isArray(r.done)) return;
    done = r.done.filter(id => STATIONS.some(s => s.id === id));
    if (r.pick != null) st.niichavo.pick = r.pick;
    done.forEach(id => {
      const s = STATIONS.find(x => x.id === id);
      st[id].done = true;
      st[id].progress = 1; st[id].taps = 6; st[id].pull = 1; st[id].fan = 3; st[id].still = 1;
      st[id].marks = [true, true, true, true, true];
      st[id].fire = (s.options && st[id].pick != null) ? s.options[st[id].pick].fire : s.fire;
    });
  } catch (e) {}
}

document.getElementById('reset').addEventListener('click', () => {
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
});

/* ═══════════════════════════════════════════════════════════════
   ПРОЛОГ
   ═══════════════════════════════════════════════════════════════ */
const proEl = document.getElementById('prologue');
const proArt = document.getElementById('prologueArt');
const proLine = document.getElementById('prologueLine');
const proGo = document.getElementById('prologueGo');
const pctx = proArt.getContext('2d');
let proBeat = 0, proT0 = performance.now(), proRunning = true;

function proLayout() {
  proArt.width = W; proArt.height = AH;
  proArt.style.width = (W * scale) + 'px';
  proArt.style.height = (AH * scale) + 'px';
  pctx.imageSmoothingEnabled = false;
}

function proFrame(now) {
  if (!proRunning) return;
  const t = (now - proT0) / 1000;
  const h = AH, hz = Math.round(h * .52);

  vgrad(pctx, 0, hz, '#04070f', '#0b1b2e', 7);
  scatter(pctx, '#cfd8e4', 60, 0, 0, W, hz - 8, 5);
  vgrad(pctx, hz, h, '#0a1826', '#050a12', 6);

  const rockY = Math.round(h * .62);
  drawRock(pctx, 60, rockY, 35);
  const lampY = drawTower(pctx, 60, rockY, 50);

  let lampOn = 1, beamAlpha = .22;
  if (proBeat === 0) { beamAlpha = .20 + Math.sin(t * 1.2) * .04; }
  if (proBeat === 1) { const k = clamp(t / 2.6, 0, 1); lampOn = 1 - k; beamAlpha = .20 * (1 - k); }
  if (proBeat >= 2) { lampOn = 0; beamAlpha = 0; }

  drawBeams(pctx, 60, lampY, beamAlpha, t * .5, 110, '#ffe0a0');
  drawLamp(pctx, 60, lampY, lampOn, '#ffe6a8');

  const sea0 = rockY + 16;
  drawSea(pctx, sea0, h, '#1d3f5e');
  if (lampOn > .1) reflect(pctx, 60, sea0, h, '#ffd27a', lampOn * .5);

  // темнота идёт от горизонта вниз
  if (proBeat === 1) {
    const k = clamp((t - .8) / 2.4, 0, 1);
    pctx.globalAlpha = .92;
    pctx.fillStyle = '#04070d';
    pctx.fillRect(0, hz, W, Math.round((h - hz) * k));
    pctx.fillRect(0, hz - Math.round(hz * k * .9), W, Math.round(hz * k * .9));
    pctx.globalAlpha = 1;
  }
  if (proBeat >= 2) {
    // гасим сцену, но не в ноль: маяк должен угадываться
    pctx.globalAlpha = .84; pctx.fillStyle = '#04070d'; pctx.fillRect(0, 0, W, h); pctx.globalAlpha = 1;

    // последний луч лежит на воде: широкий у ног, сходится к маяку
    const k = clamp((t - .4) / 2.0, 0, 1);
    const apexY = rockY - 4;
    for (let y = h - 1; y > apexY; y--) {
      const q = (h - y) / (h - apexY);
      if (q > k) break;
      const taper = 1 - q * .88;
      const wd = Math.max(1, Math.round(13 * taper));
      const x = Math.round(60 + Math.sin(y * .010) * 2.5 * taper);
      pctx.globalAlpha = .26 * taper + .06;
      pctx.fillStyle = '#7fa8d4'; pctx.fillRect(x - (wd >> 1), y, wd, 1);
      pctx.globalAlpha = .50 * taper + .12;
      pctx.fillStyle = '#dbeaf8';
      pctx.fillRect(x - Math.max(0, (wd >> 2)), y, Math.max(1, wd >> 1), 1);
    }
    pctx.globalAlpha = 1;
  }
  requestAnimationFrame(proFrame);
}

function proShow(i) {
  proBeat = i;
  proT0 = performance.now();
  proLine.classList.remove('on');
  proGo.classList.remove('on');
  setTimeout(() => {
    proLine.textContent = TEXT.prologue[i];
    proLine.classList.add('on');
  }, 500);
  const wait = i === 0 ? 2600 : i === 1 ? 3600 : 2600;
  setTimeout(() => {
    proGo.textContent = i === 2 ? TEXT.prologueGo : 'Дальше';
    proGo.classList.add('on');
  }, wait);
}
proGo.addEventListener('click', () => {
  if (proBeat < 2) proShow(proBeat + 1);
  else {
    proRunning = false;
    proEl.hidden = true;
    hintEl.textContent = 'Веди вверх';
    hintEl.classList.add('on');
    setTimeout(() => hintEl.classList.remove('on'), 5000);
  }
});

/* ═══════════════════════════════════════════════════════════════
   ФИНАЛ
   ═══════════════════════════════════════════════════════════════ */
const finEl = document.getElementById('finale');
const finArt = document.getElementById('finaleArt');
const fctx = finArt.getContext('2d');
let finT0 = 0, finBeat = 0, finRunning = false;

function startFinale() {
  if (finished) return;
  finished = true;
  sayEl.classList.remove('on');
  hintEl.classList.remove('on');
  lampState.colors = STATIONS.map(s => st[s.id].fire || s.fire);
  lampState.lit = 0;

  finArt.width = W; finArt.height = AH;
  finArt.style.width = (W * scale) + 'px';
  finArt.style.height = (AH * scale) + 'px';
  fctx.imageSmoothingEnabled = false;

  finEl.hidden = false;
  finBeat = 0; finT0 = performance.now(); finRunning = true;
  requestAnimationFrame(finFrame);

  // артефакты встают по одному
  for (let i = 0; i < 7; i++) setTimeout(() => { lampState.lit = i + 1; }, 900 + i * 780);
  setTimeout(() => { finBeat = 1; finT0 = performance.now(); }, 900 + 7 * 780 + 500);   // схождение
  setTimeout(() => { finBeat = 2; finT0 = performance.now(); }, 900 + 7 * 780 + 2100);  // отъезд
  setTimeout(() => {
    renderLabel(document.getElementById('finaleTitle'), TEXT.finaleTitle, Math.max(2, scale - 1), '#e0a94a');
    document.getElementById('finaleWish').textContent = TEXT.finaleWish;
    document.getElementById('finaleStack').classList.add('on');
  }, 900 + 7 * 780 + 5200);
}

function finFrame(now) {
  if (!finRunning) return;
  const t = (now - finT0) / 1000;
  const h = AH;
  fctx.fillStyle = '#04070d'; fctx.fillRect(0, 0, W, h);

  if (finBeat < 2) {
    const b = lampBlock();
    fctx.drawImage(blockCache(b), 0, 0, W, b.h, 0, 0, W, h);
    SCENES.lamp.anim(fctx, h, t, lampState);
    if (finBeat === 1) {
      const k = clamp(t / 1.4, 0, 1);
      const cy = Math.round(h * .48);
      SCENES.lamp.sockets(h).forEach((s, i) => {
        const x = Math.round(lerp(s.x, 60, k)), y = Math.round(lerp(s.y, cy, k));
        disc(fctx, x, y, 3, lampState.colors[i]);
      });
      fctx.globalAlpha = k;
      disc(fctx, 60, cy, 10 + k * 16, '#ffffff');
      fctx.globalAlpha = 1;
    }
  } else {
    // общий план: маяк снова горит. Композиция ниже — сверху ляжет текст
    const k = clamp(t / 2.2, 0, 1);
    const hz = Math.round(h * .66);
    vgrad(fctx, 0, hz, '#04070f', '#0e2338', 7);
    scatter(fctx, '#cfd8e4', 74, 0, 0, W, hz - 14, 5);
    vgrad(fctx, hz, h, '#0b1c2e', '#050b14', 6);

    // семь огней вдоль горизонта — пройденный путь
    lampState.colors.forEach((c, i) => {
      const x = 11 + i * 16, y = hz - 4 - (i % 2) * 2;
      glow(fctx, x, y, 4 + Math.abs(Math.sin(t * 1.6 + i)) * 1.5, c, k * .7);
      fctx.globalAlpha = k;
      fctx.fillStyle = c; fctx.fillRect(x, y, 1, 1);
      fctx.globalAlpha = 1;
    });

    const rockY = Math.round(h * .80);
    drawRock(fctx, 60, rockY, 30, 311);
    const lampY = drawTower(fctx, 60, rockY, 40);
    drawBeams(fctx, 60, lampY, .28 * k, t * .45, 130, '#ffffff');
    drawLamp(fctx, 60, lampY, k, '#fff6d8');

    drawSea(fctx, rockY + 14, h, '#1d3f5e');
    reflect(fctx, 60, rockY + 16, h, '#ffffff', k * .55);
  }
  requestAnimationFrame(finFrame);
}

/* ═══════════════════════════════════════════════════════════════
   ЗАПУСК
   ═══════════════════════════════════════════════════════════════ */
function boot() {
  load();
  buildBag();
  layout();
  proLayout();
  done.forEach((id, i) => {
    const s = STATIONS.find(x => x.id === id);
    fillSlot(i, st[id].fire || s.fire);
  });
  if (done.length) {
    proRunning = false;
    proEl.hidden = true;
    window.scrollTo(0, Math.max(0, (maxCam - AH * .4) * scale));
  } else {
    proShow(0);
    requestAnimationFrame(proFrame);
  }
  requestAnimationFrame(frame);
  setInterval(tick, 90);
}

let resizeT;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const ratio = window.scrollY / Math.max(1, spacer.offsetHeight);
    layout(); proLayout();
    window.scrollTo(0, ratio * spacer.offsetHeight);
  }, 160);
});

boot();
</script>
