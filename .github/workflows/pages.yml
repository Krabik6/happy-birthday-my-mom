name: Pages

on:
  push:
    branches: [claude/hello-dgx378]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить ветку gh-pages
        run: git push --force origin HEAD:gh-pages
